version: 1
kit:
  id: 1
  key: default
  name: Default Omakiten Kit
config:
  output:
    json_minified: true
    omit_empty: true
  context:
    default_level: 2
    max_tokens: 12000
  workflow:
    active: default
  theme:
    active: catppuccin-macchiato
workflows:
  - id: 1
    key: default
    name: Default Workflow
    buckets:
      - id: 1
        key: backlog
        name: Backlog
        position: 1
      - id: 2
        key: dev
        name: Development
        position: 2
      - id: 3
        key: review
        name: Review
        position: 3
      - id: 4
        key: done
        name: Done
        position: 4
    transitions:
      - from: 1
        to: 2
      - from: 2
        to: 3
      - from: 3
        to: 4
      - from: 3
        to: 2
skills:
  - go
  - sqlite
  - cli
laws:
  - project-scope-only
  - workflow-enforced
  - yaml-is-canonical
personas:
  - slug: backend-agent
    skills:
      - go
      - sqlite
      - cli
