version: 1
kit:
  id: 1
  key: default
  name: Default Omakiten Kit
config:
  output:
    json_minified: true
    omit_empty: true
  context:
    default_level: 2
    max_tokens: 12000
  # mcp tunes how MCP responses are shaped to fit the agent's context window.
  # Every field is optional — omit a key to keep the canonical default. See
  # `.docs/configuration-guide.md#configmcp` for full semantics and worked
  # examples; in short:
  #
  #   recent_comment_limit         (int, default 5)   cap on comments shipped
  #                                                   per tasks.continue /
  #                                                   project.overview call.
  #   max_comment_chars            (int, default 0)   truncate comment bodies
  #                                                   past this length with `…`
  #                                                   (0 = full bodies). Use
  #                                                   on tasks with verbose
  #                                                   #resume / #documentation.
  #   include_workflow_in_continue (*bool, default true) ship the workflow
  #                                                   block in tasks.continue.
  #                                                   Set false once /okt
  #                                                   loaded the workflow for
  #                                                   the session.
  #   cache_prompts                (*bool, default true) emit the Anthropic
  #                                                   `cache_control` hint on
  #                                                   prompts/get content so
  #                                                   aware clients reuse the
  #                                                   cached prompt.
  #
  # mcp:
  #   recent_comment_limit: 3
  #   max_comment_chars: 500
  #   include_workflow_in_continue: false
  #   cache_prompts: true
  workflow:
    active: default
  theme:
    active: omakiten
  # tui tunes terminal UI presentation. Every field is optional — omit a key
  # to keep the canonical default. token_badge controls the colored TOKENS:N
  # badge on entity cards: above red_at → red; above yellow_at → yellow; else
  # green. Calibrated for the default kit; raise both numbers if you author
  # heavier laws/personas, lower them if you keep entities terse.
  tui:
    token_badge:
      yellow_at: 150
      red_at: 400
  # template_defaults declares the kinds the user can assign in the TUI
  # picker. Each loaded template can claim at most one (kind, project) pair
  # via its frontmatter (`default: <kind>`, optional `project: <slug>`).
  # Defaults below match the canonical Omakiten kit; tweak as needed.
  template_defaults: [task, pr, comment-resume, comment-selfbranch, comment-documentation]
  # views configures the default sort and filter applied to each view at
  # startup. Every field is optional — omit a section and the canonical
  # default takes over. Field/order values are validated; typos surface
  # with a descriptive error instead of being silently ignored.
  #
  # views:
  #   board:
  #     sort:
  #       field: created_at   # id | title | priority | created_at
  #       order: desc         # asc | desc
  #     filter:
  #       priority: []        # [] = all | subset of [low, normal, high]
  #   table:
  #     sort:
  #       field: created_at
  #       order: desc
  #     filter:
  #       priority: []
  #       bucket: []          # [] = all | subset of bucket keys in the active workflow
  #   graph:
  #     sort:
  #       field: id           # id | title (only)
  #       order: asc
  #   logs:
  #     sort:
  #       order: desc         # only direction is configurable for logs
  #     limit: 50
  #     filter:
  #       source: []          # [] = all | subset of [cli, tui, mcp]
  #   task_activity:
  #     sort:
  #       order: asc          # asc = chronological | desc = newest first
workflows:
  - id: 1
    key: default
    name: Default Workflow
    # defaults declares the workflow-level fallback for task/comment edit
    # and delete. Resolution order: bucket.permissions → workflow.defaults
    # → implicit `true` (no rule = allow). The default kit ships strict
    # defaults so a brand-new task respects "edit only in backlog" out of
    # the box; per-bucket `permissions:` overrides relax this where the
    # workflow author wants to allow edits/deletes elsewhere.
    defaults:
      task:
        edit: false
        delete: false
      comment:
        edit: false
        delete: false
    buckets:
      - id: 1
        key: backlog
        name: Backlog
        position: 1
        # Backlog opts in to edit/delete on both task and comment so the
        # planning bucket can be freely reshaped before work starts. Move
        # the task to dev/review/done to lock the description & threads.
        permissions:
          task:
            edit: true
            delete: true
          comment:
            edit: true
            delete: true
      - id: 2
        key: dev
        name: Development
        position: 2
        # Allow comment edit/delete during dev so the agent can correct
        # in-flight notes; task fields stay locked (use archive/unarchive
        # for major edits).
        permissions:
          comment:
            edit: true
            delete: true
      - id: 3
        key: review
        name: Review
        position: 3
      - id: 4
        key: done
        name: Done
        position: 4
    transitions:
      - from: 1
        to: 2
        guards:
          - type: comments_tagged
            tag: self-branch
            count: 1
            hint: "Before starting, create a dedicated feature branch or git worktree for this task and add a comment tagged #self-branch documenting the branch name and working path."
      - from: 2
        to: 3
        guards:
          - type: comments_tagged
            tag: resume
            count: 1
            hint: "Add a comment tagged #resume summarizing what was implemented, decisions made, and any open questions before requesting review."
      - from: 3
        to: 4
        guards:
          - type: comments_tagged
            tag: documentation
            count: 1
            hint: "Add a comment tagged #documentation summarizing: commits merged (commit IDs), related tags (kebab-case), and confirmation that the task has been reviewed and properly tagged."
      - from: 3
        to: 2
      - from: 4
        to: 3
# skills:, laws: and personas: are optional. When omitted, every .md file in
# skills/, laws/ and personas/ is loaded automatically — drop a file into the
# folder and it becomes available. Uncomment a slot to act as a strict allowlist
# (only listed slugs activate) or to declare explicit persona ⇄ skill/law wiring.
#
# skills:
#   - go
#   - sqlite
#   - cli
# laws:
#   - project-scope-only
#   - workflow-enforced
#   - yaml-is-canonical
personas:
  - slug: engineer
    skills:
      - implementation
      - markdown
  - slug: product-owner
    skills:
      - discovery
      - user-story-writing
      - markdown
  - slug: documentation-agent
    skills:
      - documentation
      - architecture-mapping
      - requirements-mapping
      - readme-curation
      - markdown
# mcp_commands binds each `okt-*` MCP prompt to a persona, a set of laws, and a
# set of templates. The reserved `global:` entry declares laws inherited by
# every command. Per-command entries can add `laws:` or opt out of inherited
# laws via `laws_disabled:` (e.g. `okt-imagine` skips template-fidelity so the
# discovery flow can sketch freely).
#
# The default kit follows a REST-style handoff pattern: each command resolves
# one role and ends its action text by suggesting the next command. Cycle:
#
#   okt → okt-resume / okt-imagine
#     okt-imagine → okt-create
#       okt-create → (move to dev → guard) → okt-continue / okt-implement
#         okt-resume → okt-continue
#           okt-continue → okt-implement
#             okt-implement → (move to review → guard)
#   okt-document is parallel — surfaces drift; if material work is needed,
#   suggests okt-create to spin up a documentation task.
#   okt-config is parallel — orients the agent on the config layout so it can
#   answer edit questions without guessing; suggests okt-implement when the
#   user has a concrete edit in mind.
mcp_commands:
  global:
    laws:
      - template-fidelity
      - authorize-remote-writes
  okt:
    persona: engineer
  okt-imagine:
    persona: product-owner
    laws_disabled:
      - template-fidelity
  okt-create:
    persona: product-owner
    templates:
      - user-story
  okt-resume:
    persona: engineer
  okt-continue:
    persona: engineer
  okt-implement:
    persona: engineer
    laws:
      - bounded-self-review
      - no-silent-behavior-changes
      - conventional-commits
      - self-report
    templates:
      - pull-request
  okt-document:
    persona: documentation-agent
  okt-config:
    persona: documentation-agent
    templates:
      - config-orientation
