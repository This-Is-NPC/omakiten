version: 1
kit:
  id: 1
  key: default
  name: Default Omakiten Kit
config:
  output:
    json_minified: true
    omit_empty: true
  context:
    default_level: 2
    max_tokens: 12000
  workflow:
    active: default
  theme:
    active: omakiten
  templates:
    # Slug of the task template (file in templates/<slug>.md) included in
    # tasks_create / tasks_create_intent responses as a scaffold for the agent.
    # Comment out to disable; missing slugs fail validation.
    task: user-story
workflows:
  - id: 1
    key: default
    name: Default Workflow
    buckets:
      - id: 1
        key: backlog
        name: Backlog
        position: 1
      - id: 2
        key: dev
        name: Development
        position: 2
      - id: 3
        key: review
        name: Review
        position: 3
      - id: 4
        key: done
        name: Done
        position: 4
    transitions:
      - from: 1
        to: 2
        guards:
          - type: comments_tagged
            tag: self-branch
            count: 1
            hint: "Before starting, create a dedicated feature branch or git worktree for this task and add a comment tagged #self-branch documenting the branch name and working path."
      - from: 2
        to: 3
        guards:
          - type: comments_tagged
            tag: resume
            count: 1
            hint: "Add a comment tagged #resume summarizing what was implemented, decisions made, and any open questions before requesting review."
      - from: 3
        to: 4
        guards:
          - type: comments_tagged
            tag: documentation
            count: 1
            hint: "Add a comment tagged #documentation summarizing: commits merged (commit IDs), related tags (kebab-case), and confirmation that the task has been reviewed and properly tagged."
      - from: 3
        to: 2
      - from: 4
        to: 3
# skills:, laws: and personas: are optional. When omitted, every .md file in
# skills/, laws/ and personas/ is loaded automatically — drop a file into the
# folder and it becomes available. Uncomment a slot to act as a strict allowlist
# (only listed slugs activate) or to declare explicit persona ⇄ skill/law wiring.
#
# skills:
#   - go
#   - sqlite
#   - cli
# laws:
#   - project-scope-only
#   - workflow-enforced
#   - yaml-is-canonical
personas:
  - slug: backend-agent
    skills:
      - go
      - sqlite
      - cli
