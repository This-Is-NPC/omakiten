# Identity ────────────────────────────────────────────────────────────
name: agent-comment
description: Top-right ASCII kitten that announces agent comments and auto-dismisses after 8s.

# Geometry ────────────────────────────────────────────────────────────
size:
  width: 36         # outer card width in cells (border + padding + content + border)
  height: 10        # used as bubble scroll viewport cap; pinned as outer height when auto_height=false

# Behaviour flags ─────────────────────────────────────────────────────
auto_height: true    # true = card flows to body height (no bottom blank rows). false = lipgloss enforces Size.Height
padding_inside: false # true + auto_height=false = body vertically centered within Size.Height (split blank rows top + bottom)
footer_visible: false # true = render "<keys> to close" hint at the bottom of the card (only meaningful when dismiss.mode=key)

# Background + chrome ─────────────────────────────────────────────────
background: $theme.highlight  # transparent | $theme.<key> | #rrggbb
style: rounded                # rounded | square | double | thick | hidden | custom
border:
  visible: true
  width: 1
  color: $theme.secondary
  background: transparent

# custom_border is consumed ONLY when style: custom — uncomment + fill all 8 sides if you switch to that style.
# custom_border:
#   top: "─"
#   bottom: "─"
#   left: "│"
#   right: "│"
#   top_left: "╭"
#   top_right: "╮"
#   bottom_left: "╰"
#   bottom_right: "╯"

# Inner padding (cells eaten from the frame BEFORE the body renders).
# padding:
#   top: 1
#   right: 2
#   bottom: 1
#   left: 2

# Placement on the terminal grid ──────────────────────────────────────
position: top-right
# top-left | top-center | top-right | middle-left | center | middle-right | bottom-left | bottom-center | bottom-right

# Bubble + tail ───────────────────────────────────────────────────────
bubble:
  tail_side: bottom    # bottom | top | left | right — drives both the tail glyph and the layout direction

# Animation ───────────────────────────────────────────────────────────
frame_interval_ms: 900 # > 0; cadence between frame swaps. Required only when `animation:` has frames.
animation:
  - frame: 0
    value: |2

           /\__/\
          ( o o  )
          (  v   )

  - frame: 1
    value: |2

           /\__/\
          ( -  - )
          (  v   )

# Bubble text ─────────────────────────────────────────────────────────
typing_ms_per_char: 0  # >=0; 0 = show full bubble immediately, >0 = type letter-by-letter

# Pick exactly one of `message` (literal) OR `message_field` (top-level
# payload key). Either layer (this file or the hook entry that names
# this notification) can supply the source — the notification YAML
# wins on tie-break.
# message: "Agent dropped a comment."
message_field: body

# Dismiss ─────────────────────────────────────────────────────────────
dismiss:
  mode: timeout                   # key | timeout | next_status
  # keys: [esc, q, enter, " "]    # required when mode=key
  after_ms: 8000                  # required when mode=timeout
