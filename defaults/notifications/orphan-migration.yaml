# Identity ------------------------------------------------------------
name: orphan-migration
description: Prompt after a config swap when tasks would be orphaned by the new workflow's bucket set.

# Geometry ------------------------------------------------------------
size:
  width: 62
  height: 14

# Behaviour flags -----------------------------------------------------
auto_height: true
padding_inside: true
footer_visible: true
footer_position: center

# Background + chrome -------------------------------------------------
background: transparent
style: rounded
border:
  visible: true
  width: 1
  color: $theme.primary
  background: transparent

# Inner padding -------------------------------------------------------
padding:
  top: 1
  right: 2
  bottom: 1
  left: 2

# Placement on the terminal grid -------------------------------------
position: center

# Bubble + tail -------------------------------------------------------
bubble:
  tail_side: bottom

# Animation -----------------------------------------------------------
frame_interval_ms: 1000
animation:
  - frame: 0
    value: |2

           /\__/\
          ( o.o  )
           > ^ <

# Bubble text ---------------------------------------------------------
typing_ms_per_char: 0

# Dismiss -------------------------------------------------------------
# `esc` is the implicit cancel; pressing it dismisses without running
# either action. The mode stays `key` (no auto-timeout) so the user
# must choose explicitly.
dismiss:
  mode: key
  keys: [esc]

# Actions -------------------------------------------------------------
# Pressing `m` runs `okt workflow orphans --confirm` in-process against
# the same runtime store; the rebind primitive (#100) handles the
# migration plus emits per-task task.migrated events. Pressing `s`
# dismisses with no side effect — the user can re-trigger via the CLI
# later if they change their mind.
actions:
  - key: m
    id: migrate
    label: Migrate
    command: ["workflow", "orphans", "--confirm"]
  - key: s
    id: skip
    label: Skip
