# Identity ------------------------------------------------------------
name: kitten_blocked
description: "${{intl:notifications.kitten_blocked.description}}"

# Geometry ------------------------------------------------------------
size:
  width: 50
  height: 25

# Behaviour flags -----------------------------------------------------
auto_height: false
padding_inside: true
footer_visible: true
footer_position: center

# Background + chrome -------------------------------------------------
background: transparent
style: rounded
border:
  visible: true
  width: 1
  color: $theme.warning
  background: transparent

# Inner padding -------------------------------------------------------
padding:
  top: 1
  right: 2
  bottom: 1
  left: 2

# Placement on the terminal grid -------------------------------------
position: center

# Bubble + tail -------------------------------------------------------
bubble:
  tail_side: bottom

# Animation -----------------------------------------------------------
frame_interval_ms: 650
animation:
  - frame: 0
    value: |2

           /\__/\
          ( - -  )
          (  ~   )

  - frame: 1
    value: |2

           /\__/\
          ( > <  )
          (  ~   )

  - frame: 2
    value: |2

           /\__/\
          ( - -  )
          (  ~   )

# Bubble text ---------------------------------------------------------
typing_ms_per_char: 0

# Dismiss -------------------------------------------------------------
dismiss:
  mode: timeout
  keys: [esc, q, enter, " "]
  after_ms: 15000
