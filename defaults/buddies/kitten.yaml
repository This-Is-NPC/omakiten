name: kitten
description: Playful ASCII kitten — blinks at rest, narrows its eyes when guards bite back.
size:
  width: 22
  height: 8
background: transparent
frame_interval_ms: 600
style: rounded
border:
  visible: true
  width: 1
  color: $theme.primary
  background: transparent
animations:
  idle:
    - frame: 0
      value: |2

             /\___/\
            ( o   o )
            (   v   )
             \ ___ /
              \_/ \_/
               | |

    - frame: 1
      value: |2

             /\___/\
            ( -   - )
            (   v   )
             \ ___ /
              \_/ \_/
               | |

  deny:
    - frame: 0
      value: |2

             /\___/\
            ( x   x )
            (   ~   )
             \ === /
              \_/ \_/
               | |

    - frame: 1
      value: |2

             /\___/\
            ( -   - )
            (   ~   )
             \ === /
              \_/ \_/
               > <

bubble:
  tail_side: bottom
