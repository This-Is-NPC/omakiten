name: owl
description: Wise ASCII owl — slow blinks at rest, narrows its gaze when something looks wrong.
size:
  width: 22
  height: 8
background: transparent
frame_interval_ms: 900
style: rounded
border:
  visible: true
  width: 1
  color: $theme.secondary
  background: transparent
animations:
  idle:
    - frame: 0
      value: |2

             ,___,
            ( o,o )
            ( "-" )
            -"-"-"-

    - frame: 1
      value: |2

             ,___,
            ( -,- )
            ( "-" )
            -"-"-"-

  deny:
    - frame: 0
      value: |2

             ,___,
            ( O,O )
            ( /-\ )
            -"-"-"-

    - frame: 1
      value: |2

             ,___,
            ( <,< )
            ( /-\ )
            -"-"-"-

bubble:
  tail_side: bottom
