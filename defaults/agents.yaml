# How to call each agent harness and launcher. Omakiten never chooses one:
# a role, the preset, or the user's preferences name it. Preferences and
# presets override these templates by name; see docs/how-to-run-agent-teams.md.
harnesses:
  claude-code:
    argv: [claude, [--model, "{model}"], --, "{prompt}"]
  opencode:
    argv: [opencode, [-m, "{model}"], --prompt, "{prompt}", "{cwd}"]
launchers:
  tmux:
    open: [tmux, new-window, -d, -P, -F, "#{pane_id}", [-t, "{target}"], -c, "{cwd}", -n, "{label}", "{command}"]
    send: [tmux, send-keys, -t, "{pane}", -l, "{text}"]
    submit: [tmux, send-keys, -t, "{pane}", Enter]
  herdr:
    open: [herdr, tab, create, --cwd, "{cwd}", --label, "{label}", --no-focus]
    pane: result.root_pane.pane_id
    run: [herdr, pane, run, "{pane}", "{command}"]
    send: [herdr, pane, send-text, "{pane}", "{text}"]
    submit: [herdr, pane, send-keys, "{pane}", enter]
