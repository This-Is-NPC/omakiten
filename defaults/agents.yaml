# How to run each agent harness headless: the seat does its work through
# the board and exits. Omakiten never chooses one: a role, the preset, or
# the user's preferences name it. Preferences and presets override these
# templates by name; see docs/how-to-run-agent-teams.md.
harnesses:
  claude-code:
    argv: [claude, -p, --output-format, stream-json, --verbose, --permission-mode, acceptEdits, --allowedTools, "Bash(okt *)", [--model, "{model}"], --, "{prompt}"]
  codex:
    argv: [codex, exec, --json, --skip-git-repo-check, --sandbox, workspace-write, --add-dir, "{store_dir}", --cd, "{cwd}", [--model, "{model}"], --, "{prompt}"]
  opencode:
    argv: [opencode, run, --format, json, --auto, [--model, "{model}"], --, "{prompt}"]
