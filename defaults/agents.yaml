# Agent adapters Omakiten ships. Preferences and presets override them by
# name; see docs/how-to-run-agent-teams.md.
defaults:
  harness: claude-code
  launcher: tmux
harnesses:
  claude-code:
    argv: [claude, [--model, "{model}"], --, "{prompt}"]
  opencode:
    argv: [opencode, [-m, "{model}"], --prompt, "{prompt}", "{cwd}"]
launchers:
  tmux:
    open: [tmux, new-window, -d, -P, -F, "#{pane_id}", [-t, "{target}"], -c, "{cwd}", -n, "{label}", "{command}"]
    send: [tmux, send-keys, -t, "{pane}", "{text}", Enter]
  herdr:
    open: [herdr, tab, create, --cwd, "{cwd}", --label, "{label}", --no-focus]
    pane: result.root_pane.pane_id
    run: [herdr, pane, run, "{pane}", "{command}"]
    send: [herdr, pane, run, "{pane}", "{text}"]
