# Shared config base — merged into every preset via:
#   config:
#     merge_from: ./modules/base-config.yaml
#     workflow:
#       active: <preset-key>          # only preset-specific override
#     hooks: [...]                    # preset-specific (uses preset-name intl keys)
#
# Keys absent here (workflow:, hooks:) must be declared in the importing preset.
# Keys present here may be overridden by sibling keys in the importing preset
# (deep-merge: target wins on conflict, nested mappings are merged recursively).
output:
  json_minified: true
  omit_empty: true
context:
  default_level: 2
  max_tokens: 12000
# mcp tunes how MCP responses are shaped to fit the agent's context
# window. Every field is REQUIRED — the validator rejects bundles that
# omit any. The values below are the canonical kit; tune them in your
# local omakiten.yaml to compress payloads for narrow contexts.
mcp:
  recent_comment_limit: 5            # > 0; cap on comments shipped per call
  max_comment_chars: 0               # >= 0; 0 = no truncation
  include_workflow_in_continue: true # ship workflow block in tasks.continue
  cache_prompts: true                # emit Anthropic cache_control hint
  recent_context_limit: 3            # > 0; recent context entries shipped
  next_work_limit: 5                 # > 0; "likely next work" suggestions
  similar_task_limit: 5              # > 0; similar-task hints on create_intent
theme:
  active: omakiten
# tui tunes terminal UI presentation. token_badge controls the colored TOKENS:N
# badge on entity cards: above red_at → red; above yellow_at → yellow; else green.
tui:
  token_badge:
    yellow_at: 150
    red_at: 400
# sqlite tunes connection-level engine knobs the Store applies at Open.
# busy_timeout_ms is the value passed to PRAGMA busy_timeout; raise it on
# systems with concurrent writers or larger DBs that occasionally see
# "database is locked" errors. Other PRAGMAs (foreign_keys, journal_mode,
# synchronous) stay in code because they describe correctness invariants
# rather than user preference.
sqlite:
  busy_timeout_ms: 5000
  # cache_size_kb sets PRAGMA cache_size in negative-kilobyte form.
  # 1024 KiB of page cache keeps the TUI's hot tables (tasks, events,
  # task_dependencies) hot across the keystroke read fan-out.
  cache_size_kb: 1024
  # mmap_size_bytes sets PRAGMA mmap_size. 0 disables mmap (default)
  # because mmap interacts poorly with NFS / FUSE mounts; users on
  # local-only filesystems can raise this to e.g. 268435456 (256 MiB)
  # for a measurable read-path win on larger databases.
  mmap_size_bytes: 0
# activity_log retention: prunes the per-call `operation` event log so
# the activity feed stays fast.
activity_log:
  max_rows: 500
  max_age_days: 7
# solutions caps the `solutions.list_top` MCP response shape.
solutions:
  default_top_limit: 10
  max_top_limit: 100
# backup tunes the rolling DB snapshot. retention_count caps snapshots kept
# on disk; set to 0 to disable pruning.
backup:
  retention_count: 5
# events tunes the per-event-type domain log. Per-preset overrides (e.g.
# events.overrides) may be declared as siblings in the importing preset and
# are deep-merged on top of this base via merge_from semantics.
events:
  default_recent_limit: 50
