# search tunes the heuristics shared across agent-side text ranking.
search:
  stopwords:
    - and
    - are
    - for
    - from
    - into
    - the
    - this
    - that
    - with
# tag_synonyms maps non-canonical tag slugs to their canonical form.
tag_synonyms:
  golang: go
  javascript: js
  typescript: ts
  nodejs: node
  node-js: node
  postgres: postgresql
  psql: postgresql
  mongo: mongodb
  k8s: kubernetes
  tf: terraform
  py: python
template_defaults: [task, pr, comment-resume, comment-selfbranch, comment-documentation]
priorities:
  - id: 1
    value: low
    color: success
  - id: 2
    value: normal
    default: true
    color: info
  - id: 3
    value: high
    color: error
severities:
  - id: 1
    value: info
    color: info
  - id: 2
    value: warning
    default: true
    color: warning
  - id: 3
    value: error
    color: error
# views configures the default sort and filter applied to each view at startup.
views:
  board:
    sort:
      field: created_at   # id | title | priority | created_at
      order: desc         # asc | desc
    filter:
      priority: []        # subset of config.priorities[].value; [] = all
  table:
    sort:
      field: created_at
      order: desc
    filter:
      priority: []
      bucket: []          # subset of bucket keys in the active workflow
  graph:
    sort:
      field: id           # id | title (only)
      order: asc
  logs:
    sort:
      order: desc         # only direction is configurable for logs
    limit: 50
    window_days: 30       # default time horizon for the LOGS view (days)
    filter:
      source: []          # subset of [cli, tui, mcp]
  task_activity:
    sort:
      order: asc          # asc = chronological | desc = newest first
