- id: 1
  key: izakaya
  name: Izakaya Workflow
  buckets:
    - {id: 1, key: backlog, name: Backlog, position: 1}
    - {id: 2, key: dev, name: Development, position: 2}
    - {id: 3, key: done, name: Done, position: 3}
  transitions:
    - from: 1
      to: 2
      guards:
        - {type: comments_tagged, tag: hypothesis, count: 1, hint: "${{intl:guard.izakaya.dev.comments_tagged.hypothesis.hint}}"}
        - {type: wave_gate, hint: "${{intl:guard.wave_gate.hint}}"}
    - {from: 2, to: 3}
    - {from: 3, to: 2}
    - {from: 2, to: 1}
    - {from: 3, to: 1}
