version: 1
kit: {id: 102, key: izakaya, name: Izakaya Workflow Preset}
config:
  output: {json_minified: true, omit_empty: true}
  context: {default_level: 2, max_tokens: 12000}
  mcp:
    recent_comment_limit: 5
    max_comment_chars: 0
    include_workflow_in_continue: true
    cache_prompts: true
    recent_context_limit: 3
    next_work_limit: 5
    similar_task_limit: 5
  workflow: {active: izakaya}
  theme: {active: omakiten}
  tui:
    token_badge: {yellow_at: 150, red_at: 400}
  sqlite: {busy_timeout_ms: 5000, cache_size_kb: 1024, mmap_size_bytes: 0}
  activity_log: {max_rows: 500, max_age_days: 7}
  solutions: {default_top_limit: 10, max_top_limit: 100}
  backup: {retention_count: 5}
  events:
    default_recent_limit: 50
    defaults:
      log: true
      broadcast: true
      hook: true
      log_visible: true
      metric: ""
      entity_type: ""
    definitions:
      comment:
        category: comment
        display: "comment added"
        formatter: comment
      comment.edited:
        category: comment
        display: "comment edited"
        formatter: comment.edited
      comment.removed:
        category: comment
        display: "comment removed"
        formatter: comment.removed
      task.created:
        category: task
        display: "task created"
        formatter: task.created
      task.moved:
        category: task
        display: "task moved"
        formatter: task.moved
      task.migrated:
        category: task
        display: "task migrated"
        formatter: task.migrated
      task.bucket_orphaned:
        category: task
        display: "task bucket orphaned"
        formatter: task.bucket_orphaned
      task.completed:
        category: task
        display: "task completed"
        formatter: task.completed
      task.edited:
        category: task
        display: "task edited"
        formatter: task.edited
      task.removed:
        category: task
        display: "task removed"
        formatter: task.removed
      task.archived:
        category: task
        display: "task archived"
        formatter: task.archived
      task.unarchived:
        category: task
        display: "task unarchived"
        formatter: task.unarchived
      task.assigned:
        category: task
        display: "task assigned"
        formatter: task.assigned
      task.unassigned:
        category: task
        display: "task unassigned"
        formatter: task.unassigned
      project.removed:
        category: audit
        display: "project removed"
        formatter: project.removed
      plan.created:
        category: plan
        display: "plan created"
        formatter: plan.created
      plan.wave_added:
        category: plan
        display: "plan wave added"
        formatter: plan.wave_added
      plan.goal_edited:
        category: plan
        display: "plan goal edited"
        formatter: plan.goal_edited
      plan.done:
        category: plan
        display: "plan done"
        formatter: plan.done
      plan.abandoned:
        category: plan
        display: "plan abandoned"
        formatter: plan.abandoned
      plan.edited:
        category: plan
        display: "plan edited"
        formatter: plan.edited
      plan.deleted:
        category: plan
        display: "plan deleted"
        formatter: plan.deleted
      tag.added:
        category: tag-dep
        display: "tag added"
        formatter: tag.added
      tag.removed:
        category: tag-dep
        display: "tag removed"
        formatter: tag.removed
      dependency.added:
        category: tag-dep
        display: "dependency added"
        formatter: dependency.added
      dependency.removed:
        category: tag-dep
        display: "dependency removed"
        formatter: dependency.removed
      guard.violated:
        category: guard
        display: "guard violated"
        formatter: guard.violated
      error.recorded:
        category: audit
        display: "error recorded"
        entity_type: error
        metric: error_recorded
        formatter: error.recorded
      errors.researched:
        category: audit
        display: "errors researched"
        entity_type: search
        metric: error_searched
        formatter: errors.researched
      solution.added:
        category: audit
        display: "solution added"
        entity_type: solution
        metric: solution_added
        formatter: solution.added
      solution.confirmed:
        category: audit
        display: "solution confirmed"
        entity_type: solution
        formatter: solution.confirmed
      solution.liked:
        category: audit
        display: "solution liked"
        entity_type: solution
        metric: solution_liked
        formatter: solution.liked
      solution.failed:
        category: audit
        display: "solution failed"
        entity_type: solution
        metric: solution_failed
        formatter: solution.failed
      solution.viewed_top:
        category: audit
        display: "solution viewed top"
        entity_type: solution
        metric: solution_top_viewed
        formatter: solution.viewed_top
      hook.executed:
        category: hook
        display: "hook executed"
        formatter: hook.executed
      subtask_kit.notice_emitted:
        category: domain
        display: "subtask kit notice emitted"
        formatter: subtask_kit.notice_emitted
      bundle.swapped:
        category: domain
        display: "bundle swapped"
        formatter: bundle.swapped
      bundle.imported:
        category: domain
        display: "bundle imported"
        formatter: bundle.imported
      confirmation.granted:
        category: audit
        display: "confirmation granted"
        formatter: confirmation.granted
      trick.executed:
        category: trick
        display: "trick executed"
        formatter: trick.executed
      cli.tool_call:
        category: tool_call
        display: "CLI tool call"
        formatter: cli.tool_call
      mcp.tool_call:
        category: tool_call
        display: "MCP tool call"
        formatter: mcp.tool_call
      tui.tool_call:
        category: tool_call
        display: "TUI tool call"
        formatter: tui.tool_call
      update.healthcheck.passed:
        category: update
        display: "update health-check passed"
        formatter: update.healthcheck.passed
      update.healthcheck.failed:
        category: update
        display: "update health-check failed"
        formatter: update.healthcheck.failed
      update.swap.completed:
        category: update
        display: "update binary swap completed"
        formatter: update.swap.completed
      update.swap.aborted:
        category: update
        display: "update binary swap aborted"
        formatter: update.swap.aborted
      tui.healthcheck.failed:
        category: tui
        display: "tui boot health-check failed"
        formatter: tui.healthcheck.failed
  hooks:
    - on: task.created
      notification: kitten_informative
      message: "${{intl:notifications.izakaya.task_created.message}}"
    - on: task.moved
      notification: kitten_informative
      message: "${{intl:notifications.izakaya.task_moved.message}}"
    - on: task.edited
      notification: kitten_informative
      message: "${{intl:notifications.izakaya.task_edited.message}}"
    - on: task.completed
      notification: kitten_success
      message: "${{intl:notifications.izakaya.task_completed.message}}"
    - on: guard.violated
      when: { operation: task.delete }
      notification: kitten_destructive
      message: "${{intl:notifications.izakaya.guard_task_delete.message}}"
      detail_message_field: hint
    - on: guard.violated
      when: { operation: comment.delete }
      notification: kitten_destructive
      message: "${{intl:notifications.izakaya.guard_comment_delete.message}}"
      detail_message_field: hint
    - on: guard.violated
      when: { operation: task.transition }
      notification: kitten_blocked
      message: "${{intl:notifications.izakaya.guard_task_transition.message}}"
      detail_message_field: hint
    # Plan-aware specialisation — see omakase.yaml for the rationale.
    - on: guard.violated
      when: { operation: task.transition, rule: wave_gate }
      notification: kitten_blocked
      message: "${{intl:notifications.izakaya.guard_wave_gate.message}}"
      detail_message_field: hint
    - on: guard.violated
      when: { operation: task.edit }
      notification: kitten_blocked
      message: "${{intl:notifications.izakaya.guard_task_edit.message}}"
      detail_message_field: hint
    - on: guard.violated
      when: { operation: comment.edit }
      notification: kitten_blocked
      message: "${{intl:notifications.izakaya.guard_comment_edit.message}}"
      detail_message_field: hint
    - on: guard.violated
      when: { operation: task.archive }
      notification: kitten_blocked
      message: "${{intl:notifications.izakaya.guard_task_archive.message}}"
      detail_message_field: hint
    - on: guard.violated
      when: { operation: task.unarchive }
      notification: kitten_blocked
      message: "${{intl:notifications.izakaya.guard_task_unarchive.message}}"
      detail_message_field: hint
    - on: task.removed
      notification: kitten_destructive
      message: "${{intl:notifications.izakaya.task_removed.message}}"
    - on: comment.removed
      notification: kitten_destructive
      message: "${{intl:notifications.izakaya.comment_removed.message}}"
    - on: task.archived
      notification: kitten_archive
      message: "${{intl:notifications.izakaya.task_archived.message}}"
    - on: task.unarchived
      notification: kitten_archive
      message: "${{intl:notifications.izakaya.task_unarchived.message}}"
    - on: comment
      when: { author_type: human }
      notification: kitten_informative
      message: "${{intl:notifications.izakaya.comment_added_human.message}}"
    - on: comment
      when: { author_type: agent }
      notification: kitten_informative
      message: "${{intl:notifications.izakaya.comment_added_agent.message}}"
    - on: comment.edited
      notification: kitten_informative
      message: "${{intl:notifications.izakaya.comment_edited.message}}"
    - on: tag.added
      notification: kitten_link
      message: "${{intl:notifications.izakaya.tag_added.message}}"
    - on: tag.removed
      notification: kitten_link
      message: "${{intl:notifications.izakaya.tag_removed.message}}"
    - on: dependency.added
      notification: kitten_link
      message: "${{intl:notifications.izakaya.dependency_added.message}}"
    - on: dependency.removed
      notification: kitten_link
      message: "${{intl:notifications.izakaya.dependency_removed.message}}"
    - on: error.recorded
      notification: kitten_knowledge
      message: "${{intl:notifications.izakaya.error_recorded.message}}"
    - on: errors.researched
      notification: kitten_knowledge
      message: "${{intl:notifications.izakaya.errors_researched.message}}"
    - on: solution.added
      notification: kitten_knowledge
      message: "${{intl:notifications.izakaya.solution_added.message}}"
    - on: solution.liked
      notification: kitten_success
      message: "${{intl:notifications.izakaya.solution_liked.message}}"
    - on: solution.failed
      notification: kitten_knowledge
      message: "${{intl:notifications.izakaya.solution_failed.message}}"
    - on: solution.viewed_top
      notification: kitten_knowledge
      message: "${{intl:notifications.izakaya.solution_viewed_top.message}}"
  search:
    stopwords: [and, are, for, from, into, the, this, that, with]
  tag_synonyms:
    golang: go
    javascript: js
    typescript: ts
    nodejs: node
    node-js: node
    postgres: postgresql
    psql: postgresql
    mongo: mongodb
    k8s: kubernetes
    tf: terraform
    py: python
  template_defaults: [task, pr, comment-resume, comment-selfbranch, comment-documentation]
  priorities:
    - {id: 1, value: low, color: success}
    - {id: 2, value: normal, default: true, color: info}
    - {id: 3, value: high, color: error}
  severities:
    - {id: 1, value: info, color: info}
    - {id: 2, value: warning, default: true, color: warning}
    - {id: 3, value: error, color: error}
  views:
    board:
      sort: {field: created_at, order: desc}
      filter: {priority: []}
    table:
      sort: {field: created_at, order: desc}
      filter: {priority: [], bucket: []}
    graph:
      sort: {field: id, order: asc}
    logs:
      sort: {order: desc}
      limit: 50
      window_days: 30
    task_activity:
      sort: {order: asc}
# Izakaya (Howl's Moving Castle) themed roster — #189 W5.3, by canonical role.
# Schema v2: each persona declares a `skill_repertoire` (the full pool it is
# equipped with); mcp_commands below may only select a SUBSET of that pool
# (enforced by validateMCPCommandSkillSubset). The persona carries TONE; the
# skill carries PROCEDURE; templates carry STRUCTURE. The lean izakaya kit
# dual-binds roles onto fewer hands: Calcifer is Concierge + Tester, Markl is
# Owner + Committer, Sophie is Reviewer + Scribe — five persona files cover the
# eight role slots.
personas:
  # Concierge + Tester — the hearth-fire that sees every room and routes work,
  # then proves what burns clean before it ships.
  - slug: calcifer
    schema_version: 2
    skill_repertoire:
      - pdca-cycle
      - discovery
      - regression-detection
      - coverage-analysis
      - static-analysis-discipline
      - test-driven-development
      - markdown
  # Ideator — bold notions chased with a cheap probe first.
  - slug: witch-of-the-waste
    schema_version: 2
    skill_repertoire:
      - discovery
      - lean-experimentation
      - five-w-two-h
      - markdown
  # Owner + Committer — front-desk steward who decides what work is worth taking
  # and in what order, then signs each finished job into the record cleanly.
  - slug: markl
    schema_version: 2
    skill_repertoire:
      - five-w-two-h
      - smart-goals
      - staged-delivery
      - dora-mindset
      - risk-driven-development
      - requirements-elicitation
      - non-functional-requirements
      - moscow-prioritization
      - rice-scoring
      - user-story-writing
      - invest-stories
      - conventional-commits-spec
      - markdown
  # Builder — small bold strokes, trunk kept green, tidies what he passes through.
  - slug: howl-pendragon
    schema_version: 2
    skill_repertoire:
      - implementation
      - test-driven-development
      - trunk-based-development
      - continuous-integration
      - solid-principles
      - code-smells
      - refactoring-catalog
      - castle-tidying
      - markdown
  # Reviewer + Scribe — sees the true shape under the mess, says plainly what
  # needs mending, and keeps the castle's record clear. Repertoire carries all
  # four #359 note skills so the okt-note-* and okt-pause slots resolve.
  - slug: sophie-hatter
    schema_version: 2
    skill_repertoire:
      - code-smells
      - refactoring-catalog
      - security-review-lens
      - solid-principles
      - handoff-synthesis
      - note-capture
      - standup-digest
      - recap-timeline
      - documentation
      - architecture-mapping
      - postmortem-authoring
      - markdown
# Izakaya (Howl's Moving Castle) slot bindings — #189 W5.3. Each command binds
# the themed persona for its canonical role and selects a SUBSET of that
# persona's skill_repertoire. The W1 subset validator enforces skills ⊆
# repertoire. The lean izakaya kit keeps narrow skill subsets and preserves the
# `laws_disabled` opt-outs on the exploration commands.
mcp_commands:
  global:
    laws: [template-fidelity, authorize-remote-writes, project-scope-only]
  okt:
    persona: calcifer
    skills: [pdca-cycle]
  # Guiding orchestrators. okt-start (Concierge smart entry, shared with the bare
  # `okt` shortcut) binds Calcifer (Concierge). okt-shape + okt-audit + okt-run
  # are Owner orchestrators → Markl. okt-pause (Scribe close, synthesises a
  # handoff) binds Sophie (Scribe) — see the Notes block below.
  okt-start:
    persona: calcifer
    skills: [pdca-cycle, discovery]
  okt-shape:
    persona: markl
    skills: [five-w-two-h, smart-goals]
  okt-audit:
    persona: markl
    skills: [risk-driven-development]
  # okt-run Owner director — delegates implementation to per-task Builder
  # subagents and reviews their compact returns.
  okt-run:
    persona: markl
    skills: [staged-delivery, dora-mindset]
  # Granular lifecycle commands. Ideator → Witch of the Waste; Owner → Markl;
  # Builder → Howl. The exploration commands keep their lean `laws_disabled`
  # opt-out so the discovery flow can sketch freely.
  okt-task-imagine:
    persona: witch-of-the-waste
    skills: [discovery, lean-experimentation]
    laws_disabled: [template-fidelity]
  okt-task-research:
    persona: witch-of-the-waste
    skills: [discovery]
    laws_disabled: [template-fidelity]
  okt-task-validate:
    persona: witch-of-the-waste
    skills: [lean-experimentation]
    laws: [cheap-probe-first]
    laws_disabled: [template-fidelity]
  okt-task-requirements:
    persona: markl
    skills: [requirements-elicitation, non-functional-requirements]
  okt-task-prioritize:
    persona: markl
    skills: [moscow-prioritization, rice-scoring]
    templates: [comment-moscow]
  okt-task-create:
    persona: markl
    skills: [user-story-writing, invest-stories, smart-goals]
    laws: [invest-stories]
    templates: [user-story, comment-smart-success, comment-moscow]
  okt-task-decompose:
    persona: markl
    skills: [user-story-writing]
  okt-task-estimate:
    persona: markl
    skills: [rice-scoring]
  okt-task-design:
    persona: howl-pendragon
    skills: [solid-principles]
  okt-project-resume:
    persona: calcifer
    skills: [pdca-cycle]
  okt-project-continue:
    persona: calcifer
    skills: [pdca-cycle]
  # Granular plan commands. Owner role → Markl (authors + claims plans).
  okt-plan-create:
    persona: markl
    skills: [staged-delivery]
  okt-plan-show:
    persona: markl
    skills: [staged-delivery]
  okt-plan-continue:
    persona: markl
    skills: [staged-delivery]
  okt-plan-claim:
    persona: markl
    skills: [staged-delivery]
  okt-task-resume:
    persona: howl-pendragon
    skills: [implementation]
  okt-task-continue:
    persona: howl-pendragon
    skills: [implementation]
  okt-task-implement:
    persona: howl-pendragon
    skills: [implementation, test-driven-development, trunk-based-development, continuous-integration]
    laws: [walking-skeleton-first, conventional-commits]
    templates: [pull-request, comment-tests-passing, comment-refactor-drive-by]
  okt-task-self-review:
    persona: howl-pendragon
    skills: [code-smells, castle-tidying]
    templates: [comment-refactor-drive-by]
  okt-task-refactor:
    persona: howl-pendragon
    skills: [refactoring-catalog, castle-tidying]
    templates: [comment-refactor-opportunities]
  # Scribe → Sophie.
  okt-task-document:
    persona: sophie-hatter
    skills: [documentation, architecture-mapping]
  okt-task-debrief:
    persona: sophie-hatter
    skills: [postmortem-authoring]
    laws: [no-praise-pad]
  # System commands talk to the TOOL, not the project. Concierge/generic role →
  # Calcifer. okt-skill pulls ANY skill (ungated by persona repertoire); the
  # markdown subset just shapes its own prose.
  okt-help:
    persona: calcifer
    skills: [markdown]
  okt-config:
    persona: calcifer
    skills: [markdown]
    templates: [config-orientation]
  okt-skill:
    persona: calcifer
    skills: [markdown]
  # Committer → Markl.
  okt-task-commit:
    persona: markl
    skills: [conventional-commits-spec]
    laws: [conventional-commits, no-coauthored-by]
  # Reviewer → Sophie.
  okt-task-review:
    persona: sophie-hatter
    skills: [code-smells, refactoring-catalog]
    laws: [no-praise-pad]
    templates: [comment-review-findings, comment-refactor-opportunities]
  okt-task-secure:
    persona: sophie-hatter
    skills: [security-review-lens]
    templates: [comment-review-findings]
  # Tester → Calcifer.
  okt-task-check:
    persona: calcifer
    skills: [regression-detection, coverage-analysis]
    laws: [accept-yellow]
    templates: [comment-check-report]
  okt-task-quality:
    persona: calcifer
    skills: [static-analysis-discipline]
    laws: [accept-yellow]
    templates: [comment-review-findings]
  # Notes / handoff. The Scribe (Sophie) repertoire carries all four #359 note
  # skills — handoff-synthesis, note-capture, standup-digest, recap-timeline —
  # so every notes-bearing slot resolves a real skill subset. okt-pause (Scribe
  # close) synthesises a handoff; okt-note-free captures ad-hoc; okt-note-recap
  # folds the standup digest into a wide-window recap.
  okt-pause:
    persona: sophie-hatter
    skills: [handoff-synthesis]
    laws: [project-scope-only, no-praise-pad]
    templates: [note-handoff]
  okt-note-free:
    persona: sophie-hatter
    skills: [note-capture]
    templates: [note-free]
  okt-note-recap:
    persona: sophie-hatter
    skills: [recap-timeline, standup-digest]
    templates: [note-recap, note-standup-digest]
  okt-note-list:
    persona: sophie-hatter
    skills: [note-capture]
  okt-note-show:
    persona: sophie-hatter
    skills: [note-capture]
workflows:
  - id: 1
    key: izakaya
    name: Izakaya Workflow
    buckets:
      - {id: 1, key: backlog, name: Backlog, position: 1}
      - {id: 2, key: dev, name: Development, position: 2}
      - {id: 3, key: done, name: Done, position: 3}
    transitions:
      - from: 1
        to: 2
        guards:
          - {type: comments_tagged, tag: hypothesis, count: 1, hint: "${{intl:guard.izakaya.dev.comments_tagged.hypothesis.hint}}"}
          - {type: wave_gate, hint: "${{intl:guard.wave_gate.hint}}"}
      - {from: 2, to: 3}
      - {from: 3, to: 2}
      - {from: 2, to: 1}
      - {from: 3, to: 1}
