version: 1
kit: {id: 102, key: izakaya, name: Izakaya Workflow Preset}
config:
  output: {json_minified: true, omit_empty: true}
  context: {default_level: 2, max_tokens: 12000}
  mcp:
    recent_comment_limit: 5
    max_comment_chars: 0
    include_workflow_in_continue: true
    cache_prompts: true
    recent_context_limit: 3
    next_work_limit: 5
    similar_task_limit: 5
  workflow: {active: izakaya}
  theme: {active: omakiten}
  tui:
    token_badge: {yellow_at: 150, red_at: 400}
  sqlite: {busy_timeout_ms: 5000}
  activity_log: {max_rows: 500, max_age_days: 7}
  solutions: {default_top_limit: 10, max_top_limit: 100}
  backup: {retention_count: 5}
  events:
    default_recent_limit: 50
    defaults: {log: true, broadcast: true, hook: true}
  hooks:
    - on: task.created
      notification: kitten_informative
      message: "${{intl:notifications.izakaya.task_created.message}}"
    - on: task.moved
      notification: kitten_informative
      message: "${{intl:notifications.izakaya.task_moved.message}}"
    - on: task.edited
      notification: kitten_informative
      message: "${{intl:notifications.izakaya.task_edited.message}}"
    - on: task.completed
      notification: kitten_success
      message: "${{intl:notifications.izakaya.task_completed.message}}"
    - on: guard.violated
      when: { operation: task.delete }
      notification: kitten_destructive
      message: "${{intl:notifications.izakaya.guard_task_delete.message}}"
      detail_message_field: hint
    - on: guard.violated
      when: { operation: comment.delete }
      notification: kitten_destructive
      message: "${{intl:notifications.izakaya.guard_comment_delete.message}}"
      detail_message_field: hint
    - on: guard.violated
      when: { operation: task.transition }
      notification: kitten_blocked
      message: "${{intl:notifications.izakaya.guard_task_transition.message}}"
      detail_message_field: hint
    # Plan-aware specialisation — see omakase.yaml for the rationale.
    - on: guard.violated
      when: { operation: task.transition, rule: wave_gate }
      notification: kitten_blocked
      message: "${{intl:notifications.izakaya.guard_wave_gate.message}}"
      detail_message_field: hint
    - on: guard.violated
      when: { operation: task.edit }
      notification: kitten_blocked
      message: "${{intl:notifications.izakaya.guard_task_edit.message}}"
      detail_message_field: hint
    - on: guard.violated
      when: { operation: comment.edit }
      notification: kitten_blocked
      message: "${{intl:notifications.izakaya.guard_comment_edit.message}}"
      detail_message_field: hint
    - on: guard.violated
      when: { operation: task.archive }
      notification: kitten_blocked
      message: "${{intl:notifications.izakaya.guard_task_archive.message}}"
      detail_message_field: hint
    - on: guard.violated
      when: { operation: task.unarchive }
      notification: kitten_blocked
      message: "${{intl:notifications.izakaya.guard_task_unarchive.message}}"
      detail_message_field: hint
    - on: task.removed
      notification: kitten_destructive
      message: "${{intl:notifications.izakaya.task_removed.message}}"
    - on: comment.removed
      notification: kitten_destructive
      message: "${{intl:notifications.izakaya.comment_removed.message}}"
    - on: task.archived
      notification: kitten_archive
      message: "${{intl:notifications.izakaya.task_archived.message}}"
    - on: task.unarchived
      notification: kitten_archive
      message: "${{intl:notifications.izakaya.task_unarchived.message}}"
    - on: comment
      when: { author_type: human }
      notification: kitten_informative
      message: "${{intl:notifications.izakaya.comment_added_human.message}}"
    - on: comment
      when: { author_type: agent }
      notification: kitten_informative
      message: "${{intl:notifications.izakaya.comment_added_agent.message}}"
    - on: comment.edited
      notification: kitten_informative
      message: "${{intl:notifications.izakaya.comment_edited.message}}"
    - on: tag.added
      notification: kitten_link
      message: "${{intl:notifications.izakaya.tag_added.message}}"
    - on: tag.removed
      notification: kitten_link
      message: "${{intl:notifications.izakaya.tag_removed.message}}"
    - on: dependency.added
      notification: kitten_link
      message: "${{intl:notifications.izakaya.dependency_added.message}}"
    - on: dependency.removed
      notification: kitten_link
      message: "${{intl:notifications.izakaya.dependency_removed.message}}"
    - on: error.recorded
      notification: kitten_knowledge
      message: "${{intl:notifications.izakaya.error_recorded.message}}"
    - on: error.searched
      notification: kitten_knowledge
      message: "${{intl:notifications.izakaya.error_searched.message}}"
    - on: solution.added
      notification: kitten_knowledge
      message: "${{intl:notifications.izakaya.solution_added.message}}"
    - on: solution.liked
      notification: kitten_success
      message: "${{intl:notifications.izakaya.solution_liked.message}}"
    - on: solution.failed
      notification: kitten_knowledge
      message: "${{intl:notifications.izakaya.solution_failed.message}}"
    - on: solution.viewed_top
      notification: kitten_knowledge
      message: "${{intl:notifications.izakaya.solution_viewed_top.message}}"
  search:
    stopwords: [and, are, for, from, into, the, this, that, with]
  tag_synonyms:
    golang: go
    javascript: js
    typescript: ts
    nodejs: node
    node-js: node
    postgres: postgresql
    psql: postgresql
    mongo: mongodb
    k8s: kubernetes
    tf: terraform
    py: python
  template_defaults: [task, pr, comment-resume, comment-selfbranch, comment-documentation]
  priorities:
    - {id: 1, value: low, color: success}
    - {id: 2, value: normal, default: true, color: info}
    - {id: 3, value: high, color: error}
  severities:
    - {id: 1, value: info, color: info}
    - {id: 2, value: warning, default: true, color: warning}
    - {id: 3, value: error, color: error}
  views:
    board:
      sort: {field: created_at, order: desc}
      filter: {priority: []}
    table:
      sort: {field: created_at, order: desc}
      filter: {priority: [], bucket: []}
    graph:
      sort: {field: id, order: asc}
    logs:
      sort: {order: desc}
      limit: 50
      filter: {source: []}
    task_activity:
      sort: {order: asc}
personas:
  - slug: tinkerer
    skills: [lean-experimentation, tracer-bullet-shipping, time-box-discipline, markdown]
  - slug: documentation-agent
    skills: [documentation, architecture-mapping, readme-curation, markdown]
  - slug: commit-author
    skills: [conventional-commits-spec, markdown]
  - slug: code-reviewer
    skills: [refactoring-catalog, code-smells, solid-principles, legacy-seams, security-review-lens, markdown]
  - slug: check-runner
    skills: [test-driven-development, static-analysis-discipline, coverage-analysis, regression-detection, markdown]
mcp_commands:
  global:
    laws: [template-fidelity, authorize-remote-writes, project-scope-only]
  okt:
    persona: tinkerer
  okt-imagine:
    persona: tinkerer
    laws_disabled: [template-fidelity]
  okt-create:
    persona: tinkerer
    laws: [hypothesis-required, yagni-first]
    templates: [task-spike]
  okt-resume:
    persona: tinkerer
  okt-continue:
    persona: tinkerer
  okt-implement:
    persona: tinkerer
    laws: [time-boxed-spike, tracer-bullet, conventional-commits]
    templates: [pull-request]
  okt-document:
    persona: documentation-agent
  okt-config:
    persona: documentation-agent
    templates: [config-orientation]
  okt-commit:
    persona: commit-author
    laws: [conventional-commits, no-coauthored-by]
  okt-review:
    persona: code-reviewer
    laws: [time-boxed-review, tracer-debt-acceptable]
    templates: [comment-review-findings, comment-refactor-opportunities]
  okt-check:
    persona: check-runner
    laws: [time-boxed-check, accept-yellow]
    templates: [comment-check-report]
workflows:
  - id: 1
    key: izakaya
    name: Izakaya Workflow
    buckets:
      - {id: 1, key: backlog, name: Backlog, position: 1}
      - {id: 2, key: dev, name: Development, position: 2}
      - {id: 3, key: done, name: Done, position: 3}
    transitions:
      - from: 1
        to: 2
        guards:
          - {type: comments_tagged, tag: hypothesis, count: 1, hint: "${{intl:guard.izakaya.dev.comments_tagged.hypothesis.hint}}"}
          - {type: wave_gate, hint: "${{intl:guard.wave_gate.hint}}"}
      - {from: 2, to: 3}
      - {from: 3, to: 2}
      - {from: 2, to: 1}
      - {from: 3, to: 1}
