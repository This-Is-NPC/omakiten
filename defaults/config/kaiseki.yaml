version: 1
kit: {id: 103, key: kaiseki, name: Kaiseki Workflow Preset}
config:
  output: {json_minified: true, omit_empty: true}
  context: {default_level: 2, max_tokens: 12000}
  mcp:
    recent_comment_limit: 5
    max_comment_chars: 0
    include_workflow_in_continue: true
    cache_prompts: true
    recent_context_limit: 3
    next_work_limit: 5
    similar_task_limit: 5
  workflow: {active: kaiseki}
  theme: {active: omakiten}
  tui:
    token_badge: {yellow_at: 150, red_at: 400}
  sqlite: {busy_timeout_ms: 5000, cache_size_kb: 1024, mmap_size_bytes: 0}
  activity_log: {max_rows: 500, max_age_days: 7}
  solutions: {default_top_limit: 10, max_top_limit: 100}
  backup: {retention_count: 5}
  events:
    default_recent_limit: 50
    defaults:
      log: true
      broadcast: true
      hook: true
      log_visible: true
      metric: ""
      entity_type: ""
    definitions:
      comment:
        category: comment
        display: "comment added"
        formatter: comment
      comment.edited:
        category: comment
        display: "comment edited"
        formatter: comment.edited
      comment.removed:
        category: comment
        display: "comment removed"
        formatter: comment.removed
      task.created:
        category: task
        display: "task created"
        formatter: task.created
      task.moved:
        category: task
        display: "task moved"
        formatter: task.moved
      task.migrated:
        category: task
        display: "task migrated"
        formatter: task.migrated
      task.bucket_orphaned:
        category: task
        display: "task bucket orphaned"
        formatter: task.bucket_orphaned
      task.completed:
        category: task
        display: "task completed"
        formatter: task.completed
      task.edited:
        category: task
        display: "task edited"
        formatter: task.edited
      task.removed:
        category: task
        display: "task removed"
        formatter: task.removed
      task.archived:
        category: task
        display: "task archived"
        formatter: task.archived
      task.unarchived:
        category: task
        display: "task unarchived"
        formatter: task.unarchived
      task.assigned:
        category: task
        display: "task assigned"
        formatter: task.assigned
      task.unassigned:
        category: task
        display: "task unassigned"
        formatter: task.unassigned
      project.removed:
        category: audit
        display: "project removed"
        formatter: project.removed
      plan.created:
        category: plan
        display: "plan created"
        formatter: plan.created
      plan.wave_added:
        category: plan
        display: "plan wave added"
        formatter: plan.wave_added
      plan.goal_edited:
        category: plan
        display: "plan goal edited"
        formatter: plan.goal_edited
      plan.done:
        category: plan
        display: "plan done"
        formatter: plan.done
      plan.abandoned:
        category: plan
        display: "plan abandoned"
        formatter: plan.abandoned
      tag.added:
        category: tag-dep
        display: "tag added"
        formatter: tag.added
      tag.removed:
        category: tag-dep
        display: "tag removed"
        formatter: tag.removed
      dependency.added:
        category: tag-dep
        display: "dependency added"
        formatter: dependency.added
      dependency.removed:
        category: tag-dep
        display: "dependency removed"
        formatter: dependency.removed
      guard.violated:
        category: guard
        display: "guard violated"
        formatter: guard.violated
      error.recorded:
        category: audit
        display: "error recorded"
        entity_type: error
        metric: error_recorded
        formatter: error.recorded
      errors.researched:
        category: audit
        display: "errors researched"
        entity_type: search
        metric: error_searched
        formatter: errors.researched
      solution.added:
        category: audit
        display: "solution added"
        entity_type: solution
        metric: solution_added
        formatter: solution.added
      solution.confirmed:
        category: audit
        display: "solution confirmed"
        entity_type: solution
        formatter: solution.confirmed
      solution.liked:
        category: audit
        display: "solution liked"
        entity_type: solution
        metric: solution_liked
        formatter: solution.liked
      solution.failed:
        category: audit
        display: "solution failed"
        entity_type: solution
        metric: solution_failed
        formatter: solution.failed
      solution.viewed_top:
        category: audit
        display: "solution viewed top"
        entity_type: solution
        metric: solution_top_viewed
        formatter: solution.viewed_top
      hook.executed:
        category: hook
        display: "hook executed"
        formatter: hook.executed
      subtask_kit.notice_emitted:
        category: domain
        display: "subtask kit notice emitted"
        formatter: subtask_kit.notice_emitted
      bundle.swapped:
        category: domain
        display: "bundle swapped"
        formatter: bundle.swapped
      bundle.imported:
        category: domain
        display: "bundle imported"
        formatter: bundle.imported
      confirmation.granted:
        category: audit
        display: "confirmation granted"
        formatter: confirmation.granted
      trick.executed:
        category: trick
        display: "trick executed"
        formatter: trick.executed
      cli.tool_call:
        category: tool_call
        display: "CLI tool call"
        formatter: cli.tool_call
      mcp.tool_call:
        category: tool_call
        display: "MCP tool call"
        formatter: mcp.tool_call
      tui.tool_call:
        category: tool_call
        display: "TUI tool call"
        formatter: tui.tool_call
      note.created:
        category: note
        display: "note created"
        formatter: note.created
      note.edited:
        category: note
        display: "note edited"
        formatter: note.edited
      note.pinned:
        category: note
        display: "note pinned/unpinned"
        formatter: note.pinned
      note.removed:
        category: note
        display: "note removed"
        formatter: note.removed
      update.healthcheck.passed:
        category: update
        display: "update health-check passed"
        formatter: update.healthcheck.passed
      update.healthcheck.failed:
        category: update
        display: "update health-check failed"
        formatter: update.healthcheck.failed
      update.swap.completed:
        category: update
        display: "update binary swap completed"
        formatter: update.swap.completed
      update.swap.aborted:
        category: update
        display: "update binary swap aborted"
        formatter: update.swap.aborted
      tui.healthcheck.failed:
        category: tui
        display: "tui boot health-check failed"
        formatter: tui.healthcheck.failed
  hooks:
    - on: task.created
      notification: kitten_informative
      message: "${{intl:notifications.kaiseki.task_created.message}}"
    - on: task.moved
      notification: kitten_informative
      message: "${{intl:notifications.kaiseki.task_moved.message}}"
    - on: task.edited
      notification: kitten_informative
      message: "${{intl:notifications.kaiseki.task_edited.message}}"
    - on: task.completed
      notification: kitten_success
      message: "${{intl:notifications.kaiseki.task_completed.message}}"
    - on: guard.violated
      when: { operation: task.delete }
      notification: kitten_destructive
      message: "${{intl:notifications.kaiseki.guard_task_delete.message}}"
      detail_message_field: hint
    - on: guard.violated
      when: { operation: comment.delete }
      notification: kitten_destructive
      message: "${{intl:notifications.kaiseki.guard_comment_delete.message}}"
      detail_message_field: hint
    - on: guard.violated
      when: { operation: task.transition }
      notification: kitten_blocked
      message: "${{intl:notifications.kaiseki.guard_task_transition.message}}"
      detail_message_field: hint
    # Plan-aware specialisation — see omakase.yaml for the rationale.
    - on: guard.violated
      when: { operation: task.transition, rule: wave_gate }
      notification: kitten_blocked
      message: "${{intl:notifications.kaiseki.guard_wave_gate.message}}"
      detail_message_field: hint
    - on: guard.violated
      when: { operation: task.edit }
      notification: kitten_blocked
      message: "${{intl:notifications.kaiseki.guard_task_edit.message}}"
      detail_message_field: hint
    - on: guard.violated
      when: { operation: comment.edit }
      notification: kitten_blocked
      message: "${{intl:notifications.kaiseki.guard_comment_edit.message}}"
      detail_message_field: hint
    - on: guard.violated
      when: { operation: task.archive }
      notification: kitten_blocked
      message: "${{intl:notifications.kaiseki.guard_task_archive.message}}"
      detail_message_field: hint
    - on: guard.violated
      when: { operation: task.unarchive }
      notification: kitten_blocked
      message: "${{intl:notifications.kaiseki.guard_task_unarchive.message}}"
      detail_message_field: hint
    - on: task.removed
      notification: kitten_destructive
      message: "${{intl:notifications.kaiseki.task_removed.message}}"
    - on: comment.removed
      notification: kitten_destructive
      message: "${{intl:notifications.kaiseki.comment_removed.message}}"
    - on: task.archived
      notification: kitten_archive
      message: "${{intl:notifications.kaiseki.task_archived.message}}"
    - on: task.unarchived
      notification: kitten_archive
      message: "${{intl:notifications.kaiseki.task_unarchived.message}}"
    - on: comment
      when: { author_type: human }
      notification: kitten_informative
      message: "${{intl:notifications.kaiseki.comment_added_human.message}}"
    - on: comment
      when: { author_type: agent }
      notification: kitten_informative
      message: "${{intl:notifications.kaiseki.comment_added_agent.message}}"
    - on: comment.edited
      notification: kitten_informative
      message: "${{intl:notifications.kaiseki.comment_edited.message}}"
    - on: tag.added
      notification: kitten_link
      message: "${{intl:notifications.kaiseki.tag_added.message}}"
    - on: tag.removed
      notification: kitten_link
      message: "${{intl:notifications.kaiseki.tag_removed.message}}"
    - on: dependency.added
      notification: kitten_link
      message: "${{intl:notifications.kaiseki.dependency_added.message}}"
    - on: dependency.removed
      notification: kitten_link
      message: "${{intl:notifications.kaiseki.dependency_removed.message}}"
    - on: error.recorded
      notification: kitten_knowledge
      message: "${{intl:notifications.kaiseki.error_recorded.message}}"
    - on: errors.researched
      notification: kitten_knowledge
      message: "${{intl:notifications.kaiseki.errors_researched.message}}"
    - on: solution.added
      notification: kitten_knowledge
      message: "${{intl:notifications.kaiseki.solution_added.message}}"
    - on: solution.liked
      notification: kitten_success
      message: "${{intl:notifications.kaiseki.solution_liked.message}}"
    - on: solution.failed
      notification: kitten_knowledge
      message: "${{intl:notifications.kaiseki.solution_failed.message}}"
    - on: solution.viewed_top
      notification: kitten_knowledge
      message: "${{intl:notifications.kaiseki.solution_viewed_top.message}}"
  search:
    stopwords: [and, are, for, from, into, the, this, that, with]
  tag_synonyms:
    golang: go
    javascript: js
    typescript: ts
    nodejs: node
    node-js: node
    postgres: postgresql
    psql: postgresql
    mongo: mongodb
    k8s: kubernetes
    tf: terraform
    py: python
  template_defaults: [task, pr, comment-resume, comment-selfbranch, comment-documentation]
  priorities:
    - {id: 1, value: low, color: success}
    - {id: 2, value: normal, default: true, color: info}
    - {id: 3, value: high, color: error}
  severities:
    - {id: 1, value: info, color: info}
    - {id: 2, value: warning, default: true, color: warning}
    - {id: 3, value: error, color: error}
  views:
    board:
      sort: {field: created_at, order: desc}
      filter: {priority: []}
    table:
      sort: {field: created_at, order: desc}
      filter: {priority: [], bucket: []}
    graph:
      sort: {field: id, order: asc}
    logs:
      sort: {order: desc}
      limit: 50
      window_days: 30
    task_activity:
      sort: {order: asc}
personas:
  - slug: methodical-engineer
    skills: [staged-delivery, requirements-elicitation, design-documentation, decision-records, acceptance-criteria-writing, implementation, standup-digest, recap-timeline, markdown]
  - slug: product-owner
    skills: [discovery, user-story-writing, requirements-elicitation, acceptance-criteria-writing, pdca-cycle, five-w-two-h, smart-goals, invest-stories, moscow-prioritization, rice-scoring, non-functional-requirements, markdown]
  - slug: documentation-agent
    skills: [documentation, architecture-mapping, requirements-mapping, readme-curation, handoff-synthesis, note-capture, markdown]
  - slug: commit-author
    skills: [conventional-commits-spec, markdown]
  - slug: code-reviewer
    skills: [refactoring-catalog, code-smells, solid-principles, legacy-seams, security-review-lens, markdown]
  - slug: check-runner
    skills: [test-driven-development, static-analysis-discipline, coverage-analysis, regression-detection, markdown]
mcp_commands:
  global:
    laws: [template-fidelity, authorize-remote-writes, project-scope-only]
  okt:
    persona: methodical-engineer
  okt-task-imagine:
    persona: product-owner
    laws_disabled: [template-fidelity]
    templates: [comment-5w2h, comment-smart-success]
  okt-task-create:
    persona: product-owner
    laws: [requirements-signed-off, acceptance-criteria-required, invest-stories, outcome-over-output, prioritization-recorded, non-functional-explicit]
    templates: [task-feature, comment-requirements, comment-acceptance, comment-smart-success, comment-moscow, comment-rice-score, comment-non-functional]
  okt-project-resume:
    persona: methodical-engineer
  okt-task-continue:
    persona: methodical-engineer
  okt-task-implement:
    persona: methodical-engineer
    laws: [design-recorded, decision-record-on-divergence, peer-review-required, conventional-commits, no-silent-behavior-changes]
    templates: [pull-request, decision-record, design-doc, comment-design-decision]
  okt-task-document:
    persona: documentation-agent
  okt-config:
    persona: documentation-agent
    templates: [config-orientation]
  okt-task-commit:
    persona: commit-author
    laws: [conventional-commits, no-coauthored-by, link-decision-record]
  okt-task-review:
    persona: code-reviewer
    laws: [design-recorded-check, decision-record-on-divergence]
    templates: [comment-review-findings, comment-refactor-opportunities]
  okt-task-check:
    persona: check-runner
    laws: [requirements-coverage-check, decision-record-on-gap]
    templates: [comment-check-report]
  # Notes / handoff v1 (#363), rescoped to the v2 prefix surface (#373).
  # Provisional persona kit — #189 W4/W5.x rebinds to themed personas.
  okt-pause:
    persona: documentation-agent
    laws: [project-scope-only, no-praise-pad]
    templates: [note-handoff]
  okt-note-free:
    persona: documentation-agent
    templates: [note-free]
  okt-note-recap:
    persona: methodical-engineer
    templates: [note-recap, note-standup-digest]
workflows:
  - id: 1
    key: kaiseki
    name: Kaiseki Workflow
    defaults:
      task: {edit: false, delete: false}
      comment: {edit: false, delete: false}
    operations:
      archive:
        guards:
          - {type: comments_tagged, tag: documentation, count: 1, hint: "${{intl:guard.common.archive.comments_tagged.documentation.hint}}"}
      delete:
        guards:
          - {type: comments_tagged, tag: peer-review, count: 1, hint: "${{intl:guard.kaiseki.delete.comments_tagged.peer_review.hint}}"}
    buckets:
      - id: 1
        key: requirements
        name: Requirements
        position: 1
        permissions:
          task: {edit: true, delete: true}
          comment: {edit: true, delete: true}
      - id: 2
        key: planning
        name: Planning
        position: 2
        permissions:
          task: {edit: true, delete: true}
          comment: {edit: true, delete: false}
      - id: 3
        key: dev
        name: Development
        position: 3
        permissions:
          comment: {edit: true, delete: true}
      - {id: 4, key: review, name: Review, position: 4}
      - {id: 5, key: docs, name: Documentation, position: 5}
      - {id: 6, key: done, name: Done, position: 6}
    transitions:
      - from: 1
        to: 2
        guards:
          - {type: comments_tagged, tag: 5w2h, count: 1, hint: "${{intl:guard.common.planning.comments_tagged.5w2h.hint}}"}
          - {type: comments_tagged, tag: requirements, count: 1, hint: "${{intl:guard.kaiseki.planning.comments_tagged.requirements.hint}}"}
          - {type: comments_tagged, tag: acceptance, count: 1, hint: "${{intl:guard.common.planning.comments_tagged.acceptance.hint}}"}
      - from: 2
        to: 3
        guards:
          - {type: comments_tagged, tag: self-branch, count: 1, hint: "${{intl:guard.common.dev.comments_tagged.self_branch.hint}}"}
          - {type: comments_tagged, tag: design, count: 1, hint: "${{intl:guard.kaiseki.dev.comments_tagged.design.hint}}"}
          - {type: blockers_in, buckets: [done, docs], hint: "${{intl:guard.common.dev.blockers_in.hint}}"}
          - {type: wave_gate, hint: "${{intl:guard.wave_gate.hint}}"}
      - from: 3
        to: 4
        guards:
          - {type: comments_tagged, tag: resume, count: 1, hint: "${{intl:guard.kaiseki.review.comments_tagged.resume.hint}}"}
          - {type: comments_tagged, tag: tests-passing, count: 1, hint: "${{intl:guard.kaiseki.review.comments_tagged.tests_passing.hint}}"}
          - {type: subtasks_complete, hint: "${{intl:guard.subtasks_complete.hint}}"}
      - from: 4
        to: 5
        guards:
          - {type: comments_tagged, tag: peer-review, count: 1, hint: "${{intl:guard.kaiseki.docs.comments_tagged.peer_review.hint}}"}
      - from: 5
        to: 6
        guards:
          - {type: comments_tagged, tag: documentation, count: 1, hint: "${{intl:guard.common.done.comments_tagged.documentation.hint}}"}
          - {type: subtasks_complete, hint: "${{intl:guard.subtasks_complete.hint}}"}
      - {from: 4, to: 3}
      - {from: 5, to: 4}
      - {from: 6, to: 4}
      - {from: 6, to: 5}
