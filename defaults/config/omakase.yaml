version: 1
kit:
  id: 101
  key: omakase
  name: Omakase Workflow Preset
config:
  merge_from: ./modules/base-config.yaml
  workflow:
    active: omakase
  # omakase suppresses tag events from the activity feed — other presets don't.
  events:
    overrides:
      tag.added:
        log: false
      tag.removed:
        log: false
  # hooks subscribes to events.bus and dispatches notification cards. Every
  # message references the omakase-namespaced intl key so the TUI renders
  # the preset-branded copy.
  hooks:
    - on: task.created
      notification: kitten_informative
      message: "${{intl:notifications.omakase.task_created.message}}"
    - on: task.moved
      notification: kitten_informative
      message: "${{intl:notifications.omakase.task_moved.message}}"
    - on: task.edited
      notification: kitten_informative
      message: "${{intl:notifications.omakase.task_edited.message}}"
    - on: task.completed
      notification: kitten_success
      message: "${{intl:notifications.omakase.task_completed.message}}"
    - on: guard.violated
      when: { operation: task.delete }
      notification: kitten_destructive
      message: "${{intl:notifications.omakase.guard_task_delete.message}}"
      detail_message_field: hint
    - on: guard.violated
      when: { operation: comment.delete }
      notification: kitten_destructive
      message: "${{intl:notifications.omakase.guard_comment_delete.message}}"
      detail_message_field: hint
    - on: guard.violated
      when: { operation: task.transition }
      notification: kitten_blocked
      message: "${{intl:notifications.omakase.guard_task_transition.message}}"
      detail_message_field: hint
    # Plan-aware specialisation of the transition card — when the
    # blocking rule is the wave_gate guard, fire a plan-themed card
    # with the same kitten so a wave_gate block reads as a plan
    # event, not a generic transition refusal. Both hooks match,
    # which is fine: the notification slot is single, so the
    # later-dispatched (plan) card wins on screen. Order matters
    # here — the generic hook stays first so it loses the race.
    - on: guard.violated
      when: { operation: task.transition, rule: wave_gate }
      notification: kitten_blocked
      message: "${{intl:notifications.omakase.guard_wave_gate.message}}"
      detail_message_field: hint
    - on: guard.violated
      when: { operation: task.edit }
      notification: kitten_blocked
      message: "${{intl:notifications.omakase.guard_task_edit.message}}"
      detail_message_field: hint
    - on: guard.violated
      when: { operation: comment.edit }
      notification: kitten_blocked
      message: "${{intl:notifications.omakase.guard_comment_edit.message}}"
      detail_message_field: hint
    - on: guard.violated
      when: { operation: task.archive }
      notification: kitten_blocked
      message: "${{intl:notifications.omakase.guard_task_archive.message}}"
      detail_message_field: hint
    - on: guard.violated
      when: { operation: task.unarchive }
      notification: kitten_blocked
      message: "${{intl:notifications.omakase.guard_task_unarchive.message}}"
      detail_message_field: hint
    - on: bundle.swapped
      when: { has_orphans: "true" }
      notification: kitten_orphan_migration
      message: "${{intl:notifications.omakase.bundle_swapped_orphans.message}}"
      detail_message_field: orphan_count
    - on: task.removed
      notification: kitten_destructive
      message: "${{intl:notifications.omakase.task_removed.message}}"
    - on: comment.removed
      notification: kitten_destructive
      message: "${{intl:notifications.omakase.comment_removed.message}}"
    - on: task.archived
      notification: kitten_archive
      message: "${{intl:notifications.omakase.task_archived.message}}"
    - on: task.unarchived
      notification: kitten_archive
      message: "${{intl:notifications.omakase.task_unarchived.message}}"
    - on: comment
      when: { author_type: human }
      notification: kitten_informative
      message: "${{intl:notifications.omakase.comment_added_human.message}}"
    - on: comment
      when: { author_type: agent }
      notification: kitten_informative
      message: "${{intl:notifications.omakase.comment_added_agent.message}}"
    - on: comment.edited
      notification: kitten_informative
      message: "${{intl:notifications.omakase.comment_edited.message}}"
    - on: tag.added
      notification: kitten_link
      message: "${{intl:notifications.omakase.tag_added.message}}"
    - on: tag.removed
      notification: kitten_link
      message: "${{intl:notifications.omakase.tag_removed.message}}"
    - on: dependency.added
      notification: kitten_link
      message: "${{intl:notifications.omakase.dependency_added.message}}"
    - on: dependency.removed
      notification: kitten_link
      message: "${{intl:notifications.omakase.dependency_removed.message}}"
    - on: error.recorded
      notification: kitten_knowledge
      message: "${{intl:notifications.omakase.error_recorded.message}}"
    - on: errors.researched
      notification: kitten_knowledge
      message: "${{intl:notifications.omakase.errors_researched.message}}"
    - on: solution.added
      notification: kitten_knowledge
      message: "${{intl:notifications.omakase.solution_added.message}}"
    - on: solution.liked
      notification: kitten_success
      message: "${{intl:notifications.omakase.solution_liked.message}}"
    - on: solution.failed
      notification: kitten_knowledge
      message: "${{intl:notifications.omakase.solution_failed.message}}"
    - on: solution.viewed_top
      notification: kitten_knowledge
      message: "${{intl:notifications.omakase.solution_viewed_top.message}}"

workflows:
  - id: 1
    key: omakase
    name: Omakase Workflow
    # defaults declares the workflow-level fallback for task/comment edit
    # and delete. Resolution order: bucket.permissions → workflow.defaults
    # → implicit `true` (no rule = allow). The default kit ships strict
    # defaults so a brand-new task respects "edit only in backlog" out of
    # the box; per-bucket `permissions:` overrides relax this where the
    # workflow author wants to allow edits/deletes elsewhere.
    defaults:
      task:
        edit: false
        delete: false
      comment:
        edit: false
        delete: false
    operations:
      archive:
        guards:
          - type: comments_tagged
            tag: documentation
            count: 1
            hint: "${{intl:guard.common.archive.comments_tagged.documentation.hint}}"
    buckets:
      - id: 1
        key: backlog
        name: Backlog
        position: 1
        permissions:
          task:
            edit: true
            delete: true
          comment:
            edit: true
            delete: true
      - id: 2
        key: dev
        name: Development
        position: 2
        permissions:
          comment:
            edit: true
            delete: true
      - id: 3
        key: review
        name: Review
        position: 3
        permissions:
          comment:
            edit: true
      - id: 4
        key: done
        name: Done
        position: 4
        permissions:
          task:
            delete: false
          comment:
            delete: false
    transitions:
      - from: 1
        to: 2
        guards:
          - type: comments_tagged
            tag: self-branch
            count: 1
            hint: "${{intl:guard.omakase.dev.comments_tagged.self_branch.hint}}"
          - type: blockers_in
            buckets: [done]
            hint: "${{intl:guard.omakase.dev.blockers_in.hint}}"
          - type: wave_gate
            hint: "${{intl:guard.wave_gate.hint}}"
      - from: 2
        to: 3
        guards:
          - type: comments_tagged
            tag: resume
            count: 1
            hint: "${{intl:guard.omakase.review.comments_tagged.resume.hint}}"
          - type: comments_tagged
            tag: tests-passing
            count: 1
            hint: "${{intl:guard.omakase.review.comments_tagged.tests_passing.hint}}"
          - type: subtasks_complete
            hint: "${{intl:guard.subtasks_complete.hint}}"
      - from: 3
        to: 4
        guards:
          - type: comments_tagged
            tag: documentation
            count: 1
            hint: "${{intl:guard.omakase.done.comments_tagged.documentation.hint}}"
      # Regression transitions — no guards.
      - from: 2
        to: 1
      - from: 3
        to: 1
      - from: 3
        to: 2
      - from: 4
        to: 3
      - from: 4
        to: 2
      - from: 4
        to: 1

personas:
  from: ./themes/naruto.yaml#personas

mcp_commands:
  from: ./themes/naruto.yaml#mcp_commands
