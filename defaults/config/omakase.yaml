version: 1
kit:
  id: 101
  key: omakase
  name: Omakase Workflow Preset
config:
  output:
    json_minified: true
    omit_empty: true
  context:
    default_level: 2
    max_tokens: 12000
  # mcp tunes how MCP responses are shaped to fit the agent's context
  # window. Every field is REQUIRED — the validator rejects bundles that
  # omit any. The values below are the canonical kit; tune them in your
  # local omakiten.yaml to compress payloads for narrow contexts.
  mcp:
    recent_comment_limit: 5            # > 0; cap on comments shipped per call
    max_comment_chars: 0               # >= 0; 0 = no truncation
    include_workflow_in_continue: true # ship workflow block in tasks.continue
    cache_prompts: true                # emit Anthropic cache_control hint
    recent_context_limit: 3            # > 0; recent context entries shipped
    next_work_limit: 5                 # > 0; "likely next work" suggestions
    similar_task_limit: 5              # > 0; similar-task hints on create_intent
  workflow:
    active: omakase
  theme:
    active: omakiten
  # tui tunes terminal UI presentation. Every field is optional — omit a key
  # to keep the canonical default. token_badge controls the colored TOKENS:N
  # badge on entity cards: above red_at → red; above yellow_at → yellow; else
  # green. Calibrated for the default kit; raise both numbers if you author
  # heavier laws/personas, lower them if you keep entities terse.
  tui:
    token_badge:
      yellow_at: 150
      red_at: 400
  # sqlite tunes connection-level engine knobs the Store applies at Open.
  # busy_timeout_ms is the value passed to PRAGMA busy_timeout; raise it on
  # systems with concurrent writers or larger DBs that occasionally see
  # "database is locked" errors. Other PRAGMAs (foreign_keys, journal_mode,
  # synchronous) stay in code because they describe correctness invariants
  # rather than user preference.
  sqlite:
    busy_timeout_ms: 5000
  # activity_log retention: prunes the per-call `operation` event log so
  # the activity feed stays fast. Each BeginActivityLog runs a synchronous
  # prune pass; the writer never blocks longer than O(rows-deleted).
  # max_rows is a hard ceiling (extra rows deleted in id-DESC order),
  # max_age_days is a sliding window (rows older than N days deleted).
  activity_log:
    max_rows: 500
    max_age_days: 7
  # solutions caps the `solutions.list_top` MCP response shape. Callers
  # that omit `limit` get default_top_limit; callers that pass a larger
  # value get clamped to max_top_limit so the response stays bounded.
  solutions:
    default_top_limit: 10
    max_top_limit: 100
  # backup tunes the rolling DB snapshot written under
  # $XDG_STATE_HOME/omakiten/backups/ by `okt db backup` and every
  # destructive command that runs an auto-backup before mutating state
  # (delete project, update binary). retention_count caps the number of
  # snapshots kept on disk: after each successful write the directory
  # is pruned to the N most-recent files. Set to 0 to disable pruning
  # (snapshots accumulate indefinitely — power users who manage
  # rotation out-of-band).
  backup:
    retention_count: 5
  # events tunes the per-event-type domain log:
  #   default_recent_limit — Store.ListRecentEvents fallback when <=0.
  #   defaults — channel policy applied to every known event type.
  #     log:       persist to the events table (today: gate the
  #                RecordEntityEvent / RecordTaskEvent / RecordEvent paths).
  #     broadcast: in-process pub/sub fanout (reserved for the upcoming
  #                event-bus task; declared today so configs stay stable).
  #     hook:      YAML-driven hook dispatcher (reserved; same).
  #   overrides — per-event_type policy that wins over defaults. Pointer
  #     semantics: omit a field to inherit the default; declare false to
  #     opt out. Unknown keys are rejected at load time to catch typos.
  events:
    default_recent_limit: 50
    defaults:
      log: true
      broadcast: true
      hook: true
    overrides:
      tag.added:
        log: false
      tag.removed:
        log: false
  # hooks subscribes to events.bus and dispatches actions when the
  # event_type matches `on:` and every key in `when:` matches the
  # corresponding top-level key in event.payload (string equality;
  # numbers/bools coerce). Actions run async (fire-and-forget), so a
  # slow script never blocks the request that emitted the event.
  # Built-in actions: `exec` (shells nothing — argv array is literal,
  # the full domain.Event lands on stdin as JSON) and `noop`. See
  # .docs/hooks.md for the per-action arg contract and worked examples.
  # Empty list ships by default; add entries to wire automation.
  # Notification entries use the `notification: <slug>` shorthand — every render
  # knob (position, animation, dismiss, message) lives inside the
  # named notifications/<slug>.yaml so omakiten.yaml only links event →
  # notification file.
  hooks:
    - on: task.created
      notification: kitten_informative
      message: "${{intl:notifications.omakase.task_created.message}}"
    - on: task.moved
      notification: kitten_informative
      message: "${{intl:notifications.omakase.task_moved.message}}"
    - on: task.edited
      notification: kitten_informative
      message: "${{intl:notifications.omakase.task_edited.message}}"
    - on: task.completed
      notification: kitten_success
      message: "${{intl:notifications.omakase.task_completed.message}}"
    - on: guard.violated
      when: { operation: task.delete }
      notification: kitten_destructive
      message: "${{intl:notifications.omakase.guard_task_delete.message}}"
      detail_message_field: hint
    - on: guard.violated
      when: { operation: comment.delete }
      notification: kitten_destructive
      message: "${{intl:notifications.omakase.guard_comment_delete.message}}"
      detail_message_field: hint
    - on: guard.violated
      when: { operation: task.transition }
      notification: kitten_blocked
      message: "${{intl:notifications.omakase.guard_task_transition.message}}"
      detail_message_field: hint
    # Plan-aware specialisation of the transition card — when the
    # blocking rule is the wave_gate guard, fire a plan-themed card
    # with the same kitten so a wave_gate block reads as a plan
    # event, not a generic transition refusal. Both hooks match,
    # which is fine: the notification slot is single, so the
    # later-dispatched (plan) card wins on screen. Order matters
    # here — the generic hook stays first so it loses the race.
    - on: guard.violated
      when: { operation: task.transition, rule: wave_gate }
      notification: kitten_blocked
      message: "${{intl:notifications.omakase.guard_wave_gate.message}}"
      detail_message_field: hint
    - on: guard.violated
      when: { operation: task.edit }
      notification: kitten_blocked
      message: "${{intl:notifications.omakase.guard_task_edit.message}}"
      detail_message_field: hint
    - on: guard.violated
      when: { operation: comment.edit }
      notification: kitten_blocked
      message: "${{intl:notifications.omakase.guard_comment_edit.message}}"
      detail_message_field: hint
    - on: guard.violated
      when: { operation: task.archive }
      notification: kitten_blocked
      message: "${{intl:notifications.omakase.guard_task_archive.message}}"
      detail_message_field: hint
    - on: guard.violated
      when: { operation: task.unarchive }
      notification: kitten_blocked
      message: "${{intl:notifications.omakase.guard_task_unarchive.message}}"
      detail_message_field: hint
    - on: bundle.swapped
      when: { has_orphans: "true" }
      notification: kitten_orphan_migration
      message: "${{intl:notifications.omakase.bundle_swapped_orphans.message}}"
      detail_message_field: orphan_count
    - on: task.removed
      notification: kitten_destructive
      message: "${{intl:notifications.omakase.task_removed.message}}"
    - on: comment.removed
      notification: kitten_destructive
      message: "${{intl:notifications.omakase.comment_removed.message}}"
    - on: task.archived
      notification: kitten_archive
      message: "${{intl:notifications.omakase.task_archived.message}}"
    - on: task.unarchived
      notification: kitten_archive
      message: "${{intl:notifications.omakase.task_unarchived.message}}"
    - on: comment
      when: { author_type: human }
      notification: kitten_informative
      message: "${{intl:notifications.omakase.comment_added_human.message}}"
    - on: comment
      when: { author_type: agent }
      notification: kitten_informative
      message: "${{intl:notifications.omakase.comment_added_agent.message}}"
    - on: comment.edited
      notification: kitten_informative
      message: "${{intl:notifications.omakase.comment_edited.message}}"
    - on: tag.added
      notification: kitten_link
      message: "${{intl:notifications.omakase.tag_added.message}}"
    - on: tag.removed
      notification: kitten_link
      message: "${{intl:notifications.omakase.tag_removed.message}}"
    - on: dependency.added
      notification: kitten_link
      message: "${{intl:notifications.omakase.dependency_added.message}}"
    - on: dependency.removed
      notification: kitten_link
      message: "${{intl:notifications.omakase.dependency_removed.message}}"
    - on: error.recorded
      notification: kitten_knowledge
      message: "${{intl:notifications.omakase.error_recorded.message}}"
    - on: error.searched
      notification: kitten_knowledge
      message: "${{intl:notifications.omakase.error_searched.message}}"
    - on: solution.added
      notification: kitten_knowledge
      message: "${{intl:notifications.omakase.solution_added.message}}"
    - on: solution.liked
      notification: kitten_success
      message: "${{intl:notifications.omakase.solution_liked.message}}"
    - on: solution.failed
      notification: kitten_knowledge
      message: "${{intl:notifications.omakase.solution_failed.message}}"
    - on: solution.viewed_top
      notification: kitten_knowledge
      message: "${{intl:notifications.omakase.solution_viewed_top.message}}"
  # search tunes the heuristics shared across agent-side text ranking
  # (similar-task hints in tasks.create_intent, query overlap scoring).
  # stopwords is the lowercase token list dropped before scoring; add
  # Portuguese/Spanish/etc. words here without a code change.
  search:
    stopwords:
      - and
      - are
      - for
      - from
      - into
      - the
      - this
      - that
      - with
  # tag_synonyms maps non-canonical tag slugs to their canonical form.
  # NormalizeTagName collapses input → kebab-case, then applies one hop
  # of substitution (no chains). Edit this block to align tag names with
  # your team's vocabulary; existing rows survive because storage is by
  # tag id, so renaming the canonical label here re-routes future writes
  # without touching history.
  tag_synonyms:
    golang: go
    javascript: js
    typescript: ts
    nodejs: node
    node-js: node
    postgres: postgresql
    psql: postgresql
    mongo: mongodb
    k8s: kubernetes
    tf: terraform
    py: python
  # template_defaults declares the kinds the user can assign in the TUI
  # picker. Each loaded template can claim at most one (kind, project) pair
  # via its frontmatter (`default: <kind>`, optional `project: <slug>`).
  # Defaults below match the canonical Omakiten kit; tweak as needed.
  template_defaults: [task, pr, comment-resume, comment-selfbranch, comment-documentation]
  # priorities declares the configurable id↔value table for task priorities.
  # Code references the id (opaque); renderers resolve the human label via
  # this table at the boundary, so renaming "high" to "urgent" here is a
  # single-line edit and existing tasks pick up the new label on the next
  # read. id is the SORT WEIGHT — list low → high so `ORDER BY priority`
  # sorts the way users expect. `default: true` (at most one entry) flags
  # which id the form/CLI substitutes when the user creates a task without
  # naming a priority. `color` is an optional theme-token name picked up
  # by the TUI badge renderer (`error` / `warning` / `success` / `info`).
  #
  # Omitting the block keeps the canonical 1=low/2=normal/3=high kit; add
  # entries to introduce new priorities (e.g. `{id: 4, value: urgent}`)
  # without any code change. The sqlite layer stores priority_id integers,
  # so renaming a value never breaks references on existing rows.
  priorities:
    - id: 1
      value: low
      color: success
    - id: 2
      value: normal
      default: true
      color: info
    - id: 3
      value: high
      color: error
  # severities declares the configurable id↔value table for law
  # severities. Same shape as priorities — code references the int id,
  # frontmatter parsers and renderers resolve labels via this table.
  # Renaming "error" to "critical" here is a single-line YAML edit;
  # existing law rows survive because storage is by id (see
  # migrations/016_severity_id.sql).
  #
  # Omitting the block keeps the canonical 1=info / 2=warning default /
  # 3=error kit. Adding a new entry (e.g. {id: 4, value: blocker})
  # makes it valid for any law file's frontmatter `severity:` field.
  severities:
    - id: 1
      value: info
      color: info
    - id: 2
      value: warning
      default: true
      color: warning
    - id: 3
      value: error
      color: error
  # views configures the default sort and filter applied to each view at
  # startup. Every block + sort field/order is REQUIRED — validator
  # rejects omissions. Filter blocks default to empty lists (all values
  # allowed); restrict by listing a subset.
  views:
    board:
      sort:
        field: created_at   # id | title | priority | created_at
        order: desc         # asc | desc
      filter:
        priority: []        # subset of config.priorities[].value; [] = all
    table:
      sort:
        field: created_at
        order: desc
      filter:
        priority: []
        bucket: []          # subset of bucket keys in the active workflow
    graph:
      sort:
        field: id           # id | title (only)
        order: asc
    logs:
      sort:
        order: desc         # only direction is configurable for logs
      limit: 50
      filter:
        source: []          # subset of [cli, tui, mcp]
    task_activity:
      sort:
        order: asc          # asc = chronological | desc = newest first
workflows:
  - id: 1
    key: omakase
    name: Omakase Workflow
    # defaults declares the workflow-level fallback for task/comment edit
    # and delete. Resolution order: bucket.permissions → workflow.defaults
    # → implicit `true` (no rule = allow). The default kit ships strict
    # defaults so a brand-new task respects "edit only in backlog" out of
    # the box; per-bucket `permissions:` overrides relax this where the
    # workflow author wants to allow edits/deletes elsewhere.
    defaults:
      task:
        edit: false
        delete: false
      comment:
        edit: false
        delete: false
    operations:
      archive:
        guards:
          - type: comments_tagged
            tag: documentation
            count: 1
            hint: "${{intl:guard.common.archive.comments_tagged.documentation.hint}}"
    buckets:
      - id: 1
        key: backlog
        name: Backlog
        position: 1
        # Backlog opts in to edit/delete on both task and comment so the
        # planning bucket can be freely reshaped before work starts. Move
        # the task to dev/review/done to lock the description & threads.
        permissions:
          task:
            edit: true
            delete: true
          comment:
            edit: true
            delete: true
      - id: 2
        key: dev
        name: Development
        position: 2
        # Allow comment edit/delete during dev so the agent can correct
        # in-flight notes; task fields stay locked (use archive/unarchive
        # for major edits).
        permissions:
          comment:
            edit: true
            delete: true
      - id: 3
        key: review
        name: Review
        position: 3
        # Allow comment edit during review so the agent can refine the
        # handoff notes that gate the move to done; task fields stay
        # locked. Deletes remain disallowed via workflow defaults.
        permissions:
          comment:
            edit: true
      - id: 4
        key: done
        name: Done
        position: 4
        # Done freezes destructive operations explicitly: neither the
        # task nor its comments can be deleted once shipped. Inherits
        # edit: false from workflow defaults. Use the regression
        # transitions back to review/dev/backlog to reopen work.
        permissions:
          task:
            delete: false
          comment:
            delete: false
    transitions:
      - from: 1
        to: 2
        guards:
          - type: comments_tagged
            tag: self-branch
            count: 1
            hint: "${{intl:guard.omakase.dev.comments_tagged.self_branch.hint}}"
          - type: blockers_in
            buckets: [done]
            hint: "${{intl:guard.omakase.dev.blockers_in.hint}}"
          - type: wave_gate
            hint: "${{intl:guard.wave_gate.hint}}"
      - from: 2
        to: 3
        guards:
          - type: comments_tagged
            tag: resume
            count: 1
            hint: "${{intl:guard.omakase.review.comments_tagged.resume.hint}}"
          - type: comments_tagged
            tag: tests-passing
            count: 1
            hint: "${{intl:guard.omakase.review.comments_tagged.tests_passing.hint}}"
      - from: 3
        to: 4
        guards:
          - type: comments_tagged
            tag: documentation
            count: 1
            hint: "${{intl:guard.omakase.done.comments_tagged.documentation.hint}}"
      # Regression transitions — no guards: reopening work is a deliberate
      # corrective action and shouldn't be gated by the forward checklists.
      - from: 2
        to: 1
      - from: 3
        to: 1
      - from: 3
        to: 2
      - from: 4
        to: 3
      - from: 4
        to: 2
      - from: 4
        to: 1
# skills:, laws: and personas: are optional. When omitted, every .md file in
# skills/, laws/ and personas/ is loaded automatically — drop a file into the
# folder and it becomes available. Uncomment a slot to act as a strict allowlist
# (only listed slugs activate) or to declare explicit persona ⇄ skill/law wiring.
#
# skills:
#   - go
#   - sqlite
#   - cli
# laws:
#   - project-scope-only
#   - workflow-enforced
#   - yaml-is-canonical
personas:
  - slug: engineer
    skills:
      - trunk-based-development
      - continuous-integration
      - test-driven-development
      - dora-mindset
      - implementation
      - markdown
  - slug: product-owner
    skills:
      - discovery
      - user-story-writing
      - pdca-cycle
      - five-w-two-h
      - smart-goals
      - invest-stories
      - moscow-prioritization
      - rice-scoring
      - non-functional-requirements
      - markdown
  - slug: documentation-agent
    skills:
      - documentation
      - architecture-mapping
      - requirements-mapping
      - readme-curation
      - markdown
  - slug: commit-author
    skills:
      - conventional-commits-spec
      - markdown
  - slug: code-reviewer
    skills:
      - refactoring-catalog
      - code-smells
      - solid-principles
      - legacy-seams
      - security-review-lens
      - markdown
  - slug: check-runner
    skills:
      - test-driven-development
      - static-analysis-discipline
      - coverage-analysis
      - regression-detection
      - markdown
# mcp_commands binds each `okt-*` MCP prompt to a persona, a set of laws, and a
# set of templates. The reserved `global:` entry declares laws inherited by
# every command. Per-command entries can add `laws:` or opt out of inherited
# laws via `laws_disabled:` (e.g. `okt-imagine` skips template-fidelity so the
# discovery flow can sketch freely).
#
# The default kit follows a REST-style handoff pattern: each command resolves
# one role and ends its action text by suggesting the next command. Cycle:
#
#   okt → okt-resume / okt-imagine
#     okt-imagine → okt-create
#       okt-create → (move to dev → guard) → okt-continue / okt-implement
#         okt-resume → okt-continue
#           okt-continue → okt-implement
#             okt-implement → (move to review → guard)
#   okt-document is parallel — surfaces drift; if material work is needed,
#   suggests okt-create to spin up a documentation task.
#   okt-config is parallel — orients the agent on the config layout so it can
#   answer edit questions without guessing; suggests okt-implement when the
#   user has a concrete edit in mind.
#   okt-commit is parallel — drafts Conventional Commits for user-authored
#   edits made outside the okt-implement loop; never auto-pushes.
#   okt-review is parallel — walks the diff with a Fowler/Beck/Martin/
#   Feathers lens; surfaces findings + refactor opportunities; read-only
#   (suggests okt-implement to apply fixes).
#   okt-check is parallel — discovers test/lint/audit targets, runs them,
#   emits a tabular pass/fail report; read-only (suggests okt-implement
#   for fixes or okt-review for triage).
mcp_commands:
  global:
    laws:
      - template-fidelity
      - authorize-remote-writes
  okt:
    persona: engineer
  okt-imagine:
    persona: product-owner
    laws_disabled:
      - template-fidelity
    templates:
      - comment-5w2h
      - comment-smart-success
  okt-create:
    persona: product-owner
    laws:
      - invest-stories
      - outcome-over-output
    templates:
      - user-story
      - task-bugfix
      - comment-smart-success
      - comment-moscow
  okt-resume:
    persona: engineer
  okt-continue:
    persona: engineer
  okt-implement:
    persona: engineer
    laws:
      - bounded-self-review
      - no-silent-behavior-changes
      - conventional-commits
      - self-report
      - green-main-always
      - small-batches
      - boy-scout-rule
      - test-evidence
    templates:
      - pull-request
      - comment-tests-passing
      - comment-refactor-drive-by
  okt-document:
    persona: documentation-agent
  okt-config:
    persona: documentation-agent
    templates:
      - config-orientation
  okt-commit:
    persona: commit-author
    laws:
      - conventional-commits
      - no-coauthored-by
      - scope-from-paths
  okt-review:
    persona: code-reviewer
    laws:
      - findings-actionable
      - no-praise-pad
      - severity-tagged
    templates:
      - comment-review-findings
      - comment-refactor-opportunities
  okt-check:
    persona: check-runner
    laws:
      - findings-actionable
      - severity-tagged
    templates:
      - comment-check-report
