version: 1
kit: {id: 101, key: omakase, name: Omakase Workflow Preset}
config:
  output: {json_minified: true, omit_empty: true}
  context: {default_level: 2, max_tokens: 12000}
  mcp:
    recent_comment_limit: 5
    max_comment_chars: 0
    include_workflow_in_continue: true
    cache_prompts: true
    recent_context_limit: 3
    next_work_limit: 5
    similar_task_limit: 5
  workflow: {active: omakase}
  theme: {active: omakiten}
  tui:
    token_badge: {yellow_at: 150, red_at: 400}
  sqlite: {busy_timeout_ms: 5000}
  activity_log: {max_rows: 500, max_age_days: 7}
  solutions: {default_top_limit: 10, max_top_limit: 100}
  events:
    default_recent_limit: 50
    defaults: {log: true, broadcast: true, hook: true}
  hooks: []
  search:
    stopwords: [and, are, for, from, into, the, this, that, with]
  tag_synonyms:
    golang: go
    javascript: js
    typescript: ts
    nodejs: node
    node-js: node
    postgres: postgresql
    psql: postgresql
    mongo: mongodb
    k8s: kubernetes
    tf: terraform
    py: python
  template_defaults: [task, pr, comment-resume, comment-selfbranch, comment-documentation]
  priorities:
    - {id: 1, value: low, color: success}
    - {id: 2, value: normal, default: true, color: info}
    - {id: 3, value: high, color: error}
  severities:
    - {id: 1, value: info, color: info}
    - {id: 2, value: warning, default: true, color: warning}
    - {id: 3, value: error, color: error}
  views:
    board:
      sort: {field: created_at, order: desc}
      filter: {priority: []}
    table:
      sort: {field: created_at, order: desc}
      filter: {priority: [], bucket: []}
    graph:
      sort: {field: id, order: asc}
    logs:
      sort: {order: desc}
      limit: 50
      filter: {source: []}
    task_activity:
      sort: {order: asc}
workflows:
  - id: 1
    key: omakase
    name: Omakase Workflow
    defaults:
      task: {edit: false, delete: false}
      comment: {edit: false, delete: false}
    buckets:
      - id: 1
        key: backlog
        name: Backlog
        position: 1
        permissions:
          task: {edit: true, delete: true}
          comment: {edit: true, delete: true}
      - id: 2
        key: dev
        name: Development
        position: 2
        permissions:
          comment: {edit: true, delete: true}
      - {id: 3, key: review, name: Review, position: 3}
      - {id: 4, key: done, name: Done, position: 4}
    transitions:
      - from: 1
        to: 2
        guards:
          - type: comments_tagged
            tag: self-branch
            count: 1
            hint: "Add a #self-branch comment naming the branch and working path before development starts."
      - from: 2
        to: 3
        guards:
          - type: comments_tagged
            tag: resume
            count: 1
            hint: "Add a #resume handoff comment before requesting review."
      - from: 3
        to: 4
        guards:
          - type: comments_tagged
            tag: documentation
            count: 1
            hint: "Add a #documentation comment before closing the task."
      - {from: 3, to: 2}
      - {from: 4, to: 3}
