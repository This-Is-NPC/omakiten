version: 1
kit: {id: 104, key: shokunin, name: Shokunin Workflow Preset}
config:
  output: {json_minified: true, omit_empty: true}
  context: {default_level: 3, max_tokens: 12000}
  mcp:
    recent_comment_limit: 5
    max_comment_chars: 0
    include_workflow_in_continue: true
    cache_prompts: true
    recent_context_limit: 3
    next_work_limit: 5
    similar_task_limit: 5
  workflow: {active: shokunin}
  theme: {active: omakiten}
  tui:
    token_badge: {yellow_at: 150, red_at: 400}
  sqlite: {busy_timeout_ms: 5000}
  activity_log: {max_rows: 500, max_age_days: 7}
  solutions: {default_top_limit: 10, max_top_limit: 100}
  events:
    default_recent_limit: 50
    defaults: {log: true, broadcast: true, hook: true}
  hooks: []
  search:
    stopwords: [and, are, for, from, into, the, this, that, with]
  tag_synonyms:
    golang: go
    javascript: js
    typescript: ts
    nodejs: node
    node-js: node
    postgres: postgresql
    psql: postgresql
    mongo: mongodb
    k8s: kubernetes
    tf: terraform
    py: python
  template_defaults: [task, pr, comment-resume, comment-selfbranch, comment-documentation]
  priorities:
    - {id: 1, value: low, color: success}
    - {id: 2, value: normal, default: true, color: info}
    - {id: 3, value: high, color: error}
  severities:
    - {id: 1, value: info, color: info}
    - {id: 2, value: warning, default: true, color: warning}
    - {id: 3, value: error, color: error}
  views:
    board:
      sort: {field: created_at, order: desc}
      filter: {priority: []}
    table:
      sort: {field: created_at, order: desc}
      filter: {priority: [], bucket: []}
    graph:
      sort: {field: id, order: asc}
    logs:
      sort: {order: desc}
      limit: 50
      filter: {source: []}
    task_activity:
      sort: {order: asc}
personas:
  - slug: craftsperson
    skills: [sre-discipline, risk-driven-development, postmortem-authoring, change-management, test-driven-development-strict, static-analysis-discipline, implementation, markdown]
  - slug: product-owner
    skills: [discovery, user-story-writing, pdca-cycle, five-w-two-h, smart-goals, invest-stories, moscow-prioritization, rice-scoring, okr-framing, non-functional-requirements, markdown]
  - slug: documentation-agent
    skills: [documentation, architecture-mapping, requirements-mapping, readme-curation, markdown]
mcp_commands:
  global:
    laws: [template-fidelity, authorize-remote-writes, project-scope-only]
  okt:
    persona: craftsperson
  okt-imagine:
    persona: product-owner
    laws_disabled: [template-fidelity]
    templates: [comment-5w2h, comment-smart-success]
  okt-create:
    persona: product-owner
    laws: [blast-radius-awareness, error-budget-aware, invest-stories, outcome-over-output, prioritization-recorded, non-functional-explicit]
    templates: [task-change-request, comment-requirements, comment-acceptance, comment-risk-assessment, comment-smart-success, comment-moscow, comment-rice-score, comment-okr, comment-non-functional]
  okt-resume:
    persona: craftsperson
  okt-continue:
    persona: craftsperson
  okt-implement:
    persona: craftsperson
    laws: [pre-mortem-required, rollback-plan-mandatory, dual-peer-review, coverage-gate, blast-radius-awareness, error-budget-aware, conventional-commits, no-silent-behavior-changes]
    templates: [pull-request, comment-pre-mortem, comment-rollback-plan, comment-peer-review-strict, comment-tests-passing-strict, comment-risk-assessment, comment-scribe-correction]
  okt-document:
    persona: documentation-agent
    laws: [blameless-postmortem]
    templates: [comment-postmortem, comment-lessons-learned]
  okt-config:
    persona: documentation-agent
    templates: [config-orientation]
workflows:
  - id: 1
    key: shokunin
    name: Shokunin Workflow
    defaults:
      task: {edit: false, delete: false}
      comment: {edit: false, delete: false}
    operations:
      archive:
        guards:
          - {type: comments_tagged, tag: documentation, count: 1, hint: "Add #documentation before archiving shokunin work."}
          - {type: comments_tagged, tag: lessons-learned, count: 1, hint: "Add #lessons-learned summarizing what worked / what didn't before archiving."}
      delete:
        guards:
          - {type: comments_tagged, tag: peer-review, count: 1, hint: "Add #peer-review before deleting shokunin work."}
      unarchive:
        guards:
          - {type: comments_tagged, tag: peer-review, count: 1, hint: "Add a #peer-review approving the reopen before unarchiving."}
    buckets:
      - id: 1
        key: requirements
        name: Requirements
        position: 1
        permissions:
          task: {edit: true, delete: false}
          comment: {edit: true, delete: false}
      - id: 2
        key: planning
        name: Planning
        position: 2
        permissions:
          comment: {edit: true, delete: false}
      - id: 3
        key: dev
        name: Development
        position: 3
        permissions:
          comment: {edit: true, delete: false}
      - {id: 4, key: review, name: Review, position: 4}
      - {id: 5, key: docs, name: Documentation, position: 5}
      - {id: 6, key: done, name: Done, position: 6}
    transitions:
      - from: 1
        to: 2
        guards:
          - {type: comments_tagged, tag: 5w2h, count: 1, hint: "Add a #5w2h comment walking through the seven elicitation questions (What / Why / Who / When / Where / How / How much) before planning starts."}
          - {type: comments_tagged, tag: requirements, count: 1, hint: "Add a #requirements comment with the user story and acceptance signals before planning starts."}
          - {type: comments_tagged, tag: acceptance, count: 1, hint: "Add a #acceptance comment with testable criteria the requester and reviewer can verify."}
      - from: 2
        to: 3
        guards:
          - {type: comments_tagged, tag: self-branch, count: 1, hint: "Add a #self-branch comment naming the branch and working path."}
          - {type: comments_tagged, tag: pre-mortem, count: 1, hint: "Add a #pre-mortem comment naming the top failure modes, detection signals, and mitigations before any code lands."}
          - {type: comments_tagged, tag: risk-assessment, count: 1, hint: "Add a #risk-assessment naming the risk matrix, blast radius, SLO impact, and residual risk accepted."}
          - {type: blockers_in, buckets: [done, docs], hint: "Every blocker must be in Done or Documentation before development starts."}
      - from: 3
        to: 4
        guards:
          - {type: comments_tagged, tag: resume, count: 1, hint: "Add a #resume handoff summarizing what was implemented, decisions, and open questions."}
          - {type: comments_tagged, tag: tests-passing, count: 1, hint: "Add #tests-passing with the coverage delta, test types, and perf regression check."}
          - {type: comments_tagged, tag: rollback-plan, count: 1, hint: "Add a #rollback-plan with revert steps, post-rollback validation, and comms plan before review."}
      - from: 4
        to: 5
        guards:
          - {type: comments_tagged, tag: peer-review, count: 2, hint: "Add ≥ 2 distinct #peer-review comments from independent reviewers (not the author). Each carries verdict, approval scope, and reviewed-artifacts checklist."}
      - from: 5
        to: 6
        guards:
          - {type: comments_tagged, tag: documentation, count: 1, hint: "Add a #documentation comment summarizing commits merged, related tags, and confirmation that the task has been reviewed and properly tagged."}
          - {type: comments_tagged, tag: lessons-learned, count: 1, hint: "Add a #lessons-learned comment naming what worked / what didn't and any process changes proposed."}
      - {from: 4, to: 3}
      - {from: 5, to: 4}
      - {from: 6, to: 4}
