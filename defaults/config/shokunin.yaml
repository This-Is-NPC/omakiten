version: 1
kit: {id: 104, key: shokunin, name: Shokunin Workflow Preset}
config:
  output: {json_minified: true, omit_empty: true}
  context: {default_level: 3, max_tokens: 12000}
  mcp:
    recent_comment_limit: 5
    max_comment_chars: 0
    include_workflow_in_continue: true
    cache_prompts: true
    recent_context_limit: 3
    next_work_limit: 5
    similar_task_limit: 5
  workflow: {active: shokunin}
  theme: {active: omakiten}
  tui:
    token_badge: {yellow_at: 150, red_at: 400}
  sqlite: {busy_timeout_ms: 5000, cache_size_kb: 1024, mmap_size_bytes: 0}
  activity_log: {max_rows: 500, max_age_days: 7}
  solutions: {default_top_limit: 10, max_top_limit: 100}
  backup: {retention_count: 5}
  events:
    default_recent_limit: 50
    defaults:
      log: true
      broadcast: true
      hook: true
      log_visible: true
      metric: ""
      entity_type: ""
    definitions:
      comment:
        category: comment
        display: "comment added"
        formatter: comment
      comment.edited:
        category: comment
        display: "comment edited"
        formatter: comment.edited
      comment.removed:
        category: comment
        display: "comment removed"
        formatter: comment.removed
      task.created:
        category: task
        display: "task created"
        formatter: task.created
      task.moved:
        category: task
        display: "task moved"
        formatter: task.moved
      task.migrated:
        category: task
        display: "task migrated"
        formatter: task.migrated
      task.bucket_orphaned:
        category: task
        display: "task bucket orphaned"
        formatter: task.bucket_orphaned
      task.completed:
        category: task
        display: "task completed"
        formatter: task.completed
      task.edited:
        category: task
        display: "task edited"
        formatter: task.edited
      task.removed:
        category: task
        display: "task removed"
        formatter: task.removed
      task.archived:
        category: task
        display: "task archived"
        formatter: task.archived
      task.unarchived:
        category: task
        display: "task unarchived"
        formatter: task.unarchived
      task.assigned:
        category: task
        display: "task assigned"
        formatter: task.assigned
      task.unassigned:
        category: task
        display: "task unassigned"
        formatter: task.unassigned
      project.removed:
        category: audit
        display: "project removed"
        formatter: project.removed
      plan.created:
        category: plan
        display: "plan created"
        formatter: plan.created
      plan.wave_added:
        category: plan
        display: "plan wave added"
        formatter: plan.wave_added
      plan.goal_edited:
        category: plan
        display: "plan goal edited"
        formatter: plan.goal_edited
      plan.done:
        category: plan
        display: "plan done"
        formatter: plan.done
      plan.abandoned:
        category: plan
        display: "plan abandoned"
        formatter: plan.abandoned
      tag.added:
        category: tag-dep
        display: "tag added"
        formatter: tag.added
      tag.removed:
        category: tag-dep
        display: "tag removed"
        formatter: tag.removed
      dependency.added:
        category: tag-dep
        display: "dependency added"
        formatter: dependency.added
      dependency.removed:
        category: tag-dep
        display: "dependency removed"
        formatter: dependency.removed
      guard.violated:
        category: guard
        display: "guard violated"
        formatter: guard.violated
      error.recorded:
        category: audit
        display: "error recorded"
        entity_type: error
        metric: error_recorded
        formatter: error.recorded
      errors.researched:
        category: audit
        display: "errors researched"
        entity_type: search
        metric: error_searched
        formatter: errors.researched
      solution.added:
        category: audit
        display: "solution added"
        entity_type: solution
        metric: solution_added
        formatter: solution.added
      solution.confirmed:
        category: audit
        display: "solution confirmed"
        entity_type: solution
        formatter: solution.confirmed
      solution.liked:
        category: audit
        display: "solution liked"
        entity_type: solution
        metric: solution_liked
        formatter: solution.liked
      solution.failed:
        category: audit
        display: "solution failed"
        entity_type: solution
        metric: solution_failed
        formatter: solution.failed
      solution.viewed_top:
        category: audit
        display: "solution viewed top"
        entity_type: solution
        metric: solution_top_viewed
        formatter: solution.viewed_top
      hook.executed:
        category: hook
        display: "hook executed"
        formatter: hook.executed
      subtask_kit.notice_emitted:
        category: domain
        display: "subtask kit notice emitted"
        formatter: subtask_kit.notice_emitted
      bundle.swapped:
        category: domain
        display: "bundle swapped"
        formatter: bundle.swapped
      bundle.imported:
        category: domain
        display: "bundle imported"
        formatter: bundle.imported
      confirmation.granted:
        category: audit
        display: "confirmation granted"
        formatter: confirmation.granted
      trick.executed:
        category: trick
        display: "trick executed"
        formatter: trick.executed
      cli.tool_call:
        category: tool_call
        display: "CLI tool call"
        formatter: cli.tool_call
      mcp.tool_call:
        category: tool_call
        display: "MCP tool call"
        formatter: mcp.tool_call
      tui.tool_call:
        category: tool_call
        display: "TUI tool call"
        formatter: tui.tool_call
      note.created:
        category: note
        display: "note created"
        formatter: note.created
      note.edited:
        category: note
        display: "note edited"
        formatter: note.edited
      note.pinned:
        category: note
        display: "note pinned/unpinned"
        formatter: note.pinned
      note.removed:
        category: note
        display: "note removed"
        formatter: note.removed
      update.healthcheck.passed:
        category: update
        display: "update health-check passed"
        formatter: update.healthcheck.passed
      update.healthcheck.failed:
        category: update
        display: "update health-check failed"
        formatter: update.healthcheck.failed
      update.swap.completed:
        category: update
        display: "update binary swap completed"
        formatter: update.swap.completed
      update.swap.aborted:
        category: update
        display: "update binary swap aborted"
        formatter: update.swap.aborted
      tui.healthcheck.failed:
        category: tui
        display: "tui boot health-check failed"
        formatter: tui.healthcheck.failed
  hooks:
    - on: task.created
      notification: kitten_informative
      message: "${{intl:notifications.shokunin.task_created.message}}"
    - on: task.moved
      notification: kitten_informative
      message: "${{intl:notifications.shokunin.task_moved.message}}"
    - on: task.edited
      notification: kitten_informative
      message: "${{intl:notifications.shokunin.task_edited.message}}"
    - on: task.completed
      notification: kitten_success
      message: "${{intl:notifications.shokunin.task_completed.message}}"
    - on: guard.violated
      when: { operation: task.delete }
      notification: kitten_destructive
      message: "${{intl:notifications.shokunin.guard_task_delete.message}}"
      detail_message_field: hint
    - on: guard.violated
      when: { operation: comment.delete }
      notification: kitten_destructive
      message: "${{intl:notifications.shokunin.guard_comment_delete.message}}"
      detail_message_field: hint
    - on: guard.violated
      when: { operation: task.transition }
      notification: kitten_blocked
      message: "${{intl:notifications.shokunin.guard_task_transition.message}}"
      detail_message_field: hint
    # Plan-aware specialisation — see omakase.yaml for the rationale.
    - on: guard.violated
      when: { operation: task.transition, rule: wave_gate }
      notification: kitten_blocked
      message: "${{intl:notifications.shokunin.guard_wave_gate.message}}"
      detail_message_field: hint
    - on: guard.violated
      when: { operation: task.edit }
      notification: kitten_blocked
      message: "${{intl:notifications.shokunin.guard_task_edit.message}}"
      detail_message_field: hint
    - on: guard.violated
      when: { operation: comment.edit }
      notification: kitten_blocked
      message: "${{intl:notifications.shokunin.guard_comment_edit.message}}"
      detail_message_field: hint
    - on: guard.violated
      when: { operation: task.archive }
      notification: kitten_blocked
      message: "${{intl:notifications.shokunin.guard_task_archive.message}}"
      detail_message_field: hint
    - on: guard.violated
      when: { operation: task.unarchive }
      notification: kitten_blocked
      message: "${{intl:notifications.shokunin.guard_task_unarchive.message}}"
      detail_message_field: hint
    - on: task.removed
      notification: kitten_destructive
      message: "${{intl:notifications.shokunin.task_removed.message}}"
    - on: comment.removed
      notification: kitten_destructive
      message: "${{intl:notifications.shokunin.comment_removed.message}}"
    - on: task.archived
      notification: kitten_archive
      message: "${{intl:notifications.shokunin.task_archived.message}}"
    - on: task.unarchived
      notification: kitten_archive
      message: "${{intl:notifications.shokunin.task_unarchived.message}}"
    - on: comment
      when: { author_type: human }
      notification: kitten_informative
      message: "${{intl:notifications.shokunin.comment_added_human.message}}"
    - on: comment
      when: { author_type: agent }
      notification: kitten_informative
      message: "${{intl:notifications.shokunin.comment_added_agent.message}}"
    - on: comment.edited
      notification: kitten_informative
      message: "${{intl:notifications.shokunin.comment_edited.message}}"
    - on: tag.added
      notification: kitten_link
      message: "${{intl:notifications.shokunin.tag_added.message}}"
    - on: tag.removed
      notification: kitten_link
      message: "${{intl:notifications.shokunin.tag_removed.message}}"
    - on: dependency.added
      notification: kitten_link
      message: "${{intl:notifications.shokunin.dependency_added.message}}"
    - on: dependency.removed
      notification: kitten_link
      message: "${{intl:notifications.shokunin.dependency_removed.message}}"
    - on: error.recorded
      notification: kitten_knowledge
      message: "${{intl:notifications.shokunin.error_recorded.message}}"
    - on: errors.researched
      notification: kitten_knowledge
      message: "${{intl:notifications.shokunin.errors_researched.message}}"
    - on: solution.added
      notification: kitten_knowledge
      message: "${{intl:notifications.shokunin.solution_added.message}}"
    - on: solution.liked
      notification: kitten_success
      message: "${{intl:notifications.shokunin.solution_liked.message}}"
    - on: solution.failed
      notification: kitten_knowledge
      message: "${{intl:notifications.shokunin.solution_failed.message}}"
    - on: solution.viewed_top
      notification: kitten_knowledge
      message: "${{intl:notifications.shokunin.solution_viewed_top.message}}"
  search:
    stopwords: [and, are, for, from, into, the, this, that, with]
  tag_synonyms:
    golang: go
    javascript: js
    typescript: ts
    nodejs: node
    node-js: node
    postgres: postgresql
    psql: postgresql
    mongo: mongodb
    k8s: kubernetes
    tf: terraform
    py: python
  template_defaults: [task, pr, comment-resume, comment-selfbranch, comment-documentation]
  priorities:
    - {id: 1, value: low, color: success}
    - {id: 2, value: normal, default: true, color: info}
    - {id: 3, value: high, color: error}
  severities:
    - {id: 1, value: info, color: info}
    - {id: 2, value: warning, default: true, color: warning}
    - {id: 3, value: error, color: error}
  views:
    board:
      sort: {field: created_at, order: desc}
      filter: {priority: []}
    table:
      sort: {field: created_at, order: desc}
      filter: {priority: [], bucket: []}
    graph:
      sort: {field: id, order: asc}
    logs:
      sort: {order: desc}
      limit: 50
      window_days: 30
    task_activity:
      sort: {order: asc}
# Shokunin (Fullmetal Alchemist: Brotherhood) themed roster — Pitch B, by
# canonical role (#189 W5.1). Designated canonical reference layout. Schema v2:
# each persona declares a `skill_repertoire` (the full pool it is equipped with);
# mcp_commands below select a SUBSET of that pool (enforced by
# validateMCPCommandSkillSubset). Persona carries TONE; skill carries PROCEDURE;
# templates carry STRUCTURE. Concierge (maes-hughes) also covers the Tester slot;
# Scribe (alphonse-elric) carries all four #359 note skills and binds the
# notes-bearing slots. king-bradley stays in the roster (locked authority).
personas:
  # Concierge + Tester — intel/router who also verifies the evidence. Repertoire
  # carries the Tester skills so the okt-task-check / okt-task-quality slots
  # resolve a real subset alongside the Concierge entry/system slots.
  - slug: maes-hughes
    schema_version: 2
    skill_repertoire:
      - pdca-cycle
      - discovery
      - architecture-mapping
      - documentation
      - staged-delivery
      - regression-detection
      - coverage-analysis
      - static-analysis-discipline
      - test-driven-development
      - gate-of-truth-toll
      - markdown
  # Scribe — record-keeper. Repertoire includes all four #359 note skills so the
  # okt-pause and okt-note-* slots resolve (AC#6).
  - slug: alphonse-elric
    schema_version: 2
    skill_repertoire:
      - documentation
      - architecture-mapping
      - handoff-synthesis
      - note-capture
      - standup-digest
      - recap-timeline
      - postmortem-authoring
      - markdown
  # Owner — direction, prioritization, requirements, plan authoring.
  - slug: roy-mustang
    schema_version: 2
    skill_repertoire:
      - five-w-two-h
      - smart-goals
      - staged-delivery
      - dora-mindset
      - risk-driven-development
      - requirements-elicitation
      - non-functional-requirements
      - moscow-prioritization
      - rice-scoring
      - user-story-writing
      - invest-stories
      - markdown
  # Ideator — discovery and cheap experiments.
  - slug: pinako-rockbell
    schema_version: 2
    skill_repertoire:
      - discovery
      - lean-experimentation
      - five-w-two-h
      - markdown
  # Builder — small green increments, full price paid up front. Repertoire
  # carries the themed gate-of-truth-toll (strict TDD) and automail-fallback
  # (rollback) skills alongside the generic Builder pool.
  - slug: edward-elric
    schema_version: 2
    skill_repertoire:
      - implementation
      - test-driven-development
      - gate-of-truth-toll
      - automail-fallback
      - trunk-based-development
      - continuous-integration
      - solid-principles
      - code-smells
      - refactoring-catalog
      - markdown
  # Reviewer — whole-diff read, structural + security lens.
  - slug: olivier-armstrong
    schema_version: 2
    skill_repertoire:
      - code-smells
      - refactoring-catalog
      - security-review-lens
      - solid-principles
      - markdown
  # Committer — Conventional Commits, scoped history, never auto-pushes.
  - slug: riza-hawkeye
    schema_version: 2
    skill_repertoire:
      - conventional-commits-spec
      - markdown
  # Locked authority — kept in the roster, bound to the hard-gate orchestrator
  # (okt-audit) so the persona ships even when lightly used.
  - slug: king-bradley
    schema_version: 2
    skill_repertoire:
      - risk-driven-development
      - markdown
mcp_commands:
  global:
    laws: [template-fidelity, authorize-remote-writes, project-scope-only]
  # Shokunin slot bindings (#189 W5.1). Each command binds the themed persona for
  # its canonical role and selects a SUBSET of that persona's skill_repertoire.
  # The W1 subset validator enforces skills ⊆ repertoire.
  okt:
    persona: maes-hughes
    skills: [pdca-cycle]
  # Guiding orchestrators. okt-start (Concierge smart entry, shared with the bare
  # `okt` shortcut) binds the Concierge (maes-hughes). okt-pause (Concierge close)
  # binds the Scribe (alphonse-elric) — see the notes block. okt-shape / okt-audit
  # are Owner orchestrators → roy-mustang; okt-audit additionally seats the locked
  # king-bradley authority on its hard gate.
  okt-start:
    persona: maes-hughes
    skills: [pdca-cycle, discovery]
  okt-shape:
    persona: roy-mustang
    skills: [five-w-two-h, smart-goals]
  okt-audit:
    persona: king-bradley
    skills: [risk-driven-development]
    laws: [briggs-fortress-gate]
  # okt-run Owner director — delegates implementation to per-task Builder
  # subagents and reviews their compact returns.
  okt-run:
    persona: roy-mustang
    skills: [staged-delivery, dora-mindset]
  okt-task-imagine:
    persona: pinako-rockbell
    skills: [discovery, lean-experimentation]
    laws_disabled: [template-fidelity]
    templates: [comment-5w2h, comment-smart-success]
  # Granular lifecycle commands. Ideator → pinako-rockbell; Owner → roy-mustang;
  # Builder → edward-elric; Concierge → maes-hughes.
  okt-task-research:
    persona: pinako-rockbell
    skills: [discovery]
    laws_disabled: [template-fidelity]
  okt-task-validate:
    persona: pinako-rockbell
    skills: [lean-experimentation]
    laws_disabled: [template-fidelity]
  okt-task-requirements:
    persona: roy-mustang
    skills: [requirements-elicitation, non-functional-requirements]
    templates: [comment-requirements, comment-acceptance]
  okt-task-prioritize:
    persona: roy-mustang
    skills: [moscow-prioritization, rice-scoring]
    templates: [comment-moscow, comment-rice-score]
  okt-task-create:
    persona: roy-mustang
    skills: [user-story-writing, invest-stories, smart-goals]
    laws: [invest-stories, outcome-over-output, non-functional-explicit]
    templates: [task-change-request, comment-requirements, comment-acceptance, comment-smart-success, comment-moscow, comment-non-functional]
  okt-task-decompose:
    persona: roy-mustang
    skills: [user-story-writing]
  okt-task-estimate:
    persona: roy-mustang
    skills: [rice-scoring]
  okt-task-design:
    persona: edward-elric
    skills: [solid-principles]
  okt-project-resume:
    persona: maes-hughes
    skills: [pdca-cycle]
  okt-project-continue:
    persona: maes-hughes
    skills: [pdca-cycle]
  # Granular plan commands. Owner role → roy-mustang (authors + claims plans).
  okt-plan-create:
    persona: roy-mustang
    skills: [staged-delivery]
  okt-plan-show:
    persona: roy-mustang
    skills: [staged-delivery]
  okt-plan-continue:
    persona: roy-mustang
    skills: [staged-delivery]
  okt-plan-claim:
    persona: roy-mustang
    skills: [staged-delivery]
  okt-task-resume:
    persona: edward-elric
    skills: [implementation]
  okt-task-continue:
    persona: edward-elric
    skills: [implementation]
  # Builder loop. Themed laws: transmutation-circle-required (pre-mortem),
  # automail-fallback skill (rollback), truth-cannot-be-hidden (no silent change).
  okt-task-implement:
    persona: edward-elric
    skills: [implementation, gate-of-truth-toll, automail-fallback, trunk-based-development, continuous-integration]
    laws: [transmutation-circle-required, truth-cannot-be-hidden, conventional-commits, no-silent-behavior-changes]
    templates: [pull-request, comment-pre-mortem, comment-rollback-plan, comment-tests-passing-strict, comment-risk-assessment]
  okt-task-self-review:
    persona: edward-elric
    skills: [code-smells]
    laws: [no-silent-behavior-changes]
    templates: [comment-peer-review-strict]
  okt-task-refactor:
    persona: edward-elric
    skills: [refactoring-catalog]
    laws: [truth-cannot-be-hidden, no-silent-behavior-changes]
    templates: [comment-review-findings]
  # Scribe → alphonse-elric.
  okt-task-document:
    persona: alphonse-elric
    skills: [documentation, architecture-mapping]
    laws: [blameless-postmortem]
  okt-task-debrief:
    persona: alphonse-elric
    skills: [postmortem-authoring]
    laws: [blameless-postmortem, no-praise-pad]
  # System commands talk to the TOOL, not the project. Concierge/generic role →
  # maes-hughes. okt-skill pulls ANY skill (ungated by persona repertoire); the
  # markdown subset just shapes its own prose.
  okt-help:
    persona: maes-hughes
    skills: [markdown]
  okt-config:
    persona: maes-hughes
    skills: [markdown]
    templates: [config-orientation]
  okt-skill:
    persona: maes-hughes
    skills: [markdown]
  # Committer → riza-hawkeye.
  okt-task-commit:
    persona: riza-hawkeye
    skills: [conventional-commits-spec]
    laws: [conventional-commits, no-coauthored-by, link-task-comments]
  # Reviewer → olivier-armstrong. Themed gate: briggs-fortress-gate
  # (actionable findings, severity-ranked); equivalent-exchange-audit pairs the
  # verdict with evidence.
  okt-task-review:
    persona: olivier-armstrong
    skills: [code-smells, refactoring-catalog]
    laws: [briggs-fortress-gate, equivalent-exchange-audit, dual-review-required]
    templates: [comment-review-findings, comment-refactor-opportunities]
  okt-task-secure:
    persona: olivier-armstrong
    skills: [security-review-lens]
    laws: [briggs-fortress-gate]
    templates: [comment-review-findings]
  # Tester → maes-hughes (Concierge also holds the Tester repertoire).
  okt-task-check:
    persona: maes-hughes
    skills: [regression-detection, coverage-analysis]
    laws: [equivalent-exchange-audit, regression-required]
    templates: [comment-check-report]
  okt-task-quality:
    persona: maes-hughes
    skills: [static-analysis-discipline]
    laws: [equivalent-exchange-audit]
    templates: [comment-review-findings]
  # Notes / handoff. The Scribe (alphonse-elric) repertoire carries all four #359
  # note skills — handoff-synthesis, note-capture, standup-digest, recap-timeline
  # — so every notes-bearing slot resolves a real skill subset (AC#6). okt-pause
  # (orchestrator close) synthesises a handoff; okt-note-free captures ad-hoc;
  # okt-note-recap folds the standup digest into a wide-window recap.
  okt-pause:
    persona: alphonse-elric
    skills: [handoff-synthesis]
    laws: [project-scope-only, no-praise-pad]
    templates: [note-handoff]
  okt-note-free:
    persona: alphonse-elric
    skills: [note-capture]
    templates: [note-free]
  okt-note-recap:
    persona: alphonse-elric
    skills: [recap-timeline, standup-digest]
    templates: [note-recap, note-standup-digest]
  okt-note-list:
    persona: alphonse-elric
    skills: [note-capture]
  okt-note-show:
    persona: alphonse-elric
    skills: [note-capture]
workflows:
  - id: 1
    key: shokunin
    name: Shokunin Workflow
    defaults:
      task: {edit: false, delete: false}
      comment: {edit: false, delete: false}
    operations:
      archive:
        guards:
          - {type: comments_tagged, tag: documentation, count: 1, hint: "${{intl:guard.shokunin.archive.comments_tagged.documentation.hint}}"}
          - {type: comments_tagged, tag: lessons-learned, count: 1, hint: "${{intl:guard.shokunin.archive.comments_tagged.lessons_learned.hint}}"}
      delete:
        guards:
          - {type: comments_tagged, tag: peer-review, count: 1, hint: "${{intl:guard.shokunin.delete.comments_tagged.peer_review.hint}}"}
      unarchive:
        guards:
          - {type: comments_tagged, tag: peer-review, count: 1, hint: "${{intl:guard.shokunin.unarchive.comments_tagged.peer_review.hint}}"}
    buckets:
      - id: 1
        key: requirements
        name: Requirements
        position: 1
        permissions:
          task: {edit: true, delete: false}
          comment: {edit: true, delete: false}
      - id: 2
        key: planning
        name: Planning
        position: 2
        permissions:
          comment: {edit: true, delete: false}
      - id: 3
        key: dev
        name: Development
        position: 3
        permissions:
          comment: {edit: true, delete: false}
      - {id: 4, key: review, name: Review, position: 4}
      - {id: 5, key: docs, name: Documentation, position: 5}
      - {id: 6, key: done, name: Done, position: 6}
    transitions:
      - from: 1
        to: 2
        guards:
          - {type: comments_tagged, tag: 5w2h, count: 1, hint: "${{intl:guard.common.planning.comments_tagged.5w2h.hint}}"}
          - {type: comments_tagged, tag: requirements, count: 1, hint: "${{intl:guard.shokunin.planning.comments_tagged.requirements.hint}}"}
          - {type: comments_tagged, tag: acceptance, count: 1, hint: "${{intl:guard.common.planning.comments_tagged.acceptance.hint}}"}
      - from: 2
        to: 3
        guards:
          - {type: comments_tagged, tag: self-branch, count: 1, hint: "${{intl:guard.common.dev.comments_tagged.self_branch.hint}}"}
          - {type: comments_tagged, tag: pre-mortem, count: 1, hint: "${{intl:guard.shokunin.dev.comments_tagged.pre_mortem.hint}}"}
          - {type: comments_tagged, tag: risk-assessment, count: 1, hint: "${{intl:guard.shokunin.dev.comments_tagged.risk_assessment.hint}}"}
          - {type: blockers_in, buckets: [done, docs], hint: "${{intl:guard.common.dev.blockers_in.hint}}"}
          - {type: wave_gate, hint: "${{intl:guard.wave_gate.hint}}"}
      - from: 3
        to: 4
        guards:
          - {type: comments_tagged, tag: resume, count: 1, hint: "${{intl:guard.shokunin.review.comments_tagged.resume.hint}}"}
          - {type: comments_tagged, tag: tests-passing, count: 1, hint: "${{intl:guard.shokunin.review.comments_tagged.tests_passing.hint}}"}
          - {type: comments_tagged, tag: rollback-plan, count: 1, hint: "${{intl:guard.shokunin.review.comments_tagged.rollback_plan.hint}}"}
          - {type: subtasks_complete, hint: "${{intl:guard.subtasks_complete.hint}}"}
      - from: 4
        to: 5
        guards:
          - {type: comments_tagged, tag: peer-review, count: 2, hint: "${{intl:guard.shokunin.docs.comments_tagged.peer_review.hint}}"}
      - from: 5
        to: 6
        guards:
          - {type: comments_tagged, tag: documentation, count: 1, hint: "${{intl:guard.common.done.comments_tagged.documentation.hint}}"}
          - {type: comments_tagged, tag: lessons-learned, count: 1, hint: "${{intl:guard.shokunin.done.comments_tagged.lessons_learned.hint}}"}
      - {from: 4, to: 3}
      - {from: 5, to: 4}
      - {from: 6, to: 4}
