    skills: [documentation, architecture-mapping]
  okt-task-debrief:
    persona: sophie-hatter
    skills: [postmortem-authoring]
    laws: [no-praise-pad]
  okt-help:
    persona: calcifer
    skills: [markdown]
  okt-config:
    persona: calcifer
    skills: [markdown]
    templates: [config-orientation]
  okt-skill:
    persona: calcifer
    skills: [markdown]
  okt-task-commit:
    persona: markl
