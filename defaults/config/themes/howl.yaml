# Izakaya (Howl's Moving Castle) themed roster — personas and mcp_commands.
# Imported by izakaya.yaml via fragment selectors:
#   personas:     { from: ./modules/howl.yaml#personas }
#   mcp_commands: { from: ./modules/howl.yaml#mcp_commands }
personas:
  # Concierge + Tester — the hearth-fire that sees every room and routes work,
  # then proves what burns clean before it ships.
  - slug: calcifer
    schema_version: 2
    skill_repertoire:
      - pdca-cycle
      - discovery
      - regression-detection
      - coverage-analysis
      - static-analysis-discipline
      - test-driven-development
      - markdown
      - okt-config-playbook
      - okt-help-playbook
      - okt-project-continue-playbook
      - okt-project-resume-playbook
      - okt-skill-playbook
      - okt-start-playbook
      - okt-task-check-playbook
      - okt-task-quality-playbook
  # Ideator — bold notions chased with a cheap probe first.
  - slug: witch-of-the-waste
    schema_version: 2
    skill_repertoire:
      - discovery
      - lean-experimentation
      - five-w-two-h
      - markdown
      - okt-task-imagine-playbook
      - okt-task-research-playbook
      - okt-task-validate-playbook
  # Owner + Committer — front-desk steward who decides what work is worth taking
  # and in what order, then signs each finished job into the record cleanly.
  - slug: markl
    schema_version: 2
    skill_repertoire:
      - five-w-two-h
      - smart-goals
      - staged-delivery
      - dora-mindset
      - risk-driven-development
      - requirements-elicitation
      - non-functional-requirements
      - moscow-prioritization
      - rice-scoring
      - user-story-writing
      - invest-stories
      - conventional-commits-spec
      - markdown
      - okt-audit-playbook
      - okt-plan-claim-playbook
      - okt-plan-continue-playbook
      - okt-plan-create-playbook
      - okt-plan-show-playbook
      - okt-run-playbook
      - okt-shape-playbook
      - okt-task-commit-playbook
      - okt-task-create-playbook
      - okt-task-decompose-playbook
      - okt-task-estimate-playbook
      - okt-task-prioritize-playbook
      - okt-task-requirements-playbook
  # Builder — small bold strokes, trunk kept green, tidies what he passes through.
  - slug: howl-pendragon
    schema_version: 2
    skill_repertoire:
      - implementation
      - test-driven-development
      - trunk-based-development
      - continuous-integration
      - solid-principles
      - code-smells
      - refactoring-catalog
      - castle-tidying
      - markdown
      - okt-task-continue-playbook
      - okt-task-design-playbook
      - okt-task-implement-playbook
      - okt-task-refactor-playbook
      - okt-task-resume-playbook
      - okt-task-self-review-playbook
  # Reviewer + Scribe — sees the true shape under the mess, says plainly what
  # needs mending, and keeps the castle's record clear. Repertoire carries all
  # four #359 note skills so the okt-note-* and okt-pause slots resolve.
  - slug: sophie-hatter
    schema_version: 2
    skill_repertoire:
      - code-smells
      - refactoring-catalog
      - security-review-lens
      - fagan-inspection
      - solid-principles
      - handoff-synthesis
      - note-capture
      - standup-digest
      - recap-timeline
      - documentation
      - architecture-mapping
      - postmortem-authoring
      - markdown
      - okt-note-free-playbook
      - okt-note-list-playbook
      - okt-note-recap-playbook
      - okt-note-show-playbook
      - okt-pause-playbook
      - okt-task-debrief-playbook
      - okt-task-document-playbook
      - okt-task-review-playbook
      - okt-task-secure-playbook

