mcp_commands:
  global:
    laws:
      - template-fidelity
      - authorize-remote-writes
  # Omakase (Naruto) slot bindings (#189 W4). Each command binds the themed
  # persona for its canonical role and selects a SUBSET of that persona's
  # skill_repertoire — the first preset to wire command-level skills (earlier
  # waves left them empty). The W1 subset validator enforces skills ⊆ repertoire.
  okt:
    persona: shikamaru-nara
    skills:
      - pdca-cycle
      - okt-start-playbook
  # Orchestrators that guide. okt-start (Concierge smart entry, shared with the
  # bare `okt` shortcut) and okt-pause (Concierge close) bind shikamaru-nara.
  # okt-shape / okt-audit are Owner orchestrators → third-hokage.
  okt-start:
    persona: shikamaru-nara
    skills:
      - pdca-cycle
      - discovery
      - okt-start-playbook
  okt-shape:
    persona: third-hokage
    skills:
      - five-w-two-h
      - smart-goals
      - okt-shape-playbook
  okt-audit:
    persona: third-hokage
    skills:
      - risk-driven-development
      - okt-audit-playbook
  # okt-run Owner director — delegates implementation to per-task Builder
  # subagents and reviews their compact returns.
  okt-run:
    persona: third-hokage
    skills:
      - staged-delivery
      - dora-mindset
      - okt-run-playbook
  okt-task-imagine:
    persona: konohamaru-class
    skills:
      - discovery
      - lean-experimentation
      - okt-task-imagine-playbook
    laws_disabled:
      - template-fidelity
    templates:
      - comment-5w2h
      - comment-smart-success
  # Granular lifecycle commands. Ideator → konohamaru-class; Owner →
  # third-hokage; Builder → naruto-uzumaki; Concierge → shikamaru-nara.
  okt-task-research:
    persona: konohamaru-class
    skills:
      - discovery
      - okt-task-research-playbook
    laws_disabled:
      - template-fidelity
  okt-task-validate:
    persona: konohamaru-class
    skills:
      - lean-experimentation
      - okt-task-validate-playbook
    laws_disabled:
      - template-fidelity
  okt-task-requirements:
    persona: third-hokage
    skills:
      - requirements-elicitation
      - non-functional-requirements
      - okt-task-requirements-playbook
  okt-task-prioritize:
    persona: third-hokage
    skills:
      - moscow-prioritization
      - rice-scoring
      - okt-task-prioritize-playbook
    templates:
      - comment-moscow
  okt-task-create:
    persona: third-hokage
    skills:
      - user-story-writing
      - invest-stories
      - smart-goals
      - okt-task-create-playbook
    laws:
