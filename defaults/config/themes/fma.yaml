# Shokunin (Fullmetal Alchemist) themed roster — personas and mcp_commands.
# Imported by shokunin.yaml via fragment selectors:
#   personas:     { from: ./modules/fma.yaml#personas }
#   mcp_commands: { from: ./modules/fma.yaml#mcp_commands }
personas:
  # Concierge + Tester — intel/router who also verifies the evidence. Repertoire
  # carries the Tester skills so the okt-task-check / okt-task-quality slots
  # resolve a real subset alongside the Concierge entry/system slots.
  - slug: maes-hughes
    schema_version: 2
    skill_repertoire:
      - pdca-cycle
      - discovery
      - architecture-mapping
      - documentation
      - staged-delivery
      - regression-detection
      - coverage-analysis
