# Shokunin (Fullmetal Alchemist) themed roster — personas and mcp_commands.
# Imported by shokunin.yaml via fragment selectors:
#   personas:     { from: ./modules/fma.yaml#personas }
#   mcp_commands: { from: ./modules/fma.yaml#mcp_commands }
personas:
  # Concierge + Tester — intel/router who also verifies the evidence. Repertoire
  # carries the Tester skills so the okt-task-check / okt-task-quality slots
  # resolve a real subset alongside the Concierge entry/system slots.
  - slug: maes-hughes
    schema_version: 2
    skill_repertoire:
      - pdca-cycle
      - discovery
      - architecture-mapping
      - documentation
      - staged-delivery
      - regression-detection
      - coverage-analysis
      - static-analysis-discipline
      - test-driven-development
      - gate-of-truth-toll
      - markdown
  # Scribe — record-keeper. Repertoire includes all four #359 note skills so the
  # okt-pause and okt-note-* slots resolve.
  - slug: alphonse-elric
    schema_version: 2
    skill_repertoire:
      - documentation
      - architecture-mapping
      - handoff-synthesis
      - note-capture
      - standup-digest
      - recap-timeline
      - postmortem-authoring
      - markdown
  # Owner — direction, prioritization, requirements, plan authoring.
  - slug: roy-mustang
    schema_version: 2
    skill_repertoire:
      - five-w-two-h
      - smart-goals
      - staged-delivery
      - dora-mindset
      - risk-driven-development
      - requirements-elicitation
      - non-functional-requirements
      - moscow-prioritization
      - rice-scoring
      - user-story-writing
      - invest-stories
      - markdown
  # Ideator — discovery and cheap experiments.
  - slug: pinako-rockbell
    schema_version: 2
    skill_repertoire:
      - discovery
      - lean-experimentation
      - five-w-two-h
      - markdown
  # Builder — small green increments, full price paid up front. Repertoire
  # carries the themed gate-of-truth-toll (strict TDD) and automail-fallback
  # (rollback) skills alongside the generic Builder pool.
  - slug: edward-elric
    schema_version: 2
    skill_repertoire:
      - implementation
      - test-driven-development
      - gate-of-truth-toll
      - automail-fallback
      - trunk-based-development
      - continuous-integration
      - solid-principles
      - code-smells
      - refactoring-catalog
      - markdown
  # Reviewer — whole-diff read, structural + security lens.
  - slug: olivier-armstrong
    schema_version: 2
    skill_repertoire:
      - code-smells
      - refactoring-catalog
      - security-review-lens
      - solid-principles
      - markdown
  # Committer — Conventional Commits, scoped history, never auto-pushes.
  - slug: riza-hawkeye
    schema_version: 2
    skill_repertoire:
      - conventional-commits-spec
      - markdown
  # Locked authority — kept in the roster, bound to the hard-gate orchestrator
  # (okt-audit) so the persona ships even when lightly used.
  - slug: king-bradley
    schema_version: 2
    skill_repertoire:
      - risk-driven-development
      - markdown

