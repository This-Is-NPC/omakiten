      - gate-of-truth-toll
      - markdown
      - okt-config-playbook
      - okt-help-playbook
      - okt-project-continue-playbook
      - okt-project-resume-playbook
      - okt-skill-playbook
      - okt-start-playbook
      - okt-task-check-playbook
      - okt-task-quality-playbook
  # Scribe — record-keeper. Repertoire includes all four #359 note skills so the
  # okt-pause and okt-note-* slots resolve.
  - slug: alphonse-elric
    schema_version: 2
    skill_repertoire:
      - documentation
      - architecture-mapping
      - handoff-synthesis
      - note-capture
      - standup-digest
      - recap-timeline
      - postmortem-authoring
      - markdown
      - okt-note-free-playbook
      - okt-note-list-playbook
      - okt-note-recap-playbook
      - okt-note-show-playbook
      - okt-pause-playbook
      - okt-task-debrief-playbook
      - okt-task-document-playbook
  # Owner — direction, prioritization, requirements, plan authoring.
  - slug: roy-mustang
    schema_version: 2
    skill_repertoire:
      - five-w-two-h
      - smart-goals
      - staged-delivery
      - dora-mindset
      - risk-driven-development
      - requirements-elicitation
      - non-functional-requirements
      - moscow-prioritization
      - rice-scoring
      - user-story-writing
      - invest-stories
      - markdown
      - okt-plan-claim-playbook
      - okt-plan-continue-playbook
      - okt-plan-create-playbook
      - okt-plan-show-playbook
      - okt-run-playbook
      - council-deliberation
      - okt-shape-playbook
      - okt-task-create-playbook
      - okt-task-decompose-playbook
      - okt-task-estimate-playbook
      - okt-task-prioritize-playbook
      - okt-task-requirements-playbook
  # Ideator — discovery and cheap experiments.
  - slug: pinako-rockbell
    schema_version: 2
    skill_repertoire:
      - discovery
      - lean-experimentation
      - five-w-two-h
      - markdown
      - okt-task-imagine-playbook
      - okt-task-research-playbook
      - okt-task-validate-playbook
  # Builder — small green increments, full price paid up front. Repertoire
  # carries the themed gate-of-truth-toll (strict TDD) and automail-fallback
  # (rollback) skills alongside the generic Builder pool.
  - slug: edward-elric
    schema_version: 2
    skill_repertoire:
      - implementation
      - test-driven-development
      - gate-of-truth-toll
      - automail-fallback
      - trunk-based-development
      - continuous-integration
      - solid-principles
      - code-smells
      - refactoring-catalog
      - markdown
      - okt-task-continue-playbook
      - okt-task-design-playbook
      - okt-task-implement-playbook
      - okt-task-refactor-playbook
      - okt-task-resume-playbook
      - okt-task-self-review-playbook
  # Reviewer — whole-diff read, structural + security lens.
  - slug: olivier-armstrong
    schema_version: 2
    skill_repertoire:
      - code-smells
      - refactoring-catalog
      - security-review-lens
      - fagan-inspection
      - solid-principles
      - markdown
      - okt-task-review-playbook
      - okt-task-secure-playbook
  # Committer — Conventional Commits, scoped history, never auto-pushes.
  - slug: riza-hawkeye
    schema_version: 2
    skill_repertoire:
      - conventional-commits-spec
      - markdown
      - okt-task-commit-playbook
  # Locked authority — kept in the roster, bound to the hard-gate orchestrator
  # (okt-audit) so the persona ships even when lightly used.
  - slug: king-bradley
    schema_version: 2
    skill_repertoire:
      - risk-driven-development
      - fagan-inspection
      - markdown
      - okt-audit-playbook

