    skills: [chronicle-handoff]
    laws: [project-scope-only, red-book-of-westmarch, no-praise-pad]
    templates: [note-handoff]
  okt-note-free:
    persona: bilbo-baggins
    skills: [note-capture]
    templates: [note-free]
  okt-note-recap:
    persona: bilbo-baggins
    skills: [recap-timeline, standup-digest]
    templates: [note-recap, note-standup-digest]
  okt-note-list:
