  cli.setup.short: "Kjør first-run setup-velgeren (språk → preset → MCP harness)"
  cli.setup.long: |-
    okt setup er post-install-velgeren curl|bash-installereren slipper deg inn i.

    Den går gjennom språkvalg (CLI / TUI / agent-output), preset-valg
    og MCP-harness-konfigurasjon i ett enkelt bubbletea-program, og skriver så
    okt() shell-rc-wrapperen. Kjør på nytt med --update for å revurdere valg.

    Headless / ikke-interaktive shells hopper over hver skjerm den matchende env var
    fyller: OKT_CLI_LANG, OKT_TUI_LANG, OKT_AGENT_LANG, OKT_PRESET, OKT_HARNESSES.
  cli.setup.flag.update: "kjør velgeren på nytt med gjeldende verdier forhåndsutfylt (idempotent mot eksisterende rc + omakiten.yaml)"
  cli.setup.flag.cli-lang: "hopp over CLI-språkvelger ved å sette valgt kode (samme form som OKT_CLI_LANG=)"
  cli.setup.flag.tui-lang: "hopp over TUI-språkvelger ved å sette valgt kode (samme form som OKT_TUI_LANG=)"
  cli.setup.flag.agent-lang: "hopp over agent-output språk-prompt ved å sette valgt fritekst-verdi"
  cli.setup.flag.preset: "hopp over preset-velger ved å sette valgt preset-navn (samme form som OKT_PRESET=)"
  cli.setup.flag.harnesses: "hopp over harness multi-select med en CSV av harness-navn (samme form som OKT_HARNESSES=)"
  cli.setup.flag.skip-wrapper: "ikke skriv okt() shell-rc-wrapper-blokken (nyttig når brukeren håndterer sine rc-filer via dotfiles)"
  cli.setup.flag.skip-harnesses: "løs harness-input men ikke kall `okt mcp setup` (brukt av shell-tester + dry-run smoke-sjekker)"
