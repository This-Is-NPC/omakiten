  cli.config.init.long: |-
    Frø en frittstående config-installasjon rotet i valgt scope.

      --scope global  →  paths.ConfigRoot() (eller --configs foreldre).
                         Eksisterende brukerinstallasjon; ny kjøring er idempotent.

      --scope local   →  <cwd>/.omakiten (bokstavelig CWD, ingen walk-up).
                         En komplett installasjon — config/<preset>.yaml pluss hver
                         entity-mappe — så runtime kan laste den uten noen
                         merge med det bruker-globale laget. Walk-up-løseren
                         plukker dette opp automatisk på påfølgende okt-kall
                         inni repoet.

    Atferdsmatrise:
      - Fil mangler            → atomisk skriving.
      - Samme preset, samme filer → no_op:true (stille suksess).
      - Annen preset           → flipper .active til den nye preset.
      - Tuklede shipped-filer  → bevart med mindre --force.
      - --force                → kopierer på nytt hver innebygd shipped-fil
                                  (skills, laws, personas, templates, themes,
                                  notifications, hver preset-yaml).
                                  custom/-undertrær berøres aldri.

    Språkvalg:
      --cli-lang, --tui-lang, --agent-lang hopper over de interaktive prompts
      for hvert surface og skriver verdien direkte inn i den frøete
      omakiten.yamls languages-blokk. --cli-lang og --tui-lang må
      matche en innebygd språkkode (en, pt-br, ...); --agent-lang er
      fritekst. Når intet flagg er gitt, prompter init på TTY (eller
      lar surfacet stå på sin default når stdin er ikke-interaktiv).
  cli.config.path.long: |-
    Gå gjennom aktiv config (eller et valgt lag) via punktert YAML-nøkkel
    og rapportér {key, value, path, source}. Uten --layer velger løseren
    den installasjon runtime ville brukt: oppdaget .omakiten/
    når den finnes, ellers den bruker-globale ConfigRoot.

    Den frittstående modellen betyr at det ikke er noen merge, så en verdi ved enhver nøkkel
    kommer fra nøyaktig én installasjon. --layer fester oppslaget til "global" eller
    "local" slik at kallere kan verifisere et spesifikt lag i stedet for det løste
    (f.eks. "er dette satt i den bruker-globale installasjonen selv om mitt repo
    overstyrer det lokalt").
  cli.config.diff.long: |-
    Sammenlign to YAML-config-kilder og send ut én oppføring per divergent
    løvnode. Hvert operand er ett av:
      global              - den bruker-globale aktive yaml
      local               - den aktive yaml inni CWD walk-up .omakiten/
      local:<path>        - den aktive yaml inni <path>/.omakiten/
      <path/to/file.yaml> - enhver yaml-fil på disk

    Utdataoppføringer bærer op = added | removed | changed pluss relevante
    sideverdier. Maps stiger ned rekursivt; lister / skalarer sammenlignes via dyp
    likhet.
  cli.config.language.long: |-
    Les og skriv config.languages.{cli,tui,agent_output} i aktiv
    omakiten.yaml. languages.cli og languages.tui valideres mot
    språkpakkene oppdaget under languages/; languages.agent_output
    er fritekst og videresendes ordrett til MCP prompt-komponisten.

    Standardmålet er den løste omakiten.yaml (repo-lokal
    .omakiten/ når den finnes, ellers den bruker-globale ConfigRoot). Bruk
    --global på set/reset for å feste skrivingen til den bruker-globale filen
    uavhengig av repo-lokal tilstedeværelse.

    Skrivinger trigger en BundleCache.Reload slik at påfølgende okt-kall og
    langtkjørende verktøy (TUI, MCP-server) observerer det nye valget. Den
    nåværende CLI-prosessen og enhver allerede kjørende CLI-kall blir ikke
    retroaktivt oppdatert; kun påfølgende kall plukker opp endringen.
  cli.config.language.set.long: |-
    Eksempler:
      okt config language set --cli pt-br
      okt config language set --tui en --agent "Português (Brasil)"
      okt config language set --agent "" --global

    Minst én av --cli, --tui eller --agent må oppgis. --cli og
    --tui valideres mot språkkodene oppdaget under languages/.
    --agent aksepterer enhver ikke-tom streng (eller "" for å tømme). --global fester
    skrivingen til den bruker-globale omakiten.yaml.
  cli.mcp.install.long: "Skriver Omakiten MCP-serverkonfigurasjonen til harness-konfigfilen (f.eks. Claude Desktop eller OpenCode)."
  cli.workflow.orphan.long: |-
    Tasks som pekte på en workflow-bucket som ikke lenger finnes etter en
    preset-bytte eller omakiten.yaml-redigering er foreldreløse. Som standard skriver denne kommandoen
    ut migrasjonsplanen (hvilke tasks som ville knytte om til hvilken bucket) og
    avslutter med ikke-null så ingenting muteres.

    Send --confirm for å anvende ombindingen. Hver migrert task sender et
    task.migrated-event med from/to/reason-payload. --dry-run tilsvarer
    å kjøre uten --confirm.
