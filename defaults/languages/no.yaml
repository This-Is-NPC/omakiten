  # okt update — in-binary counterpart of the curl|bash installer for refresh.
  cli.update.short: "Henter nyeste okt-release og bytter installert binary atomisk"
  cli.update.long: |-
    Finner stien til kjørende binary (os.Executable), spør GitHub
    releases-API om nyeste tag, laster ned matchende asset og
    erstatter binary på disk atomisk. Gjeldende prosess avsluttes
    etter swap; neste kall kjører ny versjon.
    
    --check skriver `current=<v> latest=<v> action=<noop|upgrade>` og
    avslutter med 0 uten å skrive. --yes hopper over bekreftelse for
    non-interaktive kall.
  cli.update.flag.yes: "hopp over bekreftelsesprompt og bruk upgrade non-interaktivt"
  cli.update.flag.check: "rapporter nåværende vs. nyeste og avslutt uten å skrive"
