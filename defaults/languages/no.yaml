# okt uninstall — in-binary counterpart of uninstall.sh / uninstall.ps1.
  cli.uninstall.short: "Fjerner installert okt-binary og shell-rc-wrapper (data + config bevares som standard)"
  cli.uninstall.long: |-
    Fjerner binaryet installatoren skrev til $INSTALL_DIR (standard
    ~/.local/bin på POSIX og %LOCALAPPDATA%\Programs\okt på Windows) og
    fjerner okt()-wrapperblokken fra hvert rc/profile-mål.
    
    Lokal tilstand bevares med mindre du eksplisitt opt-out via --purge-data
    (SQLite DB under $XDG_DATA_HOME/omakiten) eller --purge-config (aktiv
    yaml-profil + entity-mapper under $XDG_CONFIG_HOME/omakiten).
    --purge er shorthand for begge.
    
    Uten flagg på en TTY viser pickeren hva som ville blitt slettet med
    størrelser og spør per purge-mål. --yes hopper helt over pickeren.
    
    Ingen automatisk backup. Kjør `okt db backup` først hvis du vil ha et
    snapshot av SQLite DB før purge — avinstallering fjerner
    brukerdata med vilje; sikkerhetsnettet er opt-in via den
    standalone backup-kommandoen.
  cli.uninstall.flag.yes: "hopp over interaktiv picker og bruk oppløst flaggsett non-interaktivt"
  cli.uninstall.flag.purge-data: "sletter også $XDG_DATA_HOME/omakiten (SQLite DB + WAL/SHM) — irreversibelt"
  cli.uninstall.flag.purge-config: "sletter også $XDG_CONFIG_HOME/omakiten (aktiv yaml + entity-mapper) — irreversibelt"
  cli.uninstall.flag.purge: "shorthand for --purge-data + --purge-config — irreversibelt"
  cli.uninstall.picker.title: "Avinstaller okt"
