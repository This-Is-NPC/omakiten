  cli.root.long: |-
    okt driver Omakiten fra kommandolinjen og TUI.

    Baneoppslag (høyest til lavest prioritet):
      1. --config / --db flagg
      2. $OMAKITEN_HOME — fester config til <HOME>/config/<active>.yaml og data til <HOME>/data/omakiten.db
      3. $XDG_CONFIG_HOME / $XDG_DATA_HOME
      4. ~/.config/omakiten og ~/.local/share/omakiten
