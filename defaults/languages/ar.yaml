  cli.root.short: "نقاط تحقّق ذات رأي للتطوير المدفوع بالذكاء الاصطناعي"
  cli.root.long: |-
    okt يُشغّل Omakiten من سطر الأوامر وواجهة TUI.

    ترتيب حلّ المسارات (من الأعلى أولوية إلى الأدنى):
      1. أعلام --config / --db
      2. $OMAKITEN_HOME — يثبّت ملف الإعدادات على <HOME>/config/<active>.yaml والبيانات على <HOME>/data/omakiten.db
      3. $XDG_CONFIG_HOME / $XDG_DATA_HOME
      4. ~/.config/omakiten و ~/.local/share/omakiten
