  # okt update — in-binary counterpart of the curl|bash installer for refresh.
  cli.update.short: "يجلب أحدث release لـ okt ويستبدل الـ binary المثبت atomically"
  cli.update.long: |-
    يكشف مسار الـ binary الجاري (os.Executable)، ويستعلم GitHub
    releases API عن أحدث tag، وينزّل الـ asset المطابق، و
    يستبدل الـ binary على القرص atomically. العملية الحالية تنتهي
    بعد swap؛ الاستدعاء التالي يشغّل الإصدار الجديد.
    
    --check يطبع `current=<v> latest=<v> action=<noop|upgrade>` و
    يخرج بـ 0 دون كتابة. --yes يتخطى تأكيد غير التفاعلي.
  cli.update.flag.yes: "تخطي مطالبة التأكيد وتطبيق upgrade بشكل غير تفاعلي"
