  cli.setup.short: "تشغيل مُنتقي الإعداد الأوّل (اللغة → preset → harness MCP)"
  cli.setup.long: |-
    okt setup هو مُنتقي ما بعد التثبيت الذي يُسقطك فيه مُثبِّت curl|bash.

    يمشي عبر اختيار اللغة (CLI / TUI / agent-output)، واختيار preset،
    وتهيئة harness الخاص بـ MCP في برنامج bubbletea واحد، ثم يكتب
    غلاف okt() الخاص بـ shell-rc. أعد التشغيل بـ --update لمراجعة الخيارات.

    الأصداف الخالية من الواجهة / غير التفاعلية تتخطّى كل شاشة يملؤها
    متغيّر البيئة المطابق: OKT_CLI_LANG و OKT_TUI_LANG و OKT_AGENT_LANG و OKT_PRESET و OKT_HARNESSES.
  cli.setup.flag.update: "إعادة تشغيل المُنتقي بالقيم الحالية مُعبَّأة مسبقًا (لا يترك أثرًا جانبيًا مقابل rc الموجود + omakiten.yaml)"
  cli.setup.flag.cli-lang: "تخطّي مُنتقي لغة CLI بضبط الرمز المختار (نفس شكل OKT_CLI_LANG=)"
