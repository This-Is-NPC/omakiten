  cli.config.init.long: |-
    إنشاء تثبيت إعدادات مستقل متجذّر في scope المختار.

      --scope global  →  paths.ConfigRoot() (أو المجلد الأب لـ --config).
                         تثبيت مستخدم قائم؛ إعادة التشغيل لا تترك أثرًا جانبيًا.

      --scope local   →  <cwd>/.omakiten (CWD حرفيًا، بدون تتبّع للأعلى).
                         تثبيت كامل — config/<preset>.yaml بالإضافة إلى كل
                         مجلد كيان — حتى يستطيع وقت التشغيل تحميله دون أي
                         دمج مع طبقة user-global. يلتقطه محلّل تتبّع المسار
                         تلقائيًا في الاستدعاءات اللاحقة لـ okt من داخل
                         المستودع.

    مصفوفة السلوك:
      - الملف غير موجود        → كتابة ذرّية.
      - نفس preset، نفس الملفّات → no_op:true (نجاح صامت).
      - preset مختلف           → يُحوِّل .active إلى الـ preset الجديد.
      - ملفّات شحن مُعدَّلة     → تُحفظ ما لم يُمرَّر --force.
      - --force                → يُعيد نسخ كل ملفّ شحن مُضمَّن
                                  (skills، laws، personas، templates، themes،
                                  notifications، وكل preset yaml).
                                  مجلّدات custom/ لا تُمَسّ أبدًا.

    اختيار اللغة:
      --cli-lang و --tui-lang و --agent-lang تتخطّى المطالبات التفاعلية
      لكل سطح وتكتب القيمة مباشرة في كتلة languages داخل omakiten.yaml
      المُهيّأ. يجب أن يطابق --cli-lang و --tui-lang رمز لغة مُضمَّن
      (en، pt-br، …)؛ بينما --agent-lang حقل حر. عندما لا يُمرَّر علم،
      تطلب init الإدخال عبر TTY (أو تترك السطح على قيمته الافتراضية حين
      يكون stdin غير تفاعلي).
  cli.config.path.long: |-
    تتبّع الإعدادات النشطة (أو طبقة محدّدة) عبر مفتاح YAML منقّط
    وأعد {key, value, path, source}. بدون --layer يختار المحلّل
    التثبيت الذي سيستخدمه وقت التشغيل: .omakiten/ المكتشف
    إن وُجد، وإلّا ConfigRoot الخاص بـ user-global.

    النموذج المستقل يعني عدم وجود دمج، لذا تأتي القيمة عند أي مفتاح
    من تثبيت واحد بالضبط. --layer يثبّت البحث على "global" أو
    "local" لتمكين المستدعين من التحقّق من طبقة معيّنة بدلًا من المُحلَّلة
    (مثلًا "هل هذه القيمة مضبوطة في تثبيت user-global رغم أن مستودعي
    يتجاوزها محليًّا").
  cli.config.diff.long: |-
    مقارنة مصدري إعدادات YAML وإصدار مدخل لكل ورقة متباينة.
    كل طرف هو واحد ممّا يلي:
      global              - yaml النشط من user-global
      local               - yaml النشط داخل .omakiten/ المكتشف عبر تتبّع المسار من CWD
      local:<path>        - yaml النشط داخل <path>/.omakiten/
      <path/to/file.yaml> - أي ملف yaml على القرص

    تحمل المدخلات op = added | removed | changed إلى جانب قيم
    الجانب المعني. تنزل الخرائط تكراريًا؛ والقوائم/الموازين تُقارَن
    بالمساواة العميقة.
  cli.config.language.long: |-
    قراءة وكتابة config.languages.{cli,tui,agent_output} في omakiten.yaml
    النشط. languages.cli و languages.tui يُتحقَّق منهما مقابل حِزم
    اللغات المكتشفة تحت languages/؛ بينما languages.agent_output حقل
    حر يُمرَّر حرفيًّا إلى مُركِّب موجّهات MCP.

    الهدف الافتراضي هو omakiten.yaml المُحلَّل (.omakiten/ المحلي للمستودع
    إن وُجد، وإلّا ConfigRoot الخاص بـ user-global). استخدم --global على
    set/reset لتثبيت الكتابة على ملف user-global بصرف النظر عن وجود
    repo-local.

    تُحفّز عمليات الكتابة BundleCache.Reload بحيث ترصد الاستدعاءات
    اللاحقة لـ okt والأدوات طويلة العمر (TUI، خادم MCP) الاختيار
    الجديد. عملية CLI الحالية وأي استدعاء CLI يعمل بالفعل لا
    يُحدَّثان بأثر رجعي؛ فقط الاستدعاءات اللاحقة تلتقط التغيير.
  cli.config.language.set.long: |-
    أمثلة:
      okt config language set --cli pt-br
      okt config language set --tui en --agent "Português (Brasil)"
      okt config language set --agent "" --global

    يجب توفير واحد على الأقل من --cli أو --tui أو --agent. يُتحقَّق
    من --cli و --tui مقابل رموز اللغات المكتشفة تحت languages/.
    --agent يقبل أي نص غير فارغ (أو "" لإفراغه). --global يثبّت
    الكتابة على omakiten.yaml الخاص بـ user-global.
  cli.mcp.install.long: "يكتب إعدادات خادم MCP الخاص بـ Omakiten إلى ملف إعدادات harness (مثل Claude Desktop أو OpenCode)."
  cli.workflow.orphan.long: |-
    tasks التي كانت تشير إلى bucket في workflow لم يعد موجودًا بعد
    تبديل preset أو تعديل omakiten.yaml تُعدّ أيتامًا. افتراضيًّا
    يطبع هذا الأمر خطّة الترحيل (أيّ tasks ستُعاد ربطها بأيّ bucket)
    ويخرج بحالة غير صفرية حتى لا يُعدَّل شيء.

    مرّر --confirm لتطبيق إعادة الربط. كل task مُرحَّلة تُصدر حدث
    task.migrated بحمولة from/to/reason. --dry-run مكافئ للتشغيل
    دون --confirm.
