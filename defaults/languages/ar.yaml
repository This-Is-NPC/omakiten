# okt uninstall — in-binary counterpart of uninstall.sh / uninstall.ps1.
  cli.uninstall.short: "يزيل binary okt المثبت و shell-rc wrapper (البيانات + config محفوظة افتراضياً)"
  cli.uninstall.long: |-
    يزيل الـ binary الذي كتبه المثبت في $INSTALL_DIR (افتراضياً
    ~/.local/bin على POSIX و %LOCALAPPDATA%\Programs\okt على Windows) و
    يزيل كتلة wrapper okt() من كل هدف rc/profile.
    
    الحالة المحلية تُحفظ ما لم يكن opt-out صريحاً via --purge-data
    (SQLite DB تحت $XDG_DATA_HOME/omakiten) أو --purge-config (ملف yaml
    النشط + مجلدات entity تحت $XDG_CONFIG_HOME/omakiten).
    --purge اختصار لكليهما.
    
    بدون flags على TTY يعرض الـ picker ما سيُحذف مع
    الأحجام ويسأل لكل هدف purge. --yes يتخطى الـ picker بالكامل.
    
    لا backup تلقائي. شغّل `okt db backup` أولاً إن أردت
    snapshot لـ SQLite DB قبل purge — إزالة التثبيت تحذف
    بيانات المستخدم عن قصد؛ شبكة الأمان opt-in via
    أمر backup standalone.
  cli.uninstall.flag.yes: "تخطي الـ picker التفاعلي وتطبيق مجموعة flags المحلولة بشكل غير تفاعلي"
  cli.uninstall.flag.purge-data: "يحذف أيضاً $XDG_DATA_HOME/omakiten (SQLite DB + WAL/SHM) — لا رجعة"
