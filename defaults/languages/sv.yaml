  cli.root.short: "Tydliga checkpoints för AI-driven utveckling"
  cli.root.long: |-
    okt styr Omakiten från kommandoraden och TUI.

    Sökvägsupplösning (högst till lägst prioritet):
      1. --config / --db flaggor
      2. $OMAKITEN_HOME — låser config till <HOME>/config/<active>.yaml och data till <HOME>/data/omakiten.db
      3. $XDG_CONFIG_HOME / $XDG_DATA_HOME
      4. ~/.config/omakiten och ~/.local/share/omakiten
  cli.root.flag.db: "Sökväg till SQLite-databas (åsidosätter $OMAKITEN_HOME och XDG)"
  cli.root.flag.config: "Sökväg till omakiten.yaml (åsidosätter $OMAKITEN_HOME och XDG)"
