  cli.setup.short: "Kör first-run setup-väljaren (språk → preset → MCP-harness)"
  cli.setup.long: |-
    okt setup är post-install-väljaren som curl|bash-installern släpper dig i.

    Den går igenom språkval (CLI / TUI / agent-output), preset-val,
    och MCP-harness-konfiguration i ett enda bubbletea-program, och skriver sedan
    okt() shell-rc-wrappern. Kör om med --update för att besöka valen igen.

    Headless / icke-interaktiva shells hoppar över varje skärm vars matchande env var
    är ifylld: OKT_CLI_LANG, OKT_TUI_LANG, OKT_AGENT_LANG, OKT_PRESET, OKT_HARNESSES.
  cli.setup.flag.update: "kör om väljaren med aktuella värden förifyllda (idempotent mot befintlig rc + omakiten.yaml)"
  cli.setup.flag.cli-lang: "hoppa över CLI-språk-väljaren genom att sätta vald kod (samma form som OKT_CLI_LANG=)"
  cli.setup.flag.tui-lang: "hoppa över TUI-språk-väljaren genom att sätta vald kod (samma form som OKT_TUI_LANG=)"
  cli.setup.flag.agent-lang: "hoppa över agent-output-språkprompten genom att sätta valt fritt värde"
  cli.setup.flag.preset: "hoppa över preset-väljaren genom att sätta valt preset-namn (samma form som OKT_PRESET=)"
  cli.setup.flag.harnesses: "hoppa över harness-multivalet med en CSV av harness-namn (samma form som OKT_HARNESSES=)"
  cli.setup.flag.skip-wrapper: "skriv inte okt() shell-rc-wrapper-blocket (användbart när användaren hanterar sina rc-filer via dotfiles)"
  cli.setup.flag.skip-harnesses: "lös harness-input men anropa inte `okt mcp setup` (används av shell-tester + dry-run smoke-checks)"
