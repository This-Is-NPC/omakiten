  cli.setup.short: "Kör first-run setup-väljaren (språk → preset → MCP-harness)"
  cli.setup.long: |-
    okt setup är post-install-väljaren som curl|bash-installern släpper dig i.

    Den går igenom språkval (CLI / TUI / agent-output), preset-val,
    och MCP-harness-konfiguration i ett enda bubbletea-program, och skriver sedan
    okt() shell-rc-wrappern. Kör om med --update för att besöka valen igen.

    Headless / icke-interaktiva shells hoppar över varje skärm vars matchande env var
    är ifylld: OKT_CLI_LANG, OKT_TUI_LANG, OKT_AGENT_LANG, OKT_PRESET, OKT_HARNESSES.
  cli.setup.flag.update: "kör om väljaren med aktuella värden förifyllda (idempotent mot befintlig rc + omakiten.yaml)"
