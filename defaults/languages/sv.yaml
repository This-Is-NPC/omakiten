  cli.config.init.long: |-
    Skapa en fristående config-installation rotad i valt scope.

      --scope global  →  paths.ConfigRoot() (eller --configs förälder).
                         Befintlig user install; omkörning är idempotent.

      --scope local   →  <cwd>/.omakiten (bokstavlig CWD, ingen walk-up).
                         En komplett installation — config/<preset>.yaml plus varje
                         entity-mapp — så att runtime kan ladda den utan
                         merge med det user-globala lagret. Walk-up-resolvern
                         plockar upp detta automatiskt vid efterföljande okt-anrop
                         inifrån repot.

    Beteendematris:
      - Fil saknas              → atomisk skrivning.
      - Samma preset, samma filer → no_op:true (tyst framgång).
      - Annan preset            → vänder .active till den nya preseten.
      - Modifierade shipped-filer → bevaras om inte --force.
      - --force                 → kopierar om varje inbäddad shipped-fil
                                  (skills, laws, personas, templates, themes,
                                  notifications, varje preset yaml).
                                  custom/-undermappar rörs aldrig.

    Språkval:
      --cli-lang, --tui-lang, --agent-lang hoppar över interaktiva prompts
      för varje surface och skriver värdet direkt i den seedade
      omakiten.yamls languages-block. --cli-lang och --tui-lang måste
      matcha en buntad språkkod (en, pt-br, ...); --agent-lang är
      fri form. Utan flagga frågar init på TTY (eller
      lämnar surface på dess standard när stdin är icke-interaktiv).
  cli.config.path.long: |-
    Gå igenom aktiv config (eller ett valt lager) per punktad YAML-nyckel
    och rapportera {key, value, path, source}. Utan --layer väljer resolvern
    den installation runtime skulle använda: upptäckt .omakiten/
    om den finns, annars den user-globala ConfigRoot.

    Den fristående modellen innebär ingen merge, så ett värde vid en nyckel
    kommer från exakt en installation. --layer låser lookup till "global" eller
    "local" så anropare kan verifiera ett specifikt lager istället för det upplösta
    (t.ex. "är detta satt i user-global trots att repot
    åsidosätter det lokalt").
  cli.config.diff.long: |-
    Jämför två YAML-config-källor och emittera en post per divergerande
    blad. Varje operand är en av:
      global              - den user-globala aktiva yaml
      local               - aktiv yaml inom CWD walk-up .omakiten/
      local:<path>        - aktiv yaml inom <path>/.omakiten/
      <path/to/file.yaml> - vilken yaml-fil som helst på disk

    Outputposter bär op = added | removed | changed plus relevanta
    sidvärden. Maps stiger ner rekursivt; listor / skalärer jämförs via djup
    likhet.
  cli.config.language.long: |-
    Läs och skriv config.languages.{cli,tui,agent_output} i aktiv
    omakiten.yaml. languages.cli och languages.tui valideras mot
    language packs som upptäcks under languages/; languages.agent_output
    är fri form och vidarebefordras ordagrant till MCP-prompt-komponenten.

    Standardmålet är den upplösta omakiten.yaml (repo-lokal
    .omakiten/ om den finns, annars user-global ConfigRoot). Använd
    --global på set/reset för att låsa skrivningen till user-globala filen
    oavsett repo-lokal närvaro.

    Skrivningar triggar BundleCache.Reload så efterföljande okt-anrop och
    långkörande verktyg (TUI, MCP-server) observerar det nya valet.
    Den aktuella CLI-processen och pågående CLI-anrop uppdateras inte
    retroaktivt; bara efterföljande anrop plockar upp ändringen.
  cli.config.language.set.long: |-
    Exempel:
      okt config language set --cli pt-br
      okt config language set --tui en --agent "Português (Brasil)"
      okt config language set --agent "" --global

    Minst en av --cli, --tui eller --agent måste anges. --cli och
    --tui valideras mot språkkoder som upptäcks under languages/.
    --agent accepterar valfri icke-tom sträng (eller "" för att rensa). --global låser
    skrivningen till user-globala omakiten.yaml.
  cli.mcp.install.long: "Skriver Omakiten MCP-server-konfigurationen till harness-config-filen (t.ex. Claude Desktop eller OpenCode)."
  cli.workflow.orphan.long: |-
    Tasks som pekade på en workflow-bucket som inte längre finns efter en
    preset-växling eller omakiten.yaml-redigering är orphans. Som standard skriver detta kommando
    ut migrationsplanen (vilka tasks som skulle bindas om till vilken bucket) och
    avslutar non-zero så inget muteras.

    Skicka --confirm för att applicera rebinden. Varje migrerad task emitterar ett
    task.migrated-event med from/to/reason-payload. --dry-run motsvarar
    att köra utan --confirm.
