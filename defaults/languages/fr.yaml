  cli.root.short: "Checkpoints opinionnés pour le développement piloté par IA"
  cli.root.long: |-
    okt pilote Omakiten depuis la ligne de commande et la TUI.

    Résolution des chemins (du plus prioritaire au moins prioritaire) :
      1. flags --config / --db
      2. $OMAKITEN_HOME — fixe config sur <HOME>/config/<active>.yaml et données sur <HOME>/data/omakiten.db
      3. $XDG_CONFIG_HOME / $XDG_DATA_HOME
      4. ~/.config/omakiten et ~/.local/share/omakiten
  cli.root.flag.db: "chemin de la base SQLite (écrase $OMAKITEN_HOME et XDG)"
