  cli.config.init.long: |-
    Crée une install de config standalone enracinée dans le scope choisi.

      --scope global  →  paths.ConfigRoot() (ou le parent de --config).
                         Install utilisateur existante ; ré-exécution idempotente.

      --scope local   →  <cwd>/.omakiten (CWD littéral, sans walk-up).
                         Install complète — config/<preset>.yaml plus chaque
                         dossier d'entité — pour que le runtime puisse charger
                         sans merge avec la couche user-global. Le resolver
                         walk-up le détecte automatiquement lors des appels
                         okt suivants depuis le repo.

    Matrice de comportement :
      - Fichier absent          → écriture atomique.
      - Même preset, mêmes fichiers → no_op:true (succès silencieux).
      - Preset différent        → bascule .active vers le nouveau preset.
      - Fichiers shipped altérés → préservés sauf --force.
      - --force                 → re-copie chaque fichier shipped embarqué
                                  (skills, laws, personas, templates, themes,
                                  notifications, chaque preset yaml).
                                  Les sous-arbres custom/ ne sont jamais touchés.

    Sélection de langue :
      --cli-lang, --tui-lang, --agent-lang sautent les prompts interactifs
      de chaque surface et écrivent la valeur directement dans le bloc
      languages du omakiten.yaml seedé. --cli-lang et --tui-lang doivent
      correspondre à un code de langue bundled (en, pt-br, es, fr, ...) ;
      --agent-lang est libre. Sans flag, init demande sur le TTY (ou laisse
      la surface à sa valeur par défaut quand stdin est non-interactif).
  cli.config.path.long: |-
    Parcourt la config active (ou une couche choisie) par clé YAML pointée
    et rapporte {key, value, path, source}. Sans --layer, le resolver
    choisit l'install que le runtime utiliserait : le .omakiten/ découvert
    quand présent, sinon le ConfigRoot user-global.

    Le modèle standalone implique qu'il n'y a pas de merge, donc une valeur
    pour une clé vient d'exactement une install. --layer fixe la recherche
    sur "global" ou "local" pour que les callers vérifient une couche
    spécifique plutôt que celle résolue (ex. "est-ce défini dans l'install
    user-global même si mon repo l'écrase localement").
  cli.config.diff.long: |-
    Compare deux sources YAML de config et émet une entrée par feuille
    divergente. Chaque opérande est l'un de :
      global              - le yaml actif user-global
      local               - le yaml actif dans le walk-up .omakiten/ depuis CWD
      local:<path>        - le yaml actif dans <path>/.omakiten/
      <path/to/file.yaml> - n'importe quel fichier yaml sur disque

    Les entrées portent op = added | removed | changed plus les valeurs
    pertinentes. Les maps descendent récursivement ; les listes / scalaires
    comparent par égalité profonde.
  cli.config.language.long: |-
    Lit et écrit config.languages.{cli,tui,agent_output} dans le omakiten.yaml
    actif. languages.cli et languages.tui sont validés contre les language
    packs découverts sous languages/ ; languages.agent_output est libre et
    transmis verbatim au compositeur de prompts MCP.

    La cible par défaut est le omakiten.yaml résolu (.omakiten/ repo-local
    quand présent, sinon le ConfigRoot user-global). Utilisez --global sur
    set/reset pour fixer l'écriture sur le fichier user-global
    indépendamment de la présence repo-local.

    Les écritures déclenchent BundleCache.Reload pour que les appels okt
    suivants et les tools longue durée (TUI, serveur MCP) observent la
    nouvelle sélection. Le process CLI courant et toute invocation CLI
    déjà en cours ne sont pas mis à jour rétroactivement ; seules les
    invocations suivantes prennent le changement en compte.
  cli.config.language.set.long: |-
    Exemples :
      okt config language set --cli fr
      okt config language set --tui en --agent "Français (France)"
      okt config language set --agent "" --global

    Au moins l'une de --cli, --tui ou --agent doit être fournie. --cli et
    --tui valident contre les codes de langue découverts sous languages/.
    --agent accepte toute chaîne non vide (ou "" pour effacer). --global
    fixe l'écriture sur le omakiten.yaml user-global.
  cli.mcp.install.long: "Écrit la configuration du serveur MCP d'Omakiten dans le fichier de config du harness (ex. Claude Desktop ou OpenCode)."
  cli.workflow.orphan.long: |-
    Les tasks qui pointaient sur un bucket de workflow qui n'existe plus
    après un changement de preset ou une édition de omakiten.yaml sont
    orphelines. Par défaut cette commande imprime le plan de migration
    (quelles tasks seraient re-liées à quels buckets) et sort en non-zéro
    sans rien muter.

    Passer --confirm pour appliquer le re-lien. Chaque task migrée émet
    un événement task.migrated avec payload from/to/reason. --dry-run
    équivaut à exécuter sans --confirm.
