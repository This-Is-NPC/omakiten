  cli.setup.short: "Lance le sélecteur initial post-installation (langue → preset → harness MCP)"
  cli.setup.long: |-
    okt setup est le sélecteur post-installation appelé par l'installateur
    curl|bash.

    Il enchaîne la sélection de langue (CLI / TUI / sortie de l'agent), la
    sélection de preset et la configuration de harness MCP dans un unique
    programme bubbletea, puis écrit le wrapper okt() dans le rc du shell.
    Utiliser --update pour revisiter les choix.

    Les shells non interactifs sautent chaque écran dont la variable
    d'environnement correspondante est définie : OKT_CLI_LANG, OKT_TUI_LANG,
    OKT_AGENT_LANG, OKT_PRESET, OKT_HARNESSES.
  cli.setup.flag.update: "ré-exécute le sélecteur avec les valeurs actuelles préremplies (idempotent sur rc + omakiten.yaml existants)"
  cli.setup.flag.cli-lang: "saute le sélecteur de langue CLI en définissant le code choisi (même forme que OKT_CLI_LANG=)"
  cli.setup.flag.tui-lang: "saute le sélecteur de langue TUI en définissant le code choisi (même forme que OKT_TUI_LANG=)"
  cli.setup.flag.agent-lang: "saute le prompt de langue de sortie de l'agent en définissant la valeur libre choisie"
  cli.setup.flag.preset: "saute le sélecteur de preset en définissant le nom de preset choisi (même forme que OKT_PRESET=)"
  cli.setup.flag.harnesses: "saute la multi-sélection de harness avec un CSV de noms de harness (même forme que OKT_HARNESSES=)"
  cli.setup.flag.skip-wrapper: "n'écrit pas le bloc wrapper okt() dans le rc du shell (utile quand l'utilisateur gère ses rc via dotfiles)"
  cli.setup.flag.skip-harnesses: "résout les entrées de harness mais n'invoque pas `okt mcp setup` (utilisé par les tests shell + smoke dry-run)"
  cli.setup.status.preset_written: "=> Preset de workflow actif : %s (%s/.active)"
