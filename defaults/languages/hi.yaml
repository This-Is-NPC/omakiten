  cli.setup.short: "पहली-बार सेटअप पिकर चलाएँ (भाषा → preset → MCP harness)"
  cli.setup.long: |-
    okt setup पोस्ट-इंस्टॉल पिकर है जिसमें curl|bash इंस्टॉलर तुम्हें छोड़ता है।

    यह भाषा चयन (CLI / TUI / agent-output), preset चयन, और MCP-harness
    कॉन्फ़िगरेशन को एक ही bubbletea प्रोग्राम में चलता है, फिर okt() shell-rc
    रैपर लिखता है। चयन पुनः देखने के लिए --update के साथ पुनः-रन करें।

