  cli.task.assign.long: "tasks.assigned_to को दिए गए WHO पर सेट करता है और task.assigned जारी करता है। कॉलम साफ करने और task.unassigned जारी करने के लिए खाली WHO दें (या छोड़ दें) — task के लिए रिकवरी पथ जिसका claim करने वाला agent पूरा किए बिना crash हो गया। dev से बाहर मैनुअल move भी स्वचालित रूप से assigned_to को साफ करते हैं।"
