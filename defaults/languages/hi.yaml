keys:
  cli.root.short: "AI-संचालित विकास के लिए ओपिनियनेटेड चेकपॉइंट"
  cli.root.long: |-
    okt कमांड लाइन और TUI से Omakiten को चलाता है।

    पथ रिज़ॉल्यूशन (उच्चतम से निम्नतम प्राथमिकता):
      1. --config / --db फ़्लैग
      2. $OMAKITEN_HOME — config को <HOME>/config/<active>.yaml पर और data को <HOME>/data/omakiten.db पर पिन करता है
      3. $XDG_CONFIG_HOME / $XDG_DATA_HOME
      4. ~/.config/omakiten और ~/.local/share/omakiten
  cli.root.flag.db: "SQLite डेटाबेस पथ ($OMAKITEN_HOME और XDG को ओवरराइड करता है)"
  cli.root.flag.config: "omakiten.yaml पथ ($OMAKITEN_HOME और XDG को ओवरराइड करता है)"
  cli.root.flag.project: "project slug"
  cli.root.flag.project-id: "project id"
