  cli.workflow.orphan.short: "ऐसे task का पूर्वावलोकन या रीबाइंड करें जिनका bucket workflow स्वैप से निष्क्रिय हो गया हो"
  cli.config.init.long: |-
    चुने गए scope में रूट किया गया एक स्टैंडअलोन config इंस्टॉल सीड करें।

      --scope global  →  paths.ConfigRoot() (या --config का पैरेंट)।
                         मौजूदा user इंस्टॉल; पुनः-रन idempotent है।

      --scope local   →  <cwd>/.omakiten (शाब्दिक CWD, कोई वॉक-अप नहीं)।
                         एक पूर्ण इंस्टॉल — config/<preset>.yaml साथ ही हर
                         इकाई फ़ोल्डर — ताकि रनटाइम इसे user-global लेयर के साथ
                         किसी भी मर्ज के बिना लोड कर सके। वॉक-अप रिज़ॉल्वर
                         इसे रिपो के अंदर से बाद के okt कॉल पर स्वचालित रूप से
                         उठा लेता है।

    व्यवहार मैट्रिक्स:
      - फ़ाइल अनुपस्थित           → परमाणु लेखन।
      - समान preset, समान फ़ाइलें → no_op:true (मौन सफलता)।
      - भिन्न preset            → .active को नए preset पर बदलता है।
      - छेड़छाड़ की गई शिप्ड फ़ाइलें → --force के बिना संरक्षित।
      - --force                 → प्रत्येक एम्बेडेड शिप्ड फ़ाइल को
                                  पुनः-कॉपी करता है (skills, laws, personas,
                                  templates, themes, notifications, हर
                                  preset yaml)। custom/ सबट्री कभी नहीं छुए जाते।

    भाषा चयन:
      --cli-lang, --tui-lang, --agent-lang प्रत्येक surface के लिए
      इंटरैक्टिव प्रॉम्प्ट छोड़ देते हैं और मान को सीड किए गए
      omakiten.yaml के languages ब्लॉक में सीधे लिख देते हैं। --cli-lang
      और --tui-lang एक बंडल की गई भाषा कोड (en, pt-br, ...) से मेल खाने
      चाहिए; --agent-lang मुक्त-रूप है। जब कोई flag नहीं दिया जाता, init
      TTY पर पूछता है (या stdin गैर-इंटरैक्टिव होने पर surface को उसके
      डिफ़ॉल्ट पर छोड़ देता है)।
  cli.config.path.long: |-
    सक्रिय config (या चुनी गई लेयर) को डॉटेड YAML key द्वारा वॉक करें
    और {key, value, path, source} रिपोर्ट करें। --layer के बिना रिज़ॉल्वर
    वह इंस्टॉल चुनता है जिसे रनटाइम उपयोग करेगा: मौजूद होने पर खोजा गया
    .omakiten/, अन्यथा user-global ConfigRoot।

    स्टैंडअलोन मॉडल का मतलब है कि कोई मर्ज नहीं है, इसलिए किसी भी key पर
    मान बिल्कुल एक इंस्टॉल से आता है। --layer लुकअप को "global" या "local"
    पर पिन करता है ताकि कॉलर रिज़ॉल्व की गई के बजाय एक विशिष्ट लेयर को
    सत्यापित कर सकें (जैसे "क्या यह user-global इंस्टॉल में सेट है भले ही
    मेरा रिपो इसे स्थानीय रूप से ओवरराइड करता हो")।
  cli.config.diff.long: |-
    दो YAML config स्रोतों की तुलना करें और प्रत्येक भिन्न पत्ती के लिए
    एक प्रविष्टि उत्सर्जित करें। प्रत्येक ऑपरेंड इनमें से एक है:
      global              - user-global सक्रिय yaml
      local               - CWD वॉक-अप .omakiten/ के अंदर सक्रिय yaml
      local:<path>        - <path>/.omakiten/ के अंदर सक्रिय yaml
      <path/to/file.yaml> - डिस्क पर कोई भी yaml फ़ाइल

    आउटपुट प्रविष्टियाँ op = added | removed | changed साथ ही प्रासंगिक
    side मान ले जाती हैं। मैप पुनरावर्ती रूप से उतरते हैं; सूची / स्केलर
    गहरी समानता द्वारा तुलना करते हैं।
  cli.config.language.long: |-
    सक्रिय omakiten.yaml में config.languages.{cli,tui,agent_output}
    पढ़ें और लिखें। languages.cli और languages.tui को languages/ के तहत
    खोजे गए भाषा पैक के विरुद्ध मान्य किया जाता है; languages.agent_output
    मुक्त-रूप है और MCP prompt कंपोज़र को शब्दशः अग्रेषित किया जाता है।

    डिफ़ॉल्ट लक्ष्य रिज़ॉल्व किया गया omakiten.yaml है (मौजूद होने पर
    repo-local .omakiten/, अन्यथा user-global ConfigRoot)। set/reset पर
    --global का उपयोग करें ताकि repo-local उपस्थिति की परवाह किए बिना
    लेखन को user-global फ़ाइल पर पिन किया जा सके।

    लेखन एक BundleCache.Reload ट्रिगर करते हैं ताकि बाद के okt आह्वान और
    लंबे समय तक चलने वाले उपकरण (TUI, MCP सर्वर) नया चयन देखें। वर्तमान
    CLI प्रक्रिया और कोई भी पहले से चल रहा CLI आह्वान पूर्वव्यापी रूप से
    अपडेट नहीं होता है; केवल बाद के आह्वान परिवर्तन उठाते हैं।
  cli.config.language.set.long: |-
    उदाहरण:
      okt config language set --cli pt-br
      okt config language set --tui en --agent "Português (Brasil)"
      okt config language set --agent "" --global

    --cli, --tui, या --agent में से कम से कम एक प्रदान किया जाना चाहिए।
    --cli और --tui languages/ के तहत खोजे गए भाषा कोड के विरुद्ध मान्य
    होते हैं। --agent कोई भी गैर-रिक्त स्ट्रिंग स्वीकार करता है (या साफ़
    करने के लिए "")। --global लेखन को user-global omakiten.yaml पर पिन
    करता है।
  cli.mcp.install.long: "harness config फ़ाइल (जैसे Claude Desktop या OpenCode) में Omakiten MCP सर्वर कॉन्फ़िगरेशन लिखता है।"
  cli.workflow.orphan.long: |-
    ऐसे task जो preset स्विच या omakiten.yaml संपादन के बाद अब मौजूद नहीं
    रहने वाले workflow bucket की ओर इशारा करते थे, अनाथ हैं। डिफ़ॉल्ट रूप
    से यह कमांड माइग्रेशन योजना प्रिंट करता है (कौन से task किस bucket पर
    रीबाइंड होंगे) और गैर-शून्य से बाहर निकलता है ताकि कुछ भी न बदले।

    रीबाइंड लागू करने के लिए --confirm पास करें। प्रत्येक माइग्रेट किया
    गया task from/to/reason payload के साथ एक task.migrated इवेंट
    उत्सर्जित करता है। --dry-run --confirm के बिना चलाने के समतुल्य है।
