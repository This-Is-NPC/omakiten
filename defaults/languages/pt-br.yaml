  cli.config.init.long: "Instalar um workflow pelo nome do catálogo, URL Git ou diretório local no escopo selecionado.\n\nAs preferências de idioma valem para todos os projetos e ficam no preferences.yaml do Omakiten. CLI e TUI usam idiomas incluídos no programa; agent_output é texto livre."
  cli.config.path.long: |-
    Percorre a config ativa (ou uma camada escolhida) por chave YAML
    pontilhada e reporta {key, value, path, source}. Imports são expandidos.
    Sem --layer, --config seleciona um arquivo explícito; a descoberta
    começa na raiz do projeto selecionado ou no CWD e usa o .omakiten/
    encontrado, senão o ConfigRoot user-global.

    O modelo standalone significa que não há merge — um valor em
    qualquer chave vem de exatamente um install. --layer prende a busca
    em "global" ou "local" para o caller verificar uma camada específica
    em vez da resolvida (por exemplo "isso está setado no install
    user-global mesmo que meu repo sobrescreva localmente").
  cli.config.diff.long: |-
    Expande imports de duas fontes YAML de config e emite uma entrada
    por folha divergente. Cada operando é um dos:
      global              - o yaml ativo user-global
      local               - o yaml ativo no walk-up do projeto/CWD em .omakiten/
      local:<path>        - o yaml ativo dentro de <path>/.omakiten/
      <path/to/file.yaml> - qualquer arquivo yaml no disco

    Cada entrada de saída carrega op = added | removed | changed mais os
    valores relevantes. Maps descem recursivamente; listas / escalares
    comparam por igualdade profunda.
  cli.config.language.long: "As preferências de idioma valem para todos os projetos e ficam no preferences.yaml do Omakiten. CLI e TUI usam idiomas incluídos no programa; agent_output é texto livre."
  cli.config.language.set.long: "As preferências de idioma valem para todos os projetos e ficam no preferences.yaml do Omakiten. CLI e TUI usam idiomas incluídos no programa; agent_output é texto livre.\n\nokt config language set --cli pt-br\nokt config language set --tui en --agent \"Português (Brasil)\"\nokt config language set --agent \"\""
  cli.workflow.orphan.long: |-
    Tasks que apontavam para um bucket de workflow que não existe mais
    depois de uma troca de preset ou edição de omakiten.yaml são órfãs.
    Por padrão este comando imprime o plano de migração (quais tasks
    re-vinculariam a quais buckets) e sai com código não-zero sem
    mutar nada.

    Passe --confirm para aplicar o re-vínculo. Cada task migrada emite
    um evento task.migrated com payload from/to/reason. --dry-run é
    equivalente a rodar sem --confirm.
