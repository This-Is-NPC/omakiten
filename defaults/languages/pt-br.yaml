# okt uninstall — in-binary counterpart of uninstall.sh / uninstall.ps1.
  cli.uninstall.short: "Remove o binário okt instalado e o wrapper shell-rc (dados + config preservados por padrão)"
  cli.uninstall.long: |-
    Remove o binário que o instalador gravou em $INSTALL_DIR (padrão
    ~/.local/bin no POSIX e %LOCALAPPDATA%\Programs\okt no Windows) e
    retira o bloco wrapper okt() de cada alvo rc/profile.
    
    O estado local é preservado salvo opt-out explícito via --purge-data
    (SQLite DB em $XDG_DATA_HOME/omakiten) ou --purge-config (perfil yaml
    ativo + pastas de entidades em $XDG_CONFIG_HOME/omakiten).
    --purge é atalho para ambos.
    
    Sem flags em um TTY o seletor mostra o que seria excluído com
    tamanhos e pergunta por alvo de purge. --yes pula o seletor por completo.
    
    Sem backup automático. Rode `okt db backup` antes se quiser um
    snapshot do SQLite DB antes do purge — a desinstalação remove
    dados do usuário de propósito; a rede de segurança é opt-in via o
    comando de backup standalone.
  cli.uninstall.flag.yes: "pula o seletor interativo e aplica o conjunto de flags resolvido de forma não interativa"
  cli.uninstall.flag.purge-data: "também exclui $XDG_DATA_HOME/omakiten (SQLite DB + WAL/SHM) — irreversível"
  cli.uninstall.flag.purge-config: "também exclui $XDG_CONFIG_HOME/omakiten (yaml ativo + pastas de entidades) — irreversível"
  cli.uninstall.flag.purge: "atalho para --purge-data + --purge-config — irreversível"
