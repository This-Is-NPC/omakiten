  cli.setup.short: "Roda o seletor inicial pós-instalação (idioma → preset → harness CLI)"
  cli.setup.long: |-
    okt setup é o seletor pós-instalação chamado pelo instalador curl|bash.

    Ele passa pela seleção de idioma (CLI / TUI / saída do agente), seleção
    de preset e configuração de harness CLI em um único programa bubbletea,
    e então grava o wrapper okt() no rc do shell. Use --update para revisitar.

    Shells não interativos pulam cada tela cuja variável de ambiente está
    definida: OKT_CLI_LANG, OKT_TUI_LANG, OKT_AGENT_LANG, OKT_PRESET, OKT_HARNESSES.
  cli.setup.flag.update: "re-executa o seletor com os valores atuais como padrão (idempotente sobre rc + omakiten.yaml existentes)"
