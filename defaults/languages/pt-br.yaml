  cli.projects.delete.err.no_tty: "confirmação interativa necessária; passe --yes para pular"
  cli.projects.delete.err.aborted: "delete abortado; nada removido"
  cli.db.short: "Utilitários do ciclo de vida do banco (backup, snapshot, restore — ops de sysadmin)"
  cli.db.backup.short: "Gravar snapshot do banco SQLite ativo no diretório de backups rotativos"
  cli.db.backup.long: |-
    Copia o banco SQLite ativo para um snapshot com timestamp em
    $XDG_STATE_HOME/omakiten/backups/ (padrão ~/.local/state/omakiten/backups/)
    e faz prune de snapshots antigos conforme settings.backup.retention_count.
    
    A cópia é atômica: o destino só aparece depois que o conteúdo
    foi escrito e renomeado. Uma cópia parcial anterior nunca
    sobrevive a uma falha.
    
    --out fixa o caminho do snapshot explicitamente (diretórios pai
    criados se necessário). Com --out o retention prune é
    ignorado — a rotação fica fora do diretório state padrão.
  cli.db.backup.flag.out: "gravar snapshot neste caminho explícito (ignora retention prune)"
  cli.db.backup.flag.force: "sobrescrever o arquivo alvo quando --out aponta para um caminho existente"
