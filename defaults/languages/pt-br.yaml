  cli.root.short: "Checkpoints opinativos para desenvolvimento guiado por IA"
  cli.root.long: |-
    okt opera o Omakiten pelo terminal e pela TUI.

    Resolução de caminhos (precedência decrescente):
      1. flags --config / --db
      2. $OMAKITEN_HOME — fixa config em <HOME>/config/<active>.yaml e dados em <HOME>/data/omakiten.db
      3. $XDG_CONFIG_HOME / $XDG_DATA_HOME
      4. ~/.config/omakiten e ~/.local/share/omakiten
  cli.root.flag.db: "caminho do banco SQLite (sobrescreve $OMAKITEN_HOME e XDG)"
  cli.root.flag.config: "caminho do omakiten.yaml (sobrescreve $OMAKITEN_HOME e XDG)"
