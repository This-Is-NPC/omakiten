  cli.setup.short: "Roda o seletor inicial pós-instalação (idioma → preset → harness MCP)"
  cli.setup.long: |-
    okt setup é o seletor pós-instalação chamado pelo instalador curl|bash.

    Ele passa pela seleção de idioma (CLI / TUI / saída do agente), seleção
    de preset e configuração de harness MCP em um único programa bubbletea,
    e então grava o wrapper okt() no rc do shell. Use --update para revisitar.

    Shells não interativos pulam cada tela cuja variável de ambiente está
    definida: OKT_CLI_LANG, OKT_TUI_LANG, OKT_AGENT_LANG, OKT_PRESET, OKT_HARNESSES.
  cli.setup.flag.update: "re-executa o seletor com os valores atuais como padrão (idempotente sobre rc + omakiten.yaml existentes)"
  cli.setup.flag.cli-lang: "pula o seletor de idioma do CLI definindo o código escolhido (mesma forma de OKT_CLI_LANG=)"
  cli.setup.flag.tui-lang: "pula o seletor de idioma da TUI definindo o código escolhido (mesma forma de OKT_TUI_LANG=)"
  cli.setup.flag.agent-lang: "pula o prompt de idioma de saída do agente definindo o valor livre escolhido"
  cli.setup.flag.preset: "pula o seletor de preset definindo o nome escolhido (mesma forma de OKT_PRESET=)"
  cli.setup.flag.harnesses: "pula o multi-seletor de harnesses com um CSV de nomes (mesma forma de OKT_HARNESSES=)"
  cli.setup.flag.skip-wrapper: "não grava o bloco wrapper okt() no rc do shell (útil quando o usuário gerencia o rc via dotfiles)"
  cli.setup.flag.skip-harnesses: "resolve as entradas de harness mas não invoca `okt mcp setup` (usado pelos testes shell + smoke dry-run)"
  cli.setup.status.preset_written: "=> Preset de workflow ativo: %s (%s/.active)"
