  cli.config.init.long: |-
    Cria um install de config standalone enraizado no escopo escolhido.

      --scope global  →  paths.ConfigRoot() (ou o diretório pai de --config).
                         Install user já existente; re-execução é idempotente.

      --scope local   →  <cwd>/.omakiten (CWD literal, sem walk-up).
                         Install completo — config/<preset>.yaml mais cada
                         pasta de entidade — para o runtime carregar sem
                         merge com a camada user-global. O resolver de
                         walk-up pega isso automaticamente em chamadas okt
                         subsequentes feitas dentro do repo.

    Matriz de comportamento:
      - Arquivo ausente         → escrita atômica.
      - Mesmo preset, mesmos arquivos → no_op:true (sucesso silencioso).
      - Preset diferente        → vira o .active para o novo preset.
      - Arquivos shipped alterados → preservados a menos que --force.
      - --force                 → re-copia todos os arquivos shipped embedados
                                  (skills, laws, personas, templates, themes,
                                  notifications, todos os preset yamls).
                                  Subárvores custom/ nunca são tocadas.

    Seleção de idioma:
      --cli-lang, --tui-lang, --agent-lang pulam os prompts interativos
      de cada surface e gravam o valor direto no bloco languages do
      omakiten.yaml seedado. --cli-lang e --tui-lang devem combinar com
      um código de idioma bundled (en, pt-br, ...); --agent-lang é livre.
      Sem flag, init pergunta no TTY (ou deixa no padrão quando stdin é
      não-interativo).
  cli.config.path.long: |-
    Percorre a config ativa (ou uma camada escolhida) por chave YAML
    pontilhada e reporta {key, value, path, source}. Sem --layer o
    resolver pega o install que o runtime usaria: o .omakiten/
    descoberto quando presente, senão o ConfigRoot user-global.

    O modelo standalone significa que não há merge — um valor em
    qualquer chave vem de exatamente um install. --layer prende a busca
    em "global" ou "local" para o caller verificar uma camada específica
    em vez da resolvida (por exemplo "isso está setado no install
    user-global mesmo que meu repo sobrescreva localmente").
  cli.config.diff.long: |-
    Compara duas fontes YAML de config e emite uma entrada por folha
    divergente. Cada operando é um dos:
      global              - o yaml ativo user-global
      local               - o yaml ativo no walk-up do CWD em .omakiten/
      local:<path>        - o yaml ativo dentro de <path>/.omakiten/
      <path/to/file.yaml> - qualquer arquivo yaml no disco

    Cada entrada de saída carrega op = added | removed | changed mais os
    valores relevantes. Maps descem recursivamente; listas / escalares
    comparam por igualdade profunda.
  cli.config.language.long: |-
    Lê e escreve config.languages.{cli,tui,agent_output} no omakiten.yaml
    ativo. languages.cli e languages.tui são validados contra os language
    packs descobertos sob languages/; languages.agent_output é livre e
    repassado verbatim para o compositor de prompts MCP.

    O target padrão é o omakiten.yaml resolvido (.omakiten/ repo-local
    quando presente, senão o ConfigRoot user-global). Use --global em
    set/reset para fixar a escrita no arquivo user-global independente
    da presença do repo-local.

    Escritas disparam BundleCache.Reload para que chamadas okt
    subsequentes e tools de longa duração (TUI, servidor MCP) observem
    a nova seleção. O processo CLI atual e qualquer invocação CLI já em
    andamento não são atualizados retroativamente; só chamadas
    posteriores pegam a mudança.
  cli.config.language.set.long: |-
    Exemplos:
      okt config language set --cli pt-br
      okt config language set --tui en --agent "Português (Brasil)"
      okt config language set --agent "" --global

    Pelo menos uma de --cli, --tui ou --agent deve ser fornecida. --cli e
    --tui validam contra os códigos de idioma descobertos sob languages/.
    --agent aceita qualquer string não-vazia (ou "" para limpar). --global
    fixa a escrita no omakiten.yaml user-global.
  cli.mcp.install.long: "Grava a configuração do servidor MCP do Omakiten no arquivo de config do harness (ex.: Claude Desktop ou OpenCode)."
  cli.workflow.orphan.long: |-
    Tasks que apontavam para um bucket de workflow que não existe mais
    depois de uma troca de preset ou edição de omakiten.yaml são órfãs.
    Por padrão este comando imprime o plano de migração (quais tasks
    re-vinculariam a quais buckets) e sai com código não-zero sem
    mutar nada.

    Passe --confirm para aplicar o re-vínculo. Cada task migrada emite
    um evento task.migrated com payload from/to/reason. --dry-run é
    equivalente a rodar sem --confirm.
