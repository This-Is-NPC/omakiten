  # okt update — in-binary counterpart of the curl|bash installer for refresh.
  cli.update.short: "Busca o release mais recente do okt e troca o binário instalado atomicamente"
  cli.update.long: |-
    Detecta o caminho do binário em execução (os.Executable), consulta a API de
    releases do GitHub pela tag mais recente, baixa o asset correspondente e
    substitui o binário no disco atomicamente. O processo atual encerra
    após a troca; a próxima invocação roda a nova versão.
    
    --check imprime `current=<v> latest=<v> action=<noop|upgrade>` e
    sai com 0 sem gravar. --yes pula o prompt de confirmação para
    chamadores não interativos.
  cli.update.flag.yes: "pula o prompt de confirmação e aplica o upgrade de forma não interativa"
