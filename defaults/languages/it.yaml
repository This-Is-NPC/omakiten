# okt uninstall — in-binary counterpart of uninstall.sh / uninstall.ps1.
  cli.uninstall.short: "Rimuove il binary okt installato e il wrapper shell-rc (dati + config preservati per impostazione predefinita)"
  cli.uninstall.long: |-
    Rimuove il binary scritto dall'installer in $INSTALL_DIR (predefinito
    ~/.local/bin su POSIX e %LOCALAPPDATA%\Programs\okt su Windows) e
    rimuove il blocco wrapper okt() da ogni target rc/profile.
    
    Lo stato locale è preservato salvo opt-out esplicito via --purge-data
    (SQLite DB in $XDG_DATA_HOME/omakiten) o --purge-config (profilo yaml
    attivo + cartelle entity in $XDG_CONFIG_HOME/omakiten).
    --purge è scorciatoia per entrambi.
    
    Senza flag su un TTY il picker mostra cosa verrebbe eliminato con
    dimensioni e chiede per ogni target di purge. --yes salta il picker del tutto.
    
    Nessun backup automatico. Esegui `okt db backup` prima se vuoi uno
    snapshot del SQLite DB prima del purge — la disinstallazione rimuove
    dati utente intenzionalmente; la rete di sicurezza è opt-in via il
    comando di backup standalone.
  cli.uninstall.flag.yes: "salta il picker interattivo e applica l'insieme di flag risolto in modo non interattivo"
  cli.uninstall.flag.purge-data: "elimina anche $XDG_DATA_HOME/omakiten (SQLite DB + WAL/SHM) — irreversibile"
  cli.uninstall.flag.purge-config: "elimina anche $XDG_CONFIG_HOME/omakiten (yaml attivo + cartelle entity) — irreversibile"
  cli.uninstall.flag.purge: "scorciatoia per --purge-data + --purge-config — irreversibile"
  cli.uninstall.picker.title: "Disinstalla okt"
  cli.uninstall.picker.hint: "↑/↓ navigare · enter alternare · y applicare · ctrl+c uscire"
