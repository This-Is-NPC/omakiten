  cli.projects.delete.long: |-
    Risolvi il progetto per id numerico o slug, scrivi uno snapshot
    di recovery nella directory di backup rotativi, poi cascade-delete
    di ogni riga dipendente (tasks, comments, plans, tag attachments,
    errors, activity log).
    
    Un fallimento del backup interrompe il delete prima di toccare nulla.
    Lo stato filesystem sotto <root_path>/.omakiten/ è preservato —
    solo le righe DB vengono rimosse.
    
    Senza --yes il comando stampa i contatori e chiede
    conferma; il pipe senza --yes fallisce invece di
    bloccare su stdin.
  cli.projects.delete.flag.yes: "salta la conferma interattiva e applica il delete in modo non interattivo"
