  cli.setup.short: "Esegue il picker di setup iniziale (lingua → preset → harness MCP)"
  cli.setup.long: |-
    okt setup è il picker post-installazione in cui ti deposita l'installer curl|bash.

    Percorre la selezione di lingua (CLI / TUI / output dell'agent), la
    selezione del preset e la configurazione dell'harness MCP in un unico
    programma bubbletea, poi scrive il wrapper okt() nel rc del shell.
    Riesegui con --update per rivedere le scelte.

    Le shell headless / non interattive saltano ogni schermata coperta
    dalla rispettiva env var: OKT_CLI_LANG, OKT_TUI_LANG, OKT_AGENT_LANG,
    OKT_PRESET, OKT_HARNESSES.
  cli.setup.flag.update: "riesegue il picker con i valori correnti precompilati (idempotente sopra rc + omakiten.yaml esistenti)"
  cli.setup.flag.cli-lang: "salta il picker della lingua CLI impostando il codice scelto (stessa forma di OKT_CLI_LANG=)"
  cli.setup.flag.tui-lang: "salta il picker della lingua TUI impostando il codice scelto (stessa forma di OKT_TUI_LANG=)"
  cli.setup.flag.agent-lang: "salta il prompt della lingua di output dell'agent impostando il valore libero scelto"
  cli.setup.flag.preset: "salta il picker del preset impostando il nome scelto (stessa forma di OKT_PRESET=)"
  cli.setup.flag.harnesses: "salta il multi-select degli harness con un CSV di nomi (stessa forma di OKT_HARNESSES=)"
  cli.setup.flag.skip-wrapper: "non scrive il blocco wrapper okt() nel rc del shell (utile quando l'utente gestisce il rc via dotfiles)"
  cli.setup.flag.skip-harnesses: "risolve gli input degli harness ma non invoca `okt mcp setup` (usato dai test shell + smoke dry-run)"
