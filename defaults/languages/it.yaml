  cli.config.init.long: |-
    Crea un install di config standalone radicato nello scope scelto.

      --scope global  →  paths.ConfigRoot() (o la directory padre di --config).
                         Install utente già esistente; la riesecuzione è idempotente.

      --scope local   →  <cwd>/.omakiten (CWD letterale, senza walk-up).
                         Install completo — config/<preset>.yaml più ogni
                         cartella di entità — perché il runtime possa caricarlo
                         senza alcun merge con il layer user-global. Il resolver
                         di walk-up lo rileva automaticamente nelle chiamate
                         okt successive dall'interno del repo.

    Matrice di comportamento:
      - File assente            → scrittura atomica.
      - Stesso preset, stessi file → no_op:true (successo silenzioso).
      - Preset diverso          → cambia .active al nuovo preset.
      - File shipped manomessi  → preservati salvo --force.
      - --force                 → ricopia ogni file shipped embedded
                                  (skills, laws, personas, templates, themes,
                                  notifications, ogni preset yaml).
                                  Le sotto-cartelle custom/ non vengono mai toccate.

    Selezione della lingua:
      --cli-lang, --tui-lang, --agent-lang saltano i prompt interattivi
      per ciascuna surface e scrivono il valore direttamente nel blocco
      languages del omakiten.yaml seedato. --cli-lang e --tui-lang devono
      corrispondere a un codice di lingua bundled (en, pt-br, ...);
      --agent-lang è libero. Senza flag, init chiede sul TTY (o lascia la
      surface al default quando stdin non è interattivo).
  cli.config.path.long: |-
    Percorre la config attiva (o un layer scelto) per chiave YAML puntata
    e riporta {key, value, path, source}. Senza --layer il resolver
    sceglie l'install che il runtime userebbe: il .omakiten/ scoperto
    quando presente, altrimenti il ConfigRoot user-global.

    Il modello standalone significa che non c'è merge — un valore a
    qualunque chiave proviene da esattamente un install. --layer fissa
    la lookup a "global" o "local" così il caller può verificare un
    layer specifico anziché quello risolto (per esempio "è impostato
    nell'install user-global anche se il mio repo lo sovrascrive
    localmente").
  cli.config.diff.long: |-
    Confronta due sorgenti YAML di config ed emette una voce per ogni
    foglia divergente. Ogni operando è uno di:
      global              - il yaml attivo user-global
      local               - il yaml attivo nel walk-up del CWD in .omakiten/
      local:<path>        - il yaml attivo dentro <path>/.omakiten/
      <path/to/file.yaml> - qualunque file yaml su disco

    Ogni voce di output porta op = added | removed | changed più i valori
    rilevanti. Le map discendono ricorsivamente; liste / scalari
    confrontano per uguaglianza profonda.
  cli.config.language.long: |-
    Legge e scrive config.languages.{cli,tui,agent_output} nel
    omakiten.yaml attivo. languages.cli e languages.tui sono validati
    contro i language pack scoperti sotto languages/; languages.agent_output
    è libero e inoltrato verbatim al compositore di prompt MCP.

    Il target di default è il omakiten.yaml risolto (.omakiten/ repo-local
    quando presente, altrimenti il ConfigRoot user-global). Usa --global
    su set/reset per fissare la scrittura al file user-global a
    prescindere dalla presenza del repo-local.

    Le scritture innescano BundleCache.Reload così che le invocazioni
    okt successive e i tool a esecuzione lunga (TUI, server MCP)
    osservino la nuova selezione. Il processo CLI corrente e ogni
    invocazione CLI già in corso non vengono aggiornati retroattivamente;
    solo le invocazioni successive raccolgono il cambiamento.
  cli.config.language.set.long: |-
    Esempi:
      okt config language set --cli pt-br
      okt config language set --tui en --agent "Português (Brasil)"
      okt config language set --agent "" --global

    Almeno una tra --cli, --tui o --agent deve essere fornita. --cli e
    --tui validano contro i codici di lingua scoperti sotto languages/.
    --agent accetta qualunque stringa non vuota (o "" per azzerare).
    --global fissa la scrittura al omakiten.yaml user-global.
  cli.mcp.install.long: "Scrive la configurazione del server MCP di Omakiten nel file di config del harness (es. Claude Desktop o OpenCode)."
  cli.workflow.orphan.long: |-
    I task che puntavano a un bucket di workflow non più esistente dopo
    uno scambio di preset o una modifica al omakiten.yaml sono orfani.
    Di default questo comando stampa il piano di migrazione (quali task
    verrebbero ricollegati a quali bucket) ed esce con codice non-zero
    senza mutare nulla.

    Passa --confirm per applicare il ricollegamento. Ogni task migrato
    emette un evento task.migrated con payload from/to/reason. --dry-run
    è equivalente a eseguire senza --confirm.
