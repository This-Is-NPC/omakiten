  cli.uninstall.picker.no_tty: "il picker interattivo richiede un TTY; passa --yes (più --purge-* opzionali) per disinstallazione headless"
  cli.uninstall.picker.aborted: "disinstallazione annullata; nulla rimosso"

  # okt update — in-binary counterpart of the curl|bash installer for refresh.
  cli.update.short: "Recupera l'ultima release okt e sostituisce il binary installato atomicamente"
  cli.update.long: |-
    Rileva il percorso del binary in esecuzione (os.Executable), interroga l'API
    releases GitHub per l'ultima tag, scarica l'asset corrispondente e
    sostituisce il binary su disco atomicamente. Il processo attuale termina
    dopo lo swap; la prossima invocazione esegue la nuova versione.
    
    --check stampa `current=<v> latest=<v> action=<noop|upgrade>` e
    esce con 0 senza scrivere. --yes salta la conferma per i
    caller non interattivi.
  cli.update.flag.yes: "salta la conferma e applica l'upgrade in modo non interattivo"
  cli.update.flag.check: "riporta attuale vs. ultima e esce senza scrivere"
  cli.update.flag.skip_defaults: "update only the binary and skip shipped defaults refresh"
