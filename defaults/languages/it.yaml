  cli.root.long: |-
    okt pilota Omakiten dalla riga di comando e dalla TUI.

    Risoluzione dei percorsi (precedenza decrescente):
      1. flag --config / --db
      2. $OMAKITEN_HOME — fissa config in <HOME>/config/<active>.yaml e dati in <HOME>/data/omakiten.db
