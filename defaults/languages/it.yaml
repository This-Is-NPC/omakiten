  cli.db.short: "Utilità del ciclo di vita del database (backup, snapshot, restore — ops sysadmin)"
  cli.db.backup.short: "Scrivere uno snapshot del database SQLite attivo nella directory di backup rotativi"
  cli.db.backup.long: |-
    Copia il database SQLite attivo in uno snapshot con timestamp sotto
    $XDG_STATE_HOME/omakiten/backups/ (default ~/.local/state/omakiten/backups/)
    e prune snapshot più vecchi secondo settings.backup.retention_count.
    
    La copia è atomica: la destinazione appare solo quando il contenuto
    è stato scritto e rinominato. Una copia parziale precedente non
    sopravvive a un errore.
    
    --out fissa esplicitamente il percorso dello snapshot (directory
    padre create se serve). Con --out il retention prune viene
    saltato — la rotazione è gestita fuori dalla directory state predefinita.
  cli.db.backup.flag.out: "scrivere lo snapshot in questo percorso esplicito (salta retention prune)"
  cli.db.backup.flag.force: "sovrascrivere il file di destinazione quando --out punta a un percorso esistente"
