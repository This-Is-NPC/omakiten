# okt uninstall — in-binary counterpart of uninstall.sh / uninstall.ps1.
  cli.uninstall.short: "インストール済み okt バイナリと shell-rc wrapper を削除(データ + config は既定で保持)"
  cli.uninstall.long: |-
    インストーラが $INSTALL_DIR に書き込んだバイナリ(既定は
    POSIX で ~/.local/bin、Windows で %LOCALAPPDATA%\Programs\okt)を削除し、
    各 rc/profile ターゲットから okt() wrapper ブロックを取り除きます。
    
    --purge-data で明示的に opt-out しない限り
    ($XDG_DATA_HOME/omakiten の SQLite DB)または --purge-config
    ($XDG_CONFIG_HOME/omakiten のアクティブ yaml プロファイル + entity フォルダ)、
    ローカル状態は保持されます。
    --purge は両方の省略形です。
    
    TTY 上で flags なしの場合、picker は削除対象と
    サイズを表示し、purge ターゲットごとに確認します。--yes は picker を完全にスキップします。
    
    自動 backup はありません。purge 前に SQLite DB の
    snapshot が必要なら先に `okt db backup` を実行してください — アンインストールは意図的に
    ユーザーデータを削除します。安全網は standalone backup コマンドで opt-in です。
  cli.uninstall.flag.yes: "対話 picker をスキップし、解決済み flag セットを非対話で適用"
  cli.uninstall.flag.purge-data: "$XDG_DATA_HOME/omakiten も削除(SQLite DB + WAL/SHM)—取り消し不可"
  cli.uninstall.flag.purge-config: "$XDG_CONFIG_HOME/omakiten も削除(アクティブ yaml + entity フォルダ)—取り消し不可"
  cli.uninstall.flag.purge: "--purge-data + --purge-config の省略形—取り消し不可"
  cli.uninstall.picker.title: "okt をアンインストール"
  cli.uninstall.picker.hint: "↑/↓ 移動 · enter 切替 · y 適用 · ctrl+c 終了"
  cli.uninstall.picker.warn: "元に戻せません"
  cli.uninstall.picker.binary: "バイナリ  %s"
  cli.uninstall.picker.wrappers: "shell wrappers(rc/profile ブロック)"
  cli.uninstall.picker.data: "データ dir  %s  (%s)"
  cli.uninstall.picker.config: "config ディレクトリ  %s  (%s)"
  cli.uninstall.picker.no_tty: "対話 picker には TTY が必要です; headless アンインストールには --yes(および任意の --purge-*) を渡してください"
  cli.uninstall.picker.aborted: "アンインストールを中止しました; 何も削除されていません"

  # okt update — in-binary counterpart of the curl|bash installer for refresh.
  cli.update.short: "最新 okt release を取得し、インストール済みバイナリを原子的に差し替え"
  cli.update.long: |-
    実行中バイナリのパス(os.Executable)を検出し、GitHub
    releases API で最新 tag を問い合わせ、一致する asset をダウンロードして
    ディスク上のバイナリを原子的に置き換えます。swap 後に現在のプロセスは
    終了し、次回の呼び出しで新バージョンが動きます。
    
    --check は `current=<v> latest=<v> action=<noop|upgrade>` を出力し、
    書き込みなしで 0 終了します。--yes は非対話呼び出しの確認をスキップします。
