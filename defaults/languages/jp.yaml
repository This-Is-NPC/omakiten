  cli.setup.short: "インストール直後の初期セレクタを実行 (言語 → preset → MCP harness)"
  cli.setup.long: |-
    okt setup は curl|bash インストーラから呼ばれるインストール後の
    セレクタです。

    言語選択 (CLI / TUI / agent 出力)、preset 選択、MCP harness 構成を
    単一の bubbletea プログラムで進め、その後 shell rc の okt() ラッパー
    を書き込みます。--update で選択を再訪できます。

    非対話シェルでは、対応する環境変数が設定された各画面をスキップします:
    OKT_CLI_LANG、OKT_TUI_LANG、OKT_AGENT_LANG、OKT_PRESET、OKT_HARNESSES。
  cli.setup.flag.update: "現在の値をデフォルトにしてセレクタを再実行 (既存 rc + omakiten.yaml に対して冪等)"
  cli.setup.flag.cli-lang: "選択されたコードを設定して CLI 言語セレクタをスキップ (OKT_CLI_LANG= と同形式)"
  cli.setup.flag.tui-lang: "選択されたコードを設定して TUI 言語セレクタをスキップ (OKT_TUI_LANG= と同形式)"
