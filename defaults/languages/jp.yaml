  cli.db.short: "Database ライフサイクル utilities (backup, snapshot, restore — sysadmin ops)"
  cli.db.backup.short: "アクティブな SQLite database の snapshot をローリング backups ディレクトリに書き込む"
  cli.db.backup.long: |-
    アクティブな SQLite database をタイムスタンプ付き snapshot として
    $XDG_STATE_HOME/omakiten/backups/ (既定 ~/.local/state/omakiten/backups/)
    にコピーし、settings.backup.retention_count に従って古い snapshot を prune。
    
    コピーは atomic: 本体の書き込みと rename が完了して初めて
    宛先が現れる。以前の部分コピーは失敗から
    生き残らない。
    
    --out で snapshot パスを明示 (--out 指定時は retention prune を
    スキップ — ローテーションは既定 state ディレクトリ外でユーザー管理)。
  cli.db.backup.flag.out: "snapshot をこの明示的ファイルパスに書き込む (retention prune をスキップ)"
  cli.db.backup.flag.force: "--out が既存パスを指すときターゲットファイルを上書き"
