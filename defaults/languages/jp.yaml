  cli.root.long: |-
    okt はコマンドラインと TUI から Omakiten を操作します。

    パス解決の優先順位(高→低):
      1. --config / --db フラグ
      2. $OMAKITEN_HOME — config を <HOME>/config/<active>.yaml に、データを <HOME>/data/omakiten.db に固定
      3. $XDG_CONFIG_HOME / $XDG_DATA_HOME
      4. ~/.config/omakiten および ~/.local/share/omakiten
