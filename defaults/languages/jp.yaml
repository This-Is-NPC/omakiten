  cli.config.init.long: |-
    選択した scope を起点にスタンドアロンな config install を作成する。

      --scope global  →  paths.ConfigRoot() (または --config の親ディレクトリ)。
                         既存のユーザインストール。再実行は冪等。

      --scope local   →  <cwd>/.omakiten (リテラル CWD、walk-up なし)。
                         完全なインストール — config/<preset>.yaml と全
                         エンティティフォルダ — を作成し、runtime が
                         user-global レイヤーとマージせずにロードできる。
                         以降の okt 呼び出しでは walk-up リゾルバが repo
                         内からこれを自動で拾う。

    挙動マトリクス:
      - ファイル無し            → アトミック書き込み。
      - 同じ preset、同じファイル → no_op:true (サイレント成功)。
      - 別の preset            → .active を新しい preset に切り替え。
      - shipped ファイル改変済み → --force が無い限り保持。
      - --force                → 全ての shipped 埋め込みファイルを再コピー
                                  (skills, laws, personas, templates, themes,
                                  notifications, 全 preset yaml)。custom/
                                  サブツリーは決して触らない。

    言語選択:
      --cli-lang、--tui-lang、--agent-lang は各 surface のインタラクティブ
      プロンプトをスキップし、値を seed された omakiten.yaml の languages
      ブロックに直接書き込む。--cli-lang と --tui-lang は bundled された
      言語コード (en, pt-br, es, ja, ...) と一致する必要がある。--agent-lang
      は自由記述。フラグが無い場合、init は TTY でプロンプトを出す (stdin
      が非対話的なら surface はデフォルト値のまま)。
  cli.config.path.long: |-
    アクティブ config (または選択したレイヤー) をドット区切り YAML キーで
    走査し、{key, value, path, source} を報告する。--layer 無しの場合、
    リゾルバは runtime が使うインストールを選ぶ: 検出された .omakiten/ が
    あればそれ、無ければ user-global の ConfigRoot。

    スタンドアロンモデルではマージが無いため、どのキーの値も厳密に 1 つの
    インストールから来る。--layer は検索を "global" または "local" に固定
    することで、呼び出し側が解決されたものではなく特定のレイヤーを検証
    できる (例: 「repo がローカルで上書きしていても、これは user-global
    インストールに設定されているか?」)。
  cli.config.diff.long: |-
    2 つの YAML config ソースを比較し、相違する各リーフごとに 1 エントリを
    出力する。各オペランドは以下のいずれか:
      global              - user-global のアクティブ yaml
      local               - CWD walk-up 内の .omakiten/ のアクティブ yaml
      local:<path>        - <path>/.omakiten/ 内のアクティブ yaml
      <path/to/file.yaml> - ディスク上の任意の yaml ファイル

    出力エントリは op = added | removed | changed と関連する値を持つ。
    マップは再帰的に下降。リスト/スカラーは深い等価比較。
  cli.config.language.long: |-
    アクティブな omakiten.yaml の config.languages.{cli,tui,agent_output} を
    読み書きする。languages.cli と languages.tui は languages/ 配下で検出
    された language pack に対して検証され、languages.agent_output は自由
    記述で MCP prompt コンポーザにそのまま転送される。

    デフォルトのターゲットは解決された omakiten.yaml (.omakiten/ repo-local
    が存在すればそれ、無ければ user-global の ConfigRoot)。set/reset に
    --global を使うと repo-local の有無に関わらず user-global ファイルに
    書き込みが固定される。

    書き込みは BundleCache.Reload を発火するため、以降の okt 呼び出しと
    長期実行ツール (TUI、MCP サーバ) は新しい選択を観測する。現在の CLI
    プロセスや既に実行中の CLI 呼び出しは遡及的には更新されない。以降の
    呼び出しのみが変更を拾う。
  cli.config.language.set.long: |-
    例:
      okt config language set --cli ja
      okt config language set --tui en --agent "日本語"
      okt config language set --agent "" --global

    --cli、--tui、--agent のうち少なくとも 1 つは指定する必要がある。
    --cli と --tui は languages/ 配下で検出された言語コードに対して検証
    される。--agent は任意の非空文字列 (またはクリアするなら "") を
    受け取る。--global は user-global の omakiten.yaml に書き込みを固定
    する。
  cli.mcp.install.long: "Omakiten MCP サーバの構成を harness の config ファイルに書き込む (例: Claude Desktop または OpenCode)。"
  cli.workflow.orphan.long: |-
    preset 切り替えや omakiten.yaml 編集後にもはや存在しない workflow
    bucket を指していた task は孤児となる。デフォルトでこのコマンドは
    移行計画 (どの task がどの bucket に再バインドされるか) を出力し、
    何も変更せず非ゼロで終了する。

    --confirm を渡すと再バインドを適用する。移行された各 task は
    from/to/reason ペイロード付きの task.migrated イベントを emit する。
    --dry-run は --confirm 無しでの実行と等価。
