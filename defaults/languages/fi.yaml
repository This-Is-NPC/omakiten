  cli.root.short: "Mielipiteelliset tarkistuspisteet AI-vetoiseen kehitykseen"
  cli.root.long: |-
    okt ohjaa Omakitenia komentoriviltä ja TUI:sta.

    Polkujen ratkaisu (korkeimmasta alimpaan prioriteettiin):
      1. --config / --db -liput
      2. $OMAKITEN_HOME — kiinnittää configin polkuun <HOME>/config/<active>.yaml ja datan polkuun <HOME>/data/omakiten.db
      3. $XDG_CONFIG_HOME / $XDG_DATA_HOME
      4. ~/.config/omakiten ja ~/.local/share/omakiten
  cli.root.flag.db: "SQLite-tietokannan polku (ohittaa $OMAKITEN_HOME ja XDG)"
  cli.root.flag.config: "omakiten.yaml-polku (ohittaa $OMAKITEN_HOME ja XDG)"
