  notice.subtask_kit.enabled.mcp_resolves_at_root: "Sub-task kit enabled: MCP commands, personas, laws, templates, and skills still resolve from the project root kit."
  cli.config.init.long: |-
    Siemennä itsenäinen config-asennus valittuun scopeen juurtuneena.

      --scope global  →  paths.ConfigRoot() (tai --configin vanhempi).
                         Olemassa oleva käyttäjän asennus; uudelleenajo on idempotentti.

      --scope local   →  <cwd>/.omakiten (kirjaimellinen CWD, ei walk-upia).
                         Täydellinen asennus — config/<preset>.yaml sekä jokainen
                         entiteettikansio — jotta runtime voi ladata sen ilman
                         yhdistämistä käyttäjäglobaaliin kerrokseen. Walk-up-resolveri
                         poimii tämän automaattisesti myöhemmissä okt-kutsuissa
                         repon sisältä.

    Toimintamatriisi:
      - Tiedosto puuttuu        → atominen kirjoitus.
      - Sama preset, samat tied → no_op:true (hiljainen onnistuminen).
      - Eri preset              → vaihtaa .active-arvon uuteen presetiin.
      - Muokatut shipped-tiedos → säilytetään ellei --force.
      - --force                 → kopioi uudelleen jokaisen sulautetun shipped-
                                  tiedoston (skills, laws, personas, templates,
                                  themes, notifications, jokainen preset yaml).
                                  custom/-alipuita ei koskaan kosketa.

    Kielen valinta:
      --cli-lang, --tui-lang, --agent-lang ohittavat interaktiiviset kehotteet
      kullekin pinnalle ja kirjoittavat arvon suoraan siemennetyn omakiten.yamlin
      languages-lohkoon. --cli-lang ja --tui-lang täytyy vastata mukana tulevaa
      kielikoodia (en, pt-br, ...); --agent-lang on vapaamuotoinen. Kun lippua
      ei anneta, init kysyy TTY:llä (tai jättää pinnan oletukseen kun stdin
      ei ole interaktiivinen).
  cli.config.path.long: |-
    Käy aktiivinen config (tai valittu kerros) läpi pisteellä erotetulla
    YAML-avaimella ja raportoi {key, value, path, source}. Ilman --layer-lippua
    resolveri valitsee asennuksen, jota runtime käyttäisi: löydetyn .omakiten/
    kun se on olemassa, muuten käyttäjäglobaalin ConfigRootin.

    Itsenäinen malli tarkoittaa että yhdistämistä ei ole, joten arvo missä
    tahansa avaimessa tulee tasan yhdestä asennuksesta. --layer kiinnittää
    haun joko arvoon "global" tai "local", jotta kutsujat voivat varmistaa
    tietyn kerroksen ratkaistun sijaan (esim. "onko tämä asetettu
    käyttäjäglobaaliin asennukseen, vaikka repo ohittaa sen paikallisesti").
  cli.config.diff.long: |-
    Vertaa kahta YAML-config-lähdettä ja tuota yksi merkintä per eroava
    lehti. Kukin operandi on yksi seuraavista:
      global              - käyttäjäglobaali aktiivinen yaml
      local               - aktiivinen yaml CWD walk-upin .omakiten/-kansiossa
      local:<path>        - aktiivinen yaml polun <path>/.omakiten/-kansiossa
      <path/to/file.yaml> - mikä tahansa yaml-tiedosto levyllä

    Output-merkinnät kantavat op = added | removed | changed sekä asiaankuuluvat
    sivuarvot. Mapit laskeutuvat rekursiivisesti; listat / skalaarit verrataan
    syvällä yhtäläisyydellä.
  cli.config.language.long: |-
    Lue ja kirjoita config.languages.{cli,tui,agent_output} aktiivisessa
    omakiten.yamlissa. languages.cli ja languages.tui validoidaan kielipaketteja
    vasten, jotka on löydetty hakemistosta languages/; languages.agent_output
    on vapaamuotoinen ja välitetään sanatarkasti MCP-prompt-koostajalle.

    Oletuskohde on ratkaistu omakiten.yaml (repo-paikallinen .omakiten/ kun
    olemassa, muuten käyttäjäglobaali ConfigRoot). Käytä --global set/reset-
    komennoissa kiinnittääksesi kirjoituksen käyttäjäglobaaliin tiedostoon
    repo-paikallisuudesta riippumatta.

    Kirjoitukset laukaisevat BundleCache.Reloadin, joten myöhemmät okt-kutsut
    ja pitkään ajossa olevat työkalut (TUI, MCP-palvelin) havaitsevat uuden
    valinnan. Nykyistä CLI-prosessia ja jo käynnissä olevaa CLI-kutsua ei
    päivitetä takautuvasti; vain myöhemmät kutsut poimivat muutoksen.
  cli.config.language.set.long: |-
    Esimerkit:
      okt config language set --cli pt-br
      okt config language set --tui en --agent "Português (Brasil)"
      okt config language set --agent "" --global

    Vähintään yksi --cli, --tui tai --agent on annettava. --cli ja --tui
    validoidaan kielikoodeja vasten, jotka on löydetty hakemistosta languages/.
    --agent hyväksyy minkä tahansa ei-tyhjän merkkijonon (tai "" tyhjentääkseen).
    --global kiinnittää kirjoituksen käyttäjäglobaaliin omakiten.yamliin.
  cli.mcp.install.long: "Kirjoittaa Omakitenin MCP-palvelinkonfiguraation harnessin config-tiedostoon (esim. Claude Desktop tai OpenCode)."
  cli.workflow.orphan.long: |-
    Taskit, jotka osoittivat workflow-bucketiin jota ei enää ole olemassa preset-
    vaihdon tai omakiten.yamlin muokkauksen jälkeen, ovat orpoja. Oletuksena tämä
    komento tulostaa migraatiosuunnitelman (mitkä taskit uudelleensitoutuisivat
    mihinkin bucketiin) ja poistuu nollasta poikkeavalla koodilla, joten mitään
    ei mutoida.

    Anna --confirm soveltaaksesi uudelleensidonnan. Jokainen migroitu task lähettää
    task.migrated-tapahtuman, jonka payload sisältää from/to/reason. --dry-run vastaa
    suoritusta ilman --confirmia.
