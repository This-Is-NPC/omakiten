  cli.projects.short: "Project lifecycle utilities (delete — destructive ops)"
  cli.projects.delete.short: "Hard-delete a registered project and every dependent row (irreversible)"
  cli.projects.delete.long: |-
    Resolve the project by numeric id or slug, write a recovery
    snapshot to the rolling backups directory, then cascade-delete
    every dependent row (tasks, comments, plans, tag attachments,
    context entries, errors, activity log).

    Backup failure aborts the delete before anything is touched.
    Filesystem state under <root_path>/.omakiten/ is preserved —
    only DB rows are removed.

    Without --yes the command prints counters and prompts for
    confirmation; piping without --yes errors out instead of
    blocking on stdin.
  cli.projects.delete.flag.yes: "skip the interactive confirmation and apply the delete non-interactively"
  cli.projects.delete.counters_fmt: "tasks: %d · comments: %d · plans: %d · tags: %d · activity: %d entries"
  cli.projects.delete.prompt: "delete project %q? [y/N]:"
  cli.projects.delete.success_fmt: "project %q deleted · backup → %s"
  cli.projects.delete.err.no_tty: "interactive confirmation required; pass --yes to skip"
  cli.projects.delete.err.aborted: "delete aborted; nothing removed"
  cli.projects.delete.err.not_found: "project not found"
  cli.db.short: "Database lifecycle utilities (backup, snapshot, restore — sysadmin ops)"
  cli.db.backup.short: "Write a snapshot of the live SQLite database to the rolling backups directory"
  cli.db.backup.long: |-
    Copy the active SQLite database to a timestamped snapshot under
    $XDG_STATE_HOME/omakiten/backups/ (default ~/.local/state/omakiten/backups/)
    and prune older snapshots according to settings.backup.retention_count.

    The copy is atomic: the destination only appears once the body has
    been written and renamed into place. A previous partial copy never
    survives a failure.

    --out pins the snapshot path explicitly (parent directories are
    created as needed). When --out is supplied the retention prune
    pass is skipped — the user owns the rotation policy outside the
    default state directory.
  cli.db.backup.flag.out: "write the snapshot to this explicit file path (skips retention prune)"
  cli.db.backup.flag.force: "overwrite the target file when --out points at an existing path"
  cli.db.backup.error.system_path_fmt: "refusing to write backup to system path %q (under %s)"
  cli.db.backup.error.exists_fmt: "refusing to overwrite existing file %q; pass --force to replace"
  cli.db.backup.success_fmt: "backup written to %s"
