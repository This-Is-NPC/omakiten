  cli.setup.short: "Suorita ensikäynnistyksen setup-valitsin (kieli → preset → MCP-harness)"
  cli.setup.long: |-
    okt setup on asennuksen jälkeinen valitsin, johon curl|bash-asennusohjelma sinut tiputtaa.

    Se käy läpi kielen valinnan (CLI / TUI / agent-output), preset-valinnan
    ja MCP-harnessin konfiguroinnin yhdessä bubbletea-ohjelmassa, ja kirjoittaa
    sitten okt() shell-rc-kääreen. Suorita uudelleen --update-lipulla
    palataksesi valintoihin.

    Headless / ei-interaktiiviset shellit ohittavat jokaisen näytön, jonka vastaava
    env-muuttuja täyttää: OKT_CLI_LANG, OKT_TUI_LANG, OKT_AGENT_LANG, OKT_PRESET, OKT_HARNESSES.
  cli.setup.flag.update: "suorita valitsin uudelleen nykyisillä arvoilla esitäytettyinä (idempotentti olemassa olevia rc + omakiten.yamlia vastaan)"
  cli.setup.flag.cli-lang: "ohita CLI-kielivalitsin asettamalla valittu koodi (sama muoto kuin OKT_CLI_LANG=)"
  cli.setup.flag.tui-lang: "ohita TUI-kielivalitsin asettamalla valittu koodi (sama muoto kuin OKT_TUI_LANG=)"
  cli.setup.flag.agent-lang: "ohita agent-output-kielen kehote asettamalla valittu vapaamuotoinen arvo"
  cli.setup.flag.preset: "ohita preset-valitsin asettamalla valittu preset-nimi (sama muoto kuin OKT_PRESET=)"
  cli.setup.flag.harnesses: "ohita harnessien moniavalinta CSV-luettelolla harness-nimistä (sama muoto kuin OKT_HARNESSES=)"
  cli.setup.flag.skip-wrapper: "älä kirjoita okt() shell-rc-käärelohkoa (hyödyllinen kun käyttäjä hallitsee rc-tiedostojaan dotfilesin kautta)"
  cli.setup.flag.skip-harnesses: "ratkaise harness-syötteet mutta älä kutsu `okt mcp setup` (käyttää shell-testit + dry-run-savukokeet)"
