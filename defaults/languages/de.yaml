  cli.setup.short: "Startet den initialen Post-Installation-Selektor (Sprache → preset → skill-destination)"
  cli.setup.long: |-
    okt setup ist der Post-Installation-Selektor, der vom curl|bash-Installer
    aufgerufen wird.

    Er führt durch Sprachauswahl (CLI / TUI / Agent-Ausgabe), preset-Auswahl
    und skill-destination-Konfiguration in einem einzigen bubbletea-Programm und
    schreibt anschließend den okt()-Wrapper in das Shell-rc. Mit --update
    erneut starten, um Wahl zu revidieren.

    Headless / nicht-interaktive Shells überspringen jeden Screen, dessen
    passende Umgebungsvariable gesetzt ist: OKT_CLI_LANG, OKT_TUI_LANG,
    OKT_AGENT_LANG, OKT_PRESET, OKT_HARNESSES.
  cli.setup.flag.update: "führt den Selektor mit aktuellen Werten vorbefüllt erneut aus (idempotent gegenüber bestehenden rc + omakiten.yaml)"
  cli.setup.flag.cli-lang: "überspringt den CLI-Sprach-Selektor durch Setzen des gewählten Codes (gleiche Form wie OKT_CLI_LANG=)"
  cli.setup.flag.tui-lang: "überspringt den TUI-Sprach-Selektor durch Setzen des gewählten Codes (gleiche Form wie OKT_TUI_LANG=)"
