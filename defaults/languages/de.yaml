  cli.root.long: |-
    okt steuert Omakiten über Kommandozeile und TUI.

    Pfadauflösung (höchste zu niedrigster Priorität):
      1. --config / --db Flags
      2. $OMAKITEN_HOME — fixiert Config auf <HOME>/config/<active>.yaml und Daten auf <HOME>/data/omakiten.db
      3. $XDG_CONFIG_HOME / $XDG_DATA_HOME
      4. ~/.config/omakiten und ~/.local/share/omakiten
