  # okt update — in-binary counterpart of the curl|bash installer for refresh.
  cli.update.short: "Neuestes okt-Release holen und installiertes Binary atomisch tauschen"
  cli.update.long: |-
    Ermittelt den Pfad des laufenden Binary (os.Executable), fragt die GitHub-
    Releases-API nach dem neuesten Tag ab, lädt das passende Asset herunter und
    ersetzt das Binary auf der Platte atomisch. Der aktuelle Prozess endet
    nach dem Swap; der nächste Aufruf läuft mit der neuen Version.
    
    --check gibt `current=<v> latest=<v> action=<noop|upgrade>` aus und
    beendet mit 0 ohne zu schreiben. --yes überspringt die Bestätigung für
    non-interaktive Aufrufer.
  cli.update.flag.yes: "Bestätigungs-Prompt überspringen und Upgrade non-interaktiv anwenden"
  cli.update.flag.check: "aktuell vs. neueste melden und ohne Schreiben beenden"
