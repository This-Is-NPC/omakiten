  cli.config.init.long: |-
    Erstellt eine standalone Config-Installation verwurzelt im gewählten scope.

      --scope global  →  paths.ConfigRoot() (oder Elternverzeichnis von --config).
                         Bestehende User-Installation; Erneutes Ausführen ist idempotent.

      --scope local   →  <cwd>/.omakiten (wörtliches CWD, kein walk-up).
                         Komplette Installation — config/<preset>.yaml plus
                         jeder Entitätsordner — damit das Runtime sie ohne
                         Merge mit der user-globalen Ebene laden kann. Der
                         walk-up-Resolver erkennt dies automatisch bei
                         nachfolgenden okt-Aufrufen aus dem Repo heraus.

    Verhaltensmatrix:
      - Datei fehlt              → atomarer Write.
      - Gleiches preset, gleiche Dateien → no_op:true (stiller Erfolg).
      - Anderes preset           → schaltet .active auf neues preset um.
      - Manipulierte shipped-Dateien → bleiben erhalten außer mit --force.
      - --force                  → kopiert jede eingebettete shipped-Datei neu
                                    (skills, laws, personas, templates, themes,
                                    notifications, jedes preset-yaml).
                                    custom/-Unterbäume werden nie berührt.

    Sprachauswahl:
      --cli-lang, --tui-lang, --agent-lang überspringen die interaktiven
      Prompts für jede Surface und schreiben den Wert direkt in den
      languages-Block der geseedten omakiten.yaml. --cli-lang und
      --tui-lang müssen einem bundled Sprachcode entsprechen
      (en, pt-br, es, fr, de, ...); --agent-lang ist freitext. Ohne Flag
      fragt init auf dem TTY (oder lässt die Surface auf Standardwert,
      wenn stdin nicht-interaktiv ist).
  cli.config.path.long: |-
    Durchläuft die aktive Config (oder eine gewählte Ebene) anhand eines
    dotted YAML-Schlüssels und berichtet {key, value, path, source}.
    Ohne --layer wählt der Resolver das Install, das das Runtime
    verwenden würde: das erkannte .omakiten/ wenn vorhanden, sonst der
    user-globale ConfigRoot.

    Das standalone Modell bedeutet, dass es kein Merge gibt, sodass ein
    Wert eines beliebigen Schlüssels aus exakt einer Installation
    stammt. --layer fixiert die Lookup auf "global" oder "local", damit
    Caller eine bestimmte Ebene anstelle der aufgelösten verifizieren
    können (z. B. "ist das in der user-globalen Installation gesetzt,
    obwohl mein Repo es lokal überschreibt").
  cli.config.diff.long: |-
    Vergleicht zwei YAML-Config-Quellen und gibt einen Eintrag pro
    abweichendem Blatt aus. Jeder Operand ist einer von:
      global              - die user-globale aktive yaml
      local               - die aktive yaml im CWD walk-up .omakiten/
      local:<path>        - die aktive yaml in <path>/.omakiten/
      <path/to/file.yaml> - jede yaml-Datei auf der Platte

    Ausgabe-Einträge tragen op = added | removed | changed plus die
    relevanten Werte. Maps steigen rekursiv ab; Listen / Skalare
    vergleichen per tiefer Gleichheit.
  cli.config.language.long: |-
    Liest und schreibt config.languages.{cli,tui,agent_output} in der
    aktiven omakiten.yaml. languages.cli und languages.tui werden gegen
    die unter languages/ erkannten language packs validiert;
    languages.agent_output ist freitext und wird wörtlich an den
    MCP-prompt-Composer weitergegeben.

    Standardziel ist die aufgelöste omakiten.yaml (repo-lokales
    .omakiten/ wenn vorhanden, sonst der user-globale ConfigRoot). Bei
    set/reset --global verwenden, um den Write auf die user-globale
    Datei zu fixieren, unabhängig von der repo-lokalen Präsenz.

    Writes lösen BundleCache.Reload aus, damit nachfolgende
    okt-Aufrufe und langlaufende Tools (TUI, MCP-Server) die neue
    Auswahl beobachten. Der aktuelle CLI-Prozess und jeder bereits
    laufende CLI-Aufruf werden nicht rückwirkend aktualisiert; nur
    nachfolgende Aufrufe übernehmen die Änderung.
  cli.config.language.set.long: |-
    Beispiele:
      okt config language set --cli de
      okt config language set --tui en --agent "Deutsch"
      okt config language set --agent "" --global

    Mindestens eine von --cli, --tui oder --agent muss angegeben sein.
    --cli und --tui validieren gegen die unter languages/ erkannten
    Sprachcodes. --agent akzeptiert jeden nicht-leeren String (oder ""
    zum Leeren). --global fixiert den Write auf die user-globale
    omakiten.yaml.
  cli.mcp.install.long: "Schreibt die Konfiguration des Omakiten-MCP-Servers in die harness-Config-Datei (z. B. Claude Desktop oder OpenCode)."
  cli.workflow.orphan.long: |-
    Tasks, die auf einen workflow-bucket zeigten, der nach einem
    preset-Wechsel oder einer omakiten.yaml-Bearbeitung nicht mehr
    existiert, sind Waisen. Standardmäßig druckt dieser Befehl den
    Migrationsplan (welche tasks zu welchen buckets re-gebunden würden)
    und beendet sich mit non-zero, ohne etwas zu mutieren.

    Mit --confirm wird das Re-Binding angewendet. Jede migrierte task
    emittiert ein task.migrated-Event mit from/to/reason-Payload.
    --dry-run ist äquivalent zur Ausführung ohne --confirm.
