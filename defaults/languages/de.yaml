# okt uninstall — in-binary counterpart of uninstall.sh / uninstall.ps1.
  cli.uninstall.short: "Installiertes okt-Binary und Shell-rc-Wrapper entfernen (Daten + Config standardmäßig erhalten)"
  cli.uninstall.long: |-
    Entfernt das Binary, das der Installer nach $INSTALL_DIR geschrieben hat (Standard
    ~/.local/bin unter POSIX und %LOCALAPPDATA%\Programs\okt unter Windows), und
    entfernt den okt()-Wrapper-Block aus jedem rc/profile-Ziel.
    
    Lokaler Zustand bleibt erhalten, außer bei explizitem Opt-out via --purge-data
    (SQLite DB unter $XDG_DATA_HOME/omakiten) oder --purge-config (aktives
    yaml-Profil + Entity-Ordner unter $XDG_CONFIG_HOME/omakiten).
    --purge ist Kurzform für beides.
    
    Ohne Flags auf einem TTY zeigt der Selektor, was gelöscht würde, mit
    Größen und fragt pro Purge-Ziel. --yes überspringt den Selektor vollständig.
    
    Kein automatisches Backup. Führt zuerst `okt db backup` aus, wenn ihr vor dem
    Purge einen Snapshot der SQLite DB wollt — Deinstallation entfernt
    absichtlich nutzer-eigene Daten; das Sicherheitsnetz ist opt-in über den
    standalone Backup-Befehl.
  cli.uninstall.flag.yes: "interaktiven Selektor überspringen und den aufgelösten Flag-Satz non-interaktiv anwenden"
  cli.uninstall.flag.purge-data: "löscht auch $XDG_DATA_HOME/omakiten (SQLite DB + WAL/SHM) — irreversibel"
  cli.uninstall.flag.purge-config: "löscht auch $XDG_CONFIG_HOME/omakiten (aktives yaml + Entity-Ordner) — irreversibel"
  cli.uninstall.flag.purge: "Kurzform für --purge-data + --purge-config — irreversibel"
