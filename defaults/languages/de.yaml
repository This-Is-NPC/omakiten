  cli.setup.short: "Startet den initialen Post-Installation-Selektor (Sprache → preset → MCP-harness)"
  cli.setup.long: |-
    okt setup ist der Post-Installation-Selektor, der vom curl|bash-Installer
    aufgerufen wird.

    Er führt durch Sprachauswahl (CLI / TUI / Agent-Ausgabe), preset-Auswahl
    und MCP-harness-Konfiguration in einem einzigen bubbletea-Programm und
    schreibt anschließend den okt()-Wrapper in das Shell-rc. Mit --update
    erneut starten, um Wahl zu revidieren.

    Headless / nicht-interaktive Shells überspringen jeden Screen, dessen
    passende Umgebungsvariable gesetzt ist: OKT_CLI_LANG, OKT_TUI_LANG,
    OKT_AGENT_LANG, OKT_PRESET, OKT_HARNESSES.
  cli.setup.flag.update: "führt den Selektor mit aktuellen Werten vorbefüllt erneut aus (idempotent gegenüber bestehenden rc + omakiten.yaml)"
  cli.setup.flag.cli-lang: "überspringt den CLI-Sprach-Selektor durch Setzen des gewählten Codes (gleiche Form wie OKT_CLI_LANG=)"
  cli.setup.flag.tui-lang: "überspringt den TUI-Sprach-Selektor durch Setzen des gewählten Codes (gleiche Form wie OKT_TUI_LANG=)"
  cli.setup.flag.agent-lang: "überspringt den Agent-Ausgabesprache-Prompt durch Setzen des gewählten freien Werts"
  cli.setup.flag.preset: "überspringt den preset-Selektor durch Setzen des gewählten preset-Namens (gleiche Form wie OKT_PRESET=)"
  cli.setup.flag.harnesses: "überspringt die harness-Mehrfachauswahl mit einer CSV von harness-Namen (gleiche Form wie OKT_HARNESSES=)"
  cli.setup.flag.skip-wrapper: "schreibt den okt()-Shell-rc-Wrapper-Block nicht (nützlich wenn der Nutzer seine rc-Dateien per Dotfiles verwaltet)"
  cli.setup.flag.skip-harnesses: "löst harness-Eingaben auf, ruft aber `okt mcp setup` nicht auf (genutzt von Shell-Tests + Dry-Run-Smoke-Checks)"
  cli.setup.status.preset_written: "=> Aktives workflow-preset: %s (%s/.active)"
  cli.setup.status.wrapper_written: "=> okt()-Shell-Wrapper installiert in: %s"
  cli.setup.status.wrapper_skipped: "=> Shell-Wrapper-Installation übersprungen: kein ~/.bashrc oder ~/.zshrc gefunden"
