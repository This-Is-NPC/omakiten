  # TODO(translate): cli.config.init.long
  cli.config.init.long: |-
    Seed a standalone config install rooted in the chosen scope.

      --scope global  →  paths.ConfigRoot() (or --config's parent).
                         Existing user install; rerun is idempotent.

      --scope local   →  <cwd>/.omakiten (literal CWD, no walk-up).
                         A complete install — config/<preset>.yaml plus every
                         entity folder — so the runtime can load it without any
                         merge with the user-global layer. The walk-up resolver
                         picks this up automatically on subsequent okt calls
                         from inside the repo.

    Behaviour matrix:
      - File missing            → atomic write.
      - Same preset, same files → no_op:true (silent success).
      - Different preset        → flips .active to the new preset.
      - Tampered shipped files  → preserved unless --force.
      - --force                 → re-copies every embedded shipped file
                                  (skills, laws, personas, templates, themes,
                                  notifications, every preset yaml).
                                  custom/ subtrees are never touched.

    Language selection:
      --cli-lang, --tui-lang, --agent-lang skip the interactive prompts
      for each surface and write the value directly into the seeded
      omakiten.yaml's languages block. --cli-lang and --tui-lang must
      match a bundled language code (en, pt-br, ...); --agent-lang is
      free-form. When no flag is supplied, init prompts on the TTY (or
      leaves the surface at its default when stdin is non-interactive).
  # TODO(translate): cli.config.path.long
  cli.config.path.long: |-
    Walk the active config (or a chosen layer) by dotted YAML key
    and report {key, value, path, source}. Without --layer the resolver
    picks the install that the runtime would use: the discovered .omakiten/
    when present, otherwise the user-global ConfigRoot.

    The standalone model means there is no merge, so a value at any key
    comes from exactly one install. --layer pins the lookup to "global" or
    "local" so callers can verify a specific layer rather than the resolved
    one (e.g. "is this set in the user-global install even though my repo
    overrides it locally").
  # TODO(translate): cli.config.diff.long
  cli.config.diff.long: |-
    Compare two YAML config sources and emit one entry per divergent
    leaf. Each operand is one of:
      global              - the user-global active yaml
      local               - the active yaml inside the CWD walk-up .omakiten/
      local:<path>        - the active yaml inside <path>/.omakiten/
      <path/to/file.yaml> - any yaml file on disk

    Output entries carry op = added | removed | changed plus the relevant
    side values. Maps descend recursively; lists / scalars compare by deep
    equality.
  # TODO(translate): cli.config.language.long
  cli.config.language.long: |-
    Read and write config.languages.{cli,tui,agent_output} in the active
    omakiten.yaml. languages.cli and languages.tui are validated against
    the language packs discovered under languages/; languages.agent_output
    is free-form and forwarded verbatim to the MCP prompt composer.

    The default target is the resolved omakiten.yaml (repo-local
    .omakiten/ when present, otherwise the user-global ConfigRoot). Use
    --global on set/reset to pin the write to the user-global file
    regardless of repo-local presence.

    Writes trigger a BundleCache.Reload so subsequent okt invocations and
    long-running tools (TUI, MCP server) observe the new selection. The
    current CLI process and any already-running CLI invocation are not
    retroactively updated; only subsequent invocations pick up the change.
  # TODO(translate): cli.config.language.set.long
  cli.config.language.set.long: |-
    Examples:
      okt config language set --cli pt-br
      okt config language set --tui en --agent "Português (Brasil)"
      okt config language set --agent "" --global

    At least one of --cli, --tui, or --agent must be provided. --cli and
    --tui validate against the language codes discovered under languages/.
    --agent accepts any non-empty string (or "" to clear). --global pins
    the write to the user-global omakiten.yaml.
  # TODO(translate): cli.mcp.install.long
  cli.mcp.install.long: "Writes the Omakiten MCP server configuration to the harness config file (e.g. Claude Desktop or OpenCode)."
  # TODO(translate): cli.workflow.orphan.long
  cli.workflow.orphan.long: |-
    Tasks that pointed to a workflow bucket which no longer exists after a
    preset switch or omakiten.yaml edit are orphans. By default this command
    prints the migration plan (which tasks would rebind to which bucket) and
    exits non-zero so nothing is mutated.

    Pass --confirm to apply the rebind. Each migrated task emits a
    task.migrated event with from/to/reason payload. --dry-run is equivalent
    to running without --confirm.
