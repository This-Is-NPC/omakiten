  cli.projects.delete.long: |-
    Project numeric id किंवा slug ने resolve करा, recovery
    snapshot rolling backups directory मध्ये लिहा, नंतर cascade-delete
    प्रत्येक dependent row (tasks, comments, plans, tag attachments,
    errors, activity log).
    
    Backup failure delete अगोदर abort. <root_path>/.omakiten/ खालील
    filesystem state preserved — फक्त DB rows काढले.
    
    --yes शिवाय counters दाखवून confirmation; --yes शिवाय pipe stdin
    block ऐवजी error.
