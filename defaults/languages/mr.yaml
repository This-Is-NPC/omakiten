  cli.root.short: "AI-चालित विकासासाठी ओपिनियनेटेड चेकपॉइंट"
  cli.root.long: |-
    okt कमांड लाइन आणि TUI मधून Omakiten चालवते.

    पथ रिझॉल्यूशन (सर्वोच्च ते सर्वात कमी प्राधान्य):
      1. --config / --db flag
      2. $OMAKITEN_HOME — config ला <HOME>/config/<active>.yaml वर आणि data ला <HOME>/data/omakiten.db वर पिन करतो
      3. $XDG_CONFIG_HOME / $XDG_DATA_HOME
      4. ~/.config/omakiten आणि ~/.local/share/omakiten
