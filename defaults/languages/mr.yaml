  cli.db.short: "Database जीवनचक्र utilities (backup, snapshot, restore — sysadmin ops)"
  cli.db.backup.short: "सक्रिय SQLite database चा snapshot rolling backups directory मध्ये लिहा"
  cli.db.backup.long: |-
    सक्रिय SQLite database ची timestamped snapshot कॉपी करा
    $XDG_STATE_HOME/omakiten/backups/ (default ~/.local/state/omakiten/backups/)
    खाली आणि settings.backup.retention_count नुसार जुने snapshots prune करा.
    
    कॉपी atomic: destination फक्त body लिहून rename झाल्यावर
    दिसते.
    मागील partial copy failure वरून वाचत नाही.
    
    --out snapshot path स्पष्ट निश्चित करते. --out दिल्यास retention prune
    वगळले — rotation policy default state directory बाहेर user ची.
  cli.db.backup.flag.out: "snapshot या explicit file path वर लिहा (retention prune वगळते)"
  cli.db.backup.flag.force: "जेव्हा --out अस्तित्वात असलेल्या path वर असते तेव्हा target file overwrite करा"
