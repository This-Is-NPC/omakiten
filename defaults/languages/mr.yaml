  cli.task.assign.long: "tasks.assigned_to ला दिलेल्या WHO वर सेट करते आणि task.assigned जारी करते. कॉलम साफ करण्यासाठी आणि task.unassigned जारी करण्यासाठी रिक्त WHO द्या (किंवा वगळा) — task चा पुनर्प्राप्ती मार्ग ज्याचा claim करणारा agent पूर्ण न करता crash झाला. dev मधून मॅन्युअल move देखील assigned_to स्वयंचलितपणे साफ करतात."
