  cli.setup.short: "पहिल्या-रन setup picker चालवा (भाषा → preset → MCP harness)"
  cli.setup.long: |-
    okt setup हा post-install picker आहे जो curl|bash installer तुम्हाला सोडतो.

    तो भाषा निवड (CLI / TUI / agent-output), preset निवड आणि MCP-harness
    कॉन्फिगरेशन एका bubbletea program मध्ये चालवतो, नंतर okt() shell-rc
    wrapper लिहितो. निवडी पुन्हा पाहण्यासाठी --update सह पुन्हा चालवा.

    Headless / non-interactive shell जुळणारा env var भरतो ती प्रत्येक
    screen वगळते: OKT_CLI_LANG, OKT_TUI_LANG, OKT_AGENT_LANG, OKT_PRESET,
    OKT_HARNESSES.
  cli.setup.flag.update: "सध्याच्या मूल्यांसह picker पुन्हा चालवा (विद्यमान rc + omakiten.yaml विरुद्ध idempotent)"
  cli.setup.flag.cli-lang: "निवडलेला कोड सेट करून CLI-भाषा picker वगळा (OKT_CLI_LANG= सारखाच आकार)"
  cli.setup.flag.tui-lang: "निवडलेला कोड सेट करून TUI-भाषा picker वगळा (OKT_TUI_LANG= सारखाच आकार)"
  cli.setup.flag.agent-lang: "निवडलेले मुक्त-स्वरूप मूल्य सेट करून agent-output भाषा prompt वगळा"
  cli.setup.flag.preset: "निवडलेले preset नाव सेट करून preset picker वगळा (OKT_PRESET= सारखाच आकार)"
  cli.setup.flag.harnesses: "harness नावांच्या CSV सह harness multi-select वगळा (OKT_HARNESSES= सारखाच आकार)"
  cli.setup.flag.skip-wrapper: "okt() shell-rc wrapper block लिहू नका (वापरकर्ता dotfiles द्वारे त्यांच्या rc फाइल व्यवस्थापित करतो तेव्हा उपयुक्त)"
  cli.setup.flag.skip-harnesses: "harness input रिझॉल्व्ह करा परंतु `okt mcp setup` कॉल करू नका (shell tests + dry-run smoke check द्वारे वापरले)"
  cli.setup.status.preset_written: "=> सक्रिय workflow preset: %s (%s/.active)"
