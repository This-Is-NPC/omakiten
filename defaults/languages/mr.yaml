  cli.config.init.long: |-
    निवडलेल्या scope मध्ये मूळ असलेले standalone config इन्स्टॉल पेरून ठेवा.

      --scope global  →  paths.ConfigRoot() (किंवा --config चे parent).
                         अस्तित्वात असलेले user इन्स्टॉल; पुन्हा चालवणे idempotent आहे.

      --scope local   →  <cwd>/.omakiten (literal CWD, walk-up नाही).
                         संपूर्ण इन्स्टॉल — config/<preset>.yaml आणि प्रत्येक
                         entity फोल्डर — जेणेकरून runtime user-global layer सह
                         कोणत्याही merge शिवाय ते लोड करू शकते. walk-up रिझॉल्व्हर
                         यानंतरच्या repo मधील okt कॉलवर हे आपोआप उचलतो.

    वर्तन मॅट्रिक्स:
      - फाइल नाही              → atomic write.
      - समान preset, समान फाइल  → no_op:true (शांत यश).
      - वेगळा preset            → .active नवीन preset वर वळवतो.
      - छेडछाड केलेल्या shipped फाइल → --force शिवाय जतन.
      - --force                 → प्रत्येक एम्बेड केलेली shipped फाइल पुन्हा कॉपी करतो
                                  (skills, laws, personas, templates, themes,
                                  notifications, प्रत्येक preset yaml).
                                  custom/ subtree ला कधीही स्पर्श होत नाही.

    भाषा निवड:
      --cli-lang, --tui-lang, --agent-lang प्रत्येक surface साठी इंटरॅक्टिव्ह
      prompt वगळतात आणि मूल्य थेट पेरलेल्या omakiten.yaml च्या languages
      block मध्ये लिहितात. --cli-lang आणि --tui-lang bundle केलेल्या भाषा
      कोडशी जुळले पाहिजेत (en, pt-br, ...); --agent-lang मुक्त-स्वरूप आहे.
      flag न दिल्यास, init TTY वर prompt करते (किंवा stdin non-interactive
      असेल तर surface डीफॉल्टवर ठेवते).
  cli.config.path.long: |-
    सक्रिय config (किंवा निवडलेला layer) डॉटेड YAML की द्वारे चालवा
    आणि {key, value, path, source} दाखवा. --layer शिवाय रिझॉल्व्हर
    runtime जो इन्स्टॉल वापरेल तो निवडतो: सापडलेले .omakiten/
    असल्यास, अन्यथा user-global ConfigRoot.

    standalone मॉडेलमुळे merge नाही, त्यामुळे कोणत्याही की चे मूल्य
    एकाच इन्स्टॉलमधून येते. --layer lookup ला "global" किंवा "local"
    वर पिन करतो जेणेकरून caller विशिष्ट layer पडताळू शकेल (उदा.
    "हे user-global इन्स्टॉलमध्ये सेट आहे का जरी माझे repo स्थानिकरीत्या
    ओव्हरराइड करत असेल").
  cli.config.diff.long: |-
    दोन YAML config source ची तुलना करा आणि प्रत्येक भिन्न leaf साठी
    एक नोंद उत्सर्जित करा. प्रत्येक operand यापैकी एक आहे:
      global              - user-global सक्रिय yaml
      local               - CWD walk-up .omakiten/ मधील सक्रिय yaml
      local:<path>        - <path>/.omakiten/ मधील सक्रिय yaml
      <path/to/file.yaml> - डिस्कवरील कोणतीही yaml फाइल

    output नोंदी op = added | removed | changed आणि संबंधित बाजूचे
    मूल्ये वाहतात. map पुनरावर्ती उतरतात; list / scalar deep
    समानतेने तुलना करतात.
  cli.config.language.long: |-
    सक्रिय omakiten.yaml मधील config.languages.{cli,tui,agent_output}
    वाचा आणि लिहा. languages.cli आणि languages.tui languages/ अंतर्गत
    शोधलेल्या भाषा pack विरुद्ध वैध केले जातात; languages.agent_output
    मुक्त-स्वरूप आहे आणि MCP prompt composer ला जसेच्या तसे अग्रेषित होते.

    डीफॉल्ट लक्ष्य रिझॉल्व्ह केलेले omakiten.yaml आहे (repo-local
    .omakiten/ असल्यास, अन्यथा user-global ConfigRoot). set/reset वर
    --global वापरून repo-local उपस्थिती असली तरीही user-global
    फाइलवर write पिन करा.

    write BundleCache.Reload ट्रिगर करतो जेणेकरून यानंतरचे okt कॉल आणि
    दीर्घ-चालणारी tool (TUI, MCP server) नवीन निवड पाहतील. सध्याची
    CLI प्रक्रिया आणि आधीच चालत असलेला कोणताही CLI कॉल पूर्वलक्ष्यी
    अद्ययावत होत नाही; फक्त यानंतरचे कॉल बदल उचलतात.
  cli.config.language.set.long: |-
    उदाहरणे:
      okt config language set --cli pt-br
      okt config language set --tui en --agent "Português (Brasil)"
      okt config language set --agent "" --global

    --cli, --tui किंवा --agent पैकी किमान एक दिले पाहिजे. --cli आणि
    --tui languages/ अंतर्गत शोधलेल्या भाषा कोड विरुद्ध वैध होतात.
    --agent कोणतीही non-empty string स्वीकारतो (किंवा साफ करण्यासाठी "").
    --global write user-global omakiten.yaml वर पिन करतो.
  cli.mcp.install.long: "harness config फाइलवर Omakiten MCP server कॉन्फिगरेशन लिहिते (उदा. Claude Desktop किंवा OpenCode)."
  cli.workflow.orphan.long: |-
    preset स्विच किंवा omakiten.yaml संपादनानंतर ज्या workflow bucket कडे
    निर्देश करत होते परंतु ते आता अस्तित्वात नाहीत असे task orphan आहेत.
    डीफॉल्टनुसार ही कमांड migration plan छापते (कोणते task कोणत्या
    bucket ला rebind होतील) आणि non-zero बाहेर पडते जेणेकरून काहीही
    बदलले जात नाही.

    rebind लागू करण्यासाठी --confirm पास करा. प्रत्येक migrate केलेला
    task task.migrated event उत्सर्जित करतो ज्यात from/to/reason payload
    आहे. --dry-run --confirm शिवाय चालवण्यासारखेच आहे.
