  # TODO(translate): cli.setup.short
  cli.setup.short: "Run the first-run setup picker (language → preset → MCP harness)"
  # TODO(translate): cli.setup.long
  cli.setup.long: |-
    okt setup is the post-install picker the curl|bash installer drops you into.

    It walks language selection (CLI / TUI / agent-output), preset selection,
    and MCP-harness configuration in a single bubbletea program, then writes
    the okt() shell-rc wrapper. Re-run with --update to revisit choices.

    Headless / non-interactive shells skip every screen the matching env var
    fills: OKT_CLI_LANG, OKT_TUI_LANG, OKT_AGENT_LANG, OKT_PRESET, OKT_HARNESSES.
  # TODO(translate): cli.setup.flag.update
  cli.setup.flag.update: "re-run the picker with current values prefilled (idempotent against existing rc + omakiten.yaml)"
  # TODO(translate): cli.setup.flag.cli-lang
  cli.setup.flag.cli-lang: "skip the CLI-language picker by setting the chosen code (same shape as OKT_CLI_LANG=)"
  # TODO(translate): cli.setup.flag.tui-lang
  cli.setup.flag.tui-lang: "skip the TUI-language picker by setting the chosen code (same shape as OKT_TUI_LANG=)"
  # TODO(translate): cli.setup.flag.agent-lang
  cli.setup.flag.agent-lang: "skip the agent-output language prompt by setting the chosen free-form value"
  # TODO(translate): cli.setup.flag.preset
  cli.setup.flag.preset: "skip the preset picker by setting the chosen preset name (same shape as OKT_PRESET=)"
  # TODO(translate): cli.setup.flag.harnesses
  cli.setup.flag.harnesses: "skip the harness multi-select with a CSV of harness names (same shape as OKT_HARNESSES=)"
  # TODO(translate): cli.setup.flag.skip-wrapper
  cli.setup.flag.skip-wrapper: "do not write the okt() shell-rc wrapper block (useful when the user manages their rc files via dotfiles)"
  # TODO(translate): cli.setup.flag.skip-harnesses
  cli.setup.flag.skip-harnesses: "resolve harness inputs but do not invoke `okt mcp setup` (used by shell tests + dry-run smoke checks)"
