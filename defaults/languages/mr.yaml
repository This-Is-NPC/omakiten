# okt uninstall — in-binary counterpart of uninstall.sh / uninstall.ps1.
  cli.uninstall.short: "स्थापित okt binary आणि shell-rc wrapper काढा (डिफॉल्टनुसार data + config जतन)"
  cli.uninstall.long: |-
    installer ने $INSTALL_DIR मध्ये लिहिलेले binary काढते (डिफॉल्ट
    POSIX वर ~/.local/bin आणि Windows वर %LOCALAPPDATA%\Programs\okt) आणि
    प्रत्येक rc/profile लक्ष्यातून okt() wrapper ब्लॉक काढते.
    
    स्थानिक स्थिती --purge-data द्वारे
    स्पष्ट opt-out न केल्यास ($XDG_DATA_HOME/omakiten मधील SQLite DB) किंवा --purge-config
    ($XDG_CONFIG_HOME/omakiten मधील सक्रिय yaml प्रोफाइल + entity फोल्डर्स) जतन राहते.
    --purge हे दोन्हीसाठी shorthand आहे.
    
    TTY वर flags नसल्यास picker काय हटेल ते
    आकारासह दाखवते आणि प्रत्येक purge लक्ष्यास विचारते. --yes picker पूर्णपणे वगळते.
    
    स्वयंचलित backup नाही. purge आधी SQLite DB चा
    snapshot हवा असल्यास प्रथम `okt db backup` चालवा — uninstall हेतुपुरस्सर
    वापरकर्ता डेटा काढते; सुरक्षा जाळे standalone backup command द्वारे opt-in.
  cli.uninstall.flag.yes: "इंटरॅक्टिव्ह picker वगळा आणि resolved flag संच non-interactive लागू करा"
  cli.uninstall.flag.purge-data: "$XDG_DATA_HOME/omakiten देखील हटवा (SQLite DB + WAL/SHM) — अपरिवर्तनीय"
  cli.uninstall.flag.purge-config: "$XDG_CONFIG_HOME/omakiten देखील हटवा (सक्रिय yaml + entity फोल्डर्स) — अपरिवर्तनीय"
  cli.uninstall.flag.purge: "--purge-data + --purge-config साठी shorthand — अपरिवर्तनीय"
  cli.uninstall.picker.title: "okt अनइंस्टॉल करा"
  cli.uninstall.picker.hint: "↑/↓ नेव्हिगेट · enter टॉगल · y लागू · ctrl+c बाहेर"
  cli.uninstall.picker.warn: "हे परत करता येत नाही"
  cli.uninstall.picker.binary: "बायनरी  %s"
  cli.uninstall.picker.wrappers: "shell wrappers (rc/profile ब्लॉक)"
  cli.uninstall.picker.data: "डेटा dir  %s  (%s)"
  cli.uninstall.picker.config: "config निर्देशिका  %s  (%s)"
  cli.uninstall.picker.no_tty: "इंटरॅक्टिव्ह picker ला TTY हवा; headless uninstall साठी --yes (आणि ऐच्छिक --purge-*) द्या"
  cli.uninstall.picker.aborted: "uninstall रद्द; काहीही काढले नाही"

  # okt update — in-binary counterpart of the curl|bash installer for refresh.
  cli.update.short: "नवीनतम okt release आणा आणि स्थापित binary atomically बदला"
  cli.update.long: |-
    चालू binary चा मार्ग (os.Executable) शोधते, GitHub
    releases API कडून नवीनतम tag विचारते, जुळणारा asset डाउनलोड करते आणि
    डिस्कवरील binary atomically बदलते. swap नंतर सध्याची प्रक्रिया
    संपते; पुढील invocation नवीन आवृत्ती चालवते.
    
    --check `current=<v> latest=<v> action=<noop|upgrade>` प्रिंट करते आणि
    लिहित नसताना 0 ने बाहेर पडते. --yes non-interactive callers साठी पुष्टी वगळते.
  cli.update.flag.yes: "पुष्टी prompt वगळा आणि upgrade non-interactive लागू करा"
  cli.update.flag.check: "सध्याचे vs. नवीनतम अहवाल द्या आणि लिहित नसताना बाहेर पडा"
  cli.update.flag.skip_defaults: "update only the binary and skip shipped defaults refresh"
  cli.update.picker.title: "okt अपडेट करा"
  cli.update.picker.line: "सध्याचे=%s  →  नवीनतम=%s"
  cli.update.picker.hint: "y लागू · n रद्द · ctrl+c बाहेर"
  cli.update.picker.no_tty: "इंटरॅक्टिव्ह पुष्टीला TTY हवा; headless update साठी --yes किंवा dry-run अहवालासाठी --check द्या"
  cli.update.picker.aborted: "update रद्द; binary अपरिवर्तित"
