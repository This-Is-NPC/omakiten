# okt uninstall — in-binary counterpart of uninstall.sh / uninstall.ps1.
  cli.uninstall.short: "移除已安装的 okt 二进制和 shell-rc wrapper(默认保留数据与 config)"
  cli.uninstall.long: |-
    移除 installer 写入 $INSTALL_DIR 的二进制(默认
    POSIX 为 ~/.local/bin,Windows 为 %LOCALAPPDATA%\Programs\okt),并
    从每个 rc/profile 目标中剥离 okt() wrapper 块。
    
    除非通过 --purge-data 明确 opt-out,
    ($XDG_DATA_HOME/omakiten 下的 SQLite DB)或 --purge-config(位于
    $XDG_CONFIG_HOME/omakiten 的活跃 yaml 配置与 entity 文件夹),否则保留本地状态。
    --purge 是两者的简写。
    
    在 TTY 上无 flags 时,picker 会显示将被删除的内容及
    大小,并按 purge 目标逐项询问。--yes 会完全跳过 picker。
    
    无自动 backup。若要在 purge 前为 SQLite DB 做
    snapshot,请先运行 `okt db backup` — 卸载会按设计删除
    用户数据;安全网需通过 standalone backup 命令 opt-in。
  cli.uninstall.flag.yes: "跳过交互式 picker,非交互式应用已解析的 flag 集"
  cli.uninstall.flag.purge-data: "同时删除 $XDG_DATA_HOME/omakiten(SQLite DB + WAL/SHM)—不可逆"
  cli.uninstall.flag.purge-config: "同时删除 $XDG_CONFIG_HOME/omakiten(活跃 yaml + entity 文件夹)—不可逆"
  cli.uninstall.flag.purge: "--purge-data + --purge-config 的简写—不可逆"
  cli.uninstall.picker.title: "卸载 okt"
  cli.uninstall.picker.hint: "↑/↓ 导航 · enter 切换 · y 应用 · ctrl+c 退出"
  cli.uninstall.picker.warn: "此操作无法撤销"
  cli.uninstall.picker.binary: "binary  %s"
  cli.uninstall.picker.wrappers: "shell wrappers(rc/profile 块)"
  cli.uninstall.picker.data: "数据目录  %s  (%s)"
  cli.uninstall.picker.config: "config 目录  %s  (%s)"
  cli.uninstall.picker.no_tty: "交互式 picker 需要 TTY;请传入 --yes(以及可选的 --purge-*)以进行 headless 卸载"
  cli.uninstall.picker.aborted: "卸载已中止;未移除任何内容"

  # okt update — in-binary counterpart of the curl|bash installer for refresh.
  cli.update.short: "获取最新 okt release 并原子替换已安装的二进制"
  cli.update.long: |-
    检测正在运行的二进制路径(os.Executable),查询 GitHub
    releases API 获取最新 tag,下载匹配的 asset,并
    原子替换磁盘上的二进制。当前进程在 swap 后
    退出;下次调用将运行新版本。
    
    --check 打印 `current=<v> latest=<v> action=<noop|upgrade>` 并
    以 0 退出且不写入。--yes 为非交互调用跳过确认提示。
  cli.update.flag.yes: "跳过确认提示,非交互式应用升级"
