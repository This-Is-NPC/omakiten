  cli.setup.short: "运行安装后初始选择器(语言 → preset → MCP harness)"
  cli.setup.long: |-
    okt setup 是由 curl|bash 安装程序调用的安装后选择器。

    它在一个 bubbletea 程序中走完语言选择(CLI / TUI / agent 输出)、
    preset 选择和 MCP harness 配置,然后写入 shell rc 中的 okt() 包装器。
    使用 --update 重新运行以重新审视选择。

    Headless / 非交互式 shells 跳过每个匹配 env var 已填充的屏幕:
    OKT_CLI_LANG、OKT_TUI_LANG、OKT_AGENT_LANG、OKT_PRESET、OKT_HARNESSES。
  cli.setup.flag.update: "用当前值预填重新运行选择器(对现有 rc + omakiten.yaml 幂等)"
