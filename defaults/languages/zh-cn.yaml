  cli.config.init.long: |-
    在所选 scope 中创建一个独立的 config 安装。

      --scope global  →  paths.ConfigRoot()(或 --config 的父目录)。
                         现有用户安装;重复运行是幂等的。

      --scope local   →  <cwd>/.omakiten(字面 CWD,不向上遍历)。
                         完整安装 — config/<preset>.yaml 加上每个实体
                         文件夹 — 让 runtime 可以在不与 user-global
                         层合并的情况下加载它。向上遍历的解析器在仓库
                         内的后续 okt 调用中自动识别此安装。

    行为矩阵:
      - 文件缺失           → 原子写入。
      - 相同 preset、相同文件 → no_op:true(静默成功)。
      - 不同 preset       → 将 .active 翻转到新 preset。
      - 已篡改的 shipped 文件 → 除非使用 --force 否则保留。
      - --force          → 重新复制每个嵌入的 shipped 文件
                            (skills、laws、personas、templates、themes、
                            notifications、每个 preset yaml)。
                            custom/ 子树永远不会被触及。

    语言选择:
      --cli-lang、--tui-lang、--agent-lang 跳过每个 surface 的交互式
      提示,并将值直接写入种子化 omakiten.yaml 的 languages 块。
      --cli-lang 和 --tui-lang 必须匹配 bundled 语言代码
      (en、pt-br、es、fr、de、ru、zh-cn、...);--agent-lang 是自由
      形式。如果未提供标志,init 在 TTY 上提示(或当 stdin 非交互时
      让 surface 保持默认值)。
  cli.config.path.long: |-
    用点分的 YAML 键遍历活动 config(或所选层)并报告
    {key, value, path, source}。如果没有 --layer,解析器选择 runtime
    会使用的安装:存在时为发现的 .omakiten/,否则为 user-global ConfigRoot。

    独立模型意味着没有合并,因此任何键的值都恰好来自一个安装。
    --layer 将查找固定到 "global" 或 "local",以便调用者可以验证特定
    层而非解析后的层(例如"即使我的仓库在本地覆盖,它在 user-global
    安装中是否设置")。
  cli.config.diff.long: |-
    比较两个 YAML config 源,并为每个不同的叶子节点输出一个条目。
    每个操作数是以下之一:
      global              - user-global 活动 yaml
      local               - CWD 向上遍历 .omakiten/ 中的活动 yaml
      local:<path>        - <path>/.omakiten/ 中的活动 yaml
      <path/to/file.yaml> - 磁盘上的任意 yaml 文件

    输出条目带有 op = added | removed | changed 加上相关侧值。
    Maps 递归下降;列表 / 标量按深度相等比较。
  cli.config.language.long: |-
    读取和写入活动 omakiten.yaml 中的 config.languages.{cli,tui,agent_output}。
    languages.cli 和 languages.tui 会针对 languages/ 下发现的 language
    packs 进行验证;languages.agent_output 是自由形式,逐字转发到
    MCP prompt 合成器。

    默认目标是解析后的 omakiten.yaml(存在时为 repo-local .omakiten/,
    否则为 user-global ConfigRoot)。在 set/reset 上使用 --global 将
    写入固定到 user-global 文件,无论是否存在 repo-local。

    写入触发 BundleCache.Reload,以便后续的 okt 调用和长时间运行的
    工具(TUI、MCP 服务器)观察到新的选择。当前 CLI 进程和任何已在
    运行的 CLI 调用不会被追溯更新;只有后续调用会获取更改。
  cli.config.language.set.long: |-
    示例:
      okt config language set --cli zh-cn
      okt config language set --tui en --agent "简体中文"
      okt config language set --agent "" --global

    必须提供 --cli、--tui 或 --agent 中的至少一个。--cli 和 --tui
    针对 languages/ 下发现的语言代码进行验证。--agent 接受任何非空
    字符串(或 "" 以清除)。--global 将写入固定到 user-global 的
    omakiten.yaml。
  cli.mcp.install.long: "将 Omakiten MCP 服务器配置写入 harness config 文件(例如 Claude Desktop 或 OpenCode)。"
  cli.workflow.orphan.long: |-
    在 preset 切换或 omakiten.yaml 编辑后,指向不再存在的 workflow
    bucket 的 tasks 是孤儿。默认情况下,此命令打印迁移计划(哪些
    tasks 将重新绑定到哪些 buckets)并以非零状态退出,不进行任何
    更改。

    传递 --confirm 以应用重新绑定。每个迁移的 task 都会发出带有
    from/to/reason 载荷的 task.migrated 事件。--dry-run 等同于不带
    --confirm 运行。
