  cli.root.long: |-
    okt 通过命令行和 TUI 驱动 Omakiten。

    路径解析(从高到低优先级):
      1. --config / --db 标志
      2. $OMAKITEN_HOME — 将 config 固定到 <HOME>/config/<active>.yaml 并将数据固定到 <HOME>/data/omakiten.db
      3. $XDG_CONFIG_HOME / $XDG_DATA_HOME
      4. ~/.config/omakiten 和 ~/.local/share/omakiten
