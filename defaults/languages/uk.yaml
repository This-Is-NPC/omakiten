  cli.setup.short: "Запустити picker першого налаштування (мова → preset → MCP harness)"
  cli.setup.long: |-
    okt setup — це picker після інсталяції, у який curl|bash installer
    тебе кидає.

    Він проходить вибір мови (CLI / TUI / agent-output), вибір preset
    та налаштування MCP-harness в одній програмі bubbletea, потім
    записує shell-rc-обгортку okt(). Перезапусти з --update, щоб
    переглянути вибір.

    Headless / неінтерактивні shells пропускають кожен екран, який
    заповнює відповідна змінна середовища: OKT_CLI_LANG, OKT_TUI_LANG,
    OKT_AGENT_LANG, OKT_PRESET, OKT_HARNESSES.
  cli.setup.flag.update: "перезапустити picker з попередньо заповненими поточними значеннями (ідемпотентно проти існуючого rc + omakiten.yaml)"
  cli.setup.flag.cli-lang: "пропустити picker мови CLI задавши обраний код (та сама форма, що OKT_CLI_LANG=)"
  cli.setup.flag.tui-lang: "пропустити picker мови TUI задавши обраний код (та сама форма, що OKT_TUI_LANG=)"
  cli.setup.flag.agent-lang: "пропустити запит мови agent-output задавши обране вільне значення"
