  cli.config.init.long: |-
    Розгортає окрему інсталяцію config, вкорінену у вибраному scope.

      --scope global  →  paths.ConfigRoot() (або батько --config).
                         Існуюча користувацька інсталяція; повторний запуск ідемпотентний.

      --scope local   →  <cwd>/.omakiten (буквальний CWD, без walk-up).
                         Повна інсталяція — config/<preset>.yaml плюс кожна
                         тека сутностей — щоб runtime міг завантажити її без
                         злиття з глобальним шаром користувача. Walk-up
                         resolver автоматично підхоплює це на наступних
                         викликах okt зсередини репозиторію.

    Матриця поведінки:
      - Файл відсутній             → атомарний запис.
      - Той самий preset, ті самі файли → no_op:true (тихий успіх).
      - Інший preset               → перемикає .active на новий preset.
      - Змінені shipped-файли      → зберігаються, якщо немає --force.
      - --force                    → перекопіює кожен вбудований shipped-файл
                                     (skills, laws, personas, templates, themes,
                                     notifications, кожен yaml preset).
                                     Піддерева custom/ ніколи не чіпаються.

    Вибір мови:
      --cli-lang, --tui-lang, --agent-lang пропускають інтерактивні запити
      для кожного surface і записують значення прямо у блок languages
      посіяного omakiten.yaml. --cli-lang і --tui-lang мають збігатися з
      кодом мови bundled (en, pt-br, ...); --agent-lang довільний. Якщо
      прапорець не задано, init робить запит у TTY (або залишає surface
      із дефолтом, коли stdin не інтерактивний).
  cli.config.path.long: |-
    Проходить активний config (або вибраний шар) пунктирним YAML-ключем
    і повертає {key, value, path, source}. Без --layer resolver обирає
    інсталяцію, яку використовував би runtime: виявлений .omakiten/, якщо
    присутній, інакше глобальний ConfigRoot користувача.

    Standalone-модель означає відсутність злиття, тому значення будь-якого
    ключа походить рівно з однієї інсталяції. --layer фіксує пошук на
    "global" або "local", щоб caller перевірив конкретний шар, а не
    розв'язаний (наприклад, "чи задано це у глобальній інсталяції,
    хоча мій репозиторій локально перекриває").
  cli.config.diff.long: |-
    Порівнює два YAML-джерела config і видає один запис на кожне
    розбіжне листя. Кожен операнд — один із:
      global              - активний yaml глобальної інсталяції
      local               - активний yaml у CWD walk-up .omakiten/
      local:<path>        - активний yaml у <path>/.omakiten/
      <path/to/file.yaml> - будь-який yaml-файл на диску

    Записи виходу несуть op = added | removed | changed плюс відповідні
    значення сторін. Maps опускаються рекурсивно; lists / scalars
    порівнюються за глибокою рівністю.
  cli.config.language.long: |-
    Читає і записує config.languages.{cli,tui,agent_output} в активному
    omakiten.yaml. languages.cli і languages.tui валідовуються проти
    language packs, виявлених під languages/; languages.agent_output —
    довільний і пересилається без змін у MCP prompt composer.

    Ціль за замовчуванням — розв'язаний omakiten.yaml (репо-локальний
    .omakiten/, якщо присутній, інакше глобальний ConfigRoot
    користувача). Використовуйте --global на set/reset, щоб зафіксувати
    запис у глобальний файл користувача незалежно від наявності репо-локального.

    Записи запускають BundleCache.Reload, тому наступні виклики okt і
    тривалі tools (TUI, MCP server) бачать новий вибір. Поточний CLI-процес
    і будь-який уже запущений виклик CLI не оновлюються ретроактивно;
    лише наступні виклики підхоплюють зміну.
  cli.config.language.set.long: |-
    Приклади:
      okt config language set --cli pt-br
      okt config language set --tui en --agent "Português (Brasil)"
      okt config language set --agent "" --global

    Має бути задано хоча б одне з --cli, --tui або --agent. --cli і
    --tui валідовуються проти кодів мов, виявлених під languages/.
    --agent приймає будь-який непорожній рядок (або "" для очищення).
    --global фіксує запис у глобальний omakiten.yaml користувача.
  cli.mcp.install.long: "Записує конфігурацію MCP server Omakiten у файл config harness (наприклад, Claude Desktop або OpenCode)."
  cli.workflow.orphan.long: |-
    Tasks, що вказували на bucket workflow, який більше не існує після
    зміни preset або редагування omakiten.yaml, стають orphans. За
    замовчуванням ця команда друкує план міграції (які tasks перепривʼяжуться
    до якого bucket) і виходить з ненульовим кодом, тому нічого не мутується.

    Передайте --confirm, щоб застосувати перепривʼязку. Кожен мігрований
    task видає подію task.migrated з payload from/to/reason. --dry-run
    еквівалентний запуску без --confirm.
