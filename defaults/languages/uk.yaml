  cli.root.long: |-
    okt керує Omakiten з командного рядка та TUI.

    Розв'язання шляхів (від найвищого до найнижчого пріоритету):
      1. прапорці --config / --db
      2. $OMAKITEN_HOME — фіксує config у <HOME>/config/<active>.yaml і дані у <HOME>/data/omakiten.db
      3. $XDG_CONFIG_HOME / $XDG_DATA_HOME
      4. ~/.config/omakiten та ~/.local/share/omakiten
