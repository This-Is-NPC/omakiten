  # okt update — in-binary counterpart of the curl|bash installer for refresh.
  cli.update.short: "Pobiera najnowszy release okt i atomowo podmienia zainstalowany binary"
  cli.update.long: |-
    Wykrywa ścieżkę działającego binary (os.Executable), odpytuje API
    releases GitHub o najnowszy tag, pobiera pasujący asset i
    atomowo zastępuje binary na dysku. Bieżący proces kończy się
    po swap; następne wywołanie uruchamia nową wersję.
    
    --check wypisuje `current=<v> latest=<v> action=<noop|upgrade>` i
    kończy z 0 bez zapisu. --yes pomija potwierdzenie dla
    wywołań nieinteraktywnych.
  cli.update.flag.yes: "pomiń potwierdzenie i zastosuj upgrade w trybie nieinteraktywnym"
  cli.update.flag.check: "raportuj bieżący vs. najnowszy i zakończ bez zapisu"
  cli.update.flag.skip_defaults: "update only the binary and skip shipped defaults refresh"
