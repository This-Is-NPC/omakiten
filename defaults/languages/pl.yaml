  # guard.* — hint strings surfaced in guard.violated payloads.
  guard.wave_gate.hint: "Poczekaj na zakończenie poprzedniej wave — taski z wcześniejszych waves w tym samym plan muszą osiągnąć Done, zanim ta się rozpocznie."
  guard.subtasks_complete.hint: "Przenieś każdą bezpośrednią sub-task do final bucket przed promocją parent."
  # guard.common.* — hints shared across presets. Per-preset override via
  # the preset-scoped namespace (guard.<preset>.<stage>.<rule>...) when copy diverges.
  guard.common.archive.comments_tagged.documentation.hint: "Dodaj komentarz #documentation podsumowujący, co zostało dostarczone, przed archiwizacją."
  guard.common.planning.comments_tagged.5w2h.hint: "Dodaj komentarz #5w2h przechodzący przez siedem pytań elicytacji (Co / Dlaczego / Kto / Kiedy / Gdzie / Jak / Ile), zanim rozpocznie się planning."
  guard.common.planning.comments_tagged.acceptance.hint: "Dodaj komentarz #acceptance z testowalnymi kryteriami, które zamawiający i recenzent mogą zweryfikować."
  guard.common.dev.comments_tagged.self_branch.hint: "Dodaj komentarz #self-branch nazywający branch i ścieżkę roboczą."
  guard.common.dev.blockers_in.hint: "Każdy blocker musi być w Done lub Documentation, zanim rozpocznie się development."
  guard.common.done.comments_tagged.documentation.hint: "Dodaj komentarz #documentation podsumowujący merged commits, powiązane tagi, i potwierdzenie, że task został zrecenzowany i poprawnie otagowany."

  # guard.omakase.* — preset-scoped hints for the Omakase workflow.
  guard.omakase.dev.comments_tagged.self_branch.hint: "Przed rozpoczęciem utwórz dedykowaną feature branch lub git worktree dla tej taska i dodaj otagowany #self-branch komentarz dokumentujący nazwę brancha i ścieżkę roboczą."
  guard.omakase.dev.blockers_in.hint: "Każdy blocker musi być w Done, zanim rozpocznie się development — najpierw skończ blockery, aby utrzymać WIP pod kontrolą."
  guard.omakase.review.comments_tagged.resume.hint: "Dodaj otagowany #resume komentarz podsumowujący to, co zostało zaimplementowane, podjęte decyzje, i otwarte pytania, zanim poprosisz o review."
  guard.omakase.review.comments_tagged.tests_passing.hint: "Dodaj komentarz #tests-passing z komendą testową, fragmentem outputu, i czasem trwania — recenzent musi móc odtworzyć dowód."
  guard.omakase.done.comments_tagged.documentation.hint: "Dodaj otagowany #documentation komentarz podsumowujący: merged commits (commit IDs), powiązane tagi (kebab-case), i potwierdzenie, że task został zrecenzowany i poprawnie otagowany."

  # guard.izakaya.* — preset-scoped hints for the Izakaya workflow.
  guard.izakaya.dev.comments_tagged.hypothesis.hint: "Napisz pytanie, na które odpowiada ten spike — załóż komentarz #hypothesis z pytaniem, dlaczego jest ważne, falsyfikowalnym sygnałem, i time-boxem."

  # guard.kaiseki.* — preset-scoped hints for the Kaiseki workflow.
  guard.kaiseki.delete.comments_tagged.peer_review.hint: "Dodaj #peer-review zatwierdzający usunięcie, zanim task zostanie usunięty."
  guard.kaiseki.planning.comments_tagged.requirements.hint: "Dodaj komentarz #requirements z user story; zamawiający podpisuje się pod nim, zanim rozpocznie się planning."
  guard.kaiseki.dev.comments_tagged.design.hint: "Dodaj komentarz #design linkujący design doc, decision record, lub RFC, który ujmuje podejście, zanim wleci kod."
  guard.kaiseki.review.comments_tagged.resume.hint: "Dodaj handoff #resume podsumowujący to, co zostało zaimplementowane, podjęte decyzje, i otwarte pytania przed review."
  guard.kaiseki.review.comments_tagged.tests_passing.hint: "Dodaj komentarz #tests-passing z komendą testową, fragmentem outputu, i czasem trwania."
  guard.kaiseki.docs.comments_tagged.peer_review.hint: "Dodaj komentarz #peer-review od niezależnego recenzenta (nie autora) z werdyktem i zakresem zatwierdzenia."

  # guard.shokunin.* — preset-scoped hints for the Shokunin workflow.
  guard.shokunin.archive.comments_tagged.documentation.hint: "Dodaj #documentation przed archiwizacją pracy shokunin."
  guard.shokunin.archive.comments_tagged.lessons_learned.hint: "Dodaj #lessons-learned podsumowujące, co zadziałało / co nie, przed archiwizacją."
  guard.shokunin.delete.comments_tagged.peer_review.hint: "Dodaj #peer-review przed usunięciem pracy shokunin."
  guard.shokunin.unarchive.comments_tagged.peer_review.hint: "Dodaj #peer-review zatwierdzający ponowne otwarcie przed odarchiwizacją."
  guard.shokunin.planning.comments_tagged.requirements.hint: "Dodaj komentarz #requirements z user story i sygnałami akceptacji, zanim rozpocznie się planning."
  guard.shokunin.dev.comments_tagged.pre_mortem.hint: "Dodaj komentarz #pre-mortem nazywający główne tryby awarii, sygnały detekcji, i mitygacje, zanim wleci kod."
  guard.shokunin.dev.comments_tagged.risk_assessment.hint: "Dodaj #risk-assessment nazywające macierz ryzyka, blast radius, wpływ na SLO, i zaakceptowane ryzyko rezydualne."
  guard.shokunin.review.comments_tagged.resume.hint: "Dodaj handoff #resume podsumowujący to, co zostało zaimplementowane, decyzje, i otwarte pytania."
  guard.shokunin.review.comments_tagged.tests_passing.hint: "Dodaj #tests-passing z deltą coverage'u, typami testów, i sprawdzeniem regresji wydajności."
  guard.shokunin.review.comments_tagged.rollback_plan.hint: "Dodaj #rollback-plan z krokami revert, walidacją po rollbacku, i planem komunikacji przed review."
  guard.shokunin.docs.comments_tagged.peer_review.hint: "Dodaj ≥ 2 odrębne komentarze #peer-review od niezależnych recenzentów (nie autora). Każdy zawiera werdykt, zakres zatwierdzenia, i checklistę zrecenzowanych artefaktów."
  guard.shokunin.done.comments_tagged.lessons_learned.hint: "Dodaj komentarz #lessons-learned nazywający, co zadziałało / co nie, i wszelkie proponowane zmiany procesu."
