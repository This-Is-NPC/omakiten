# okt uninstall — in-binary counterpart of uninstall.sh / uninstall.ps1.
  cli.uninstall.short: "Usuwa zainstalowany binary okt i wrapper shell-rc (dane + config domyślnie zachowane)"
  cli.uninstall.long: |-
    Usuwa binary zapisany przez installer w $INSTALL_DIR (domyślnie
    ~/.local/bin na POSIX i %LOCALAPPDATA%\Programs\okt na Windows) i
    usuwa blok wrapper okt() z każdego celu rc/profile.
    
    Stan lokalny jest zachowany, chyba że wyraźnie opt-out via --purge-data
    (SQLite DB w $XDG_DATA_HOME/omakiten) lub --purge-config (aktywny
    profil yaml + foldery entity w $XDG_CONFIG_HOME/omakiten).
    --purge to skrót dla obu.
    
    Bez flag na TTY picker pokazuje, co zostałoby usunięte wraz z
    rozmiarami i pyta per cel purge. --yes pomija picker całkowicie.
    
    Brak automatycznego backupu. Uruchom `okt db backup` wcześniej, jeśli chcesz
    snapshot SQLite DB przed purge — deinstalacja celowo usuwa
    dane użytkownika; siatka bezpieczeństwa jest opt-in via
    standalone polecenie backup.
  cli.uninstall.flag.yes: "pomiń interaktywny picker i zastosuj rozwiązany zestaw flag w trybie nieinteraktywnym"
  cli.uninstall.flag.purge-data: "usuwa też $XDG_DATA_HOME/omakiten (SQLite DB + WAL/SHM) — nieodwracalne"
  cli.uninstall.flag.purge-config: "usuwa też $XDG_CONFIG_HOME/omakiten (aktywny yaml + foldery entity) — nieodwracalne"
  cli.uninstall.flag.purge: "skrót dla --purge-data + --purge-config — nieodwracalne"
  cli.uninstall.picker.title: "Odinstaluj okt"
  cli.uninstall.picker.hint: "↑/↓ nawigacja · enter przełącz · y zastosuj · ctrl+c wyjście"
