  cli.setup.short: "Uruchom picker pierwszego uruchomienia (język → preset → harness CLI)"
  cli.setup.long: |-
    okt setup to picker po instalacji, do którego wrzuca cię instalator curl|bash.

    Prowadzi przez wybór języka (CLI / TUI / wyjście agent), wybór preset
    oraz konfigurację harness CLI w pojedynczym programie bubbletea, a następnie
    zapisuje wrapper okt() do shell-rc. Uruchom ponownie z --update, aby
    powrócić do wyborów.

    Powłoki bezgłowe / nieinteraktywne pomijają każdy ekran, który wypełnia
    pasująca zmienna środowiskowa: OKT_CLI_LANG, OKT_TUI_LANG, OKT_AGENT_LANG,
    OKT_PRESET, OKT_HARNESSES.
  cli.setup.flag.update: "uruchom picker ponownie z bieżącymi wartościami wypełnionymi z góry (idempotentne wobec istniejącego rc + omakiten.yaml)"
  cli.setup.flag.cli-lang: "pomiń picker języka CLI ustawiając wybrany kod (taki sam kształt jak OKT_CLI_LANG=)"
