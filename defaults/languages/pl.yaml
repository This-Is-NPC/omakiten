  cli.config.init.long: |-
    Zaszczep samodzielną instalację config zakorzenioną w wybranym scope.

      --scope global  →  paths.ConfigRoot() (lub rodzic --config).
                         Istniejąca instalacja użytkownika; ponowne uruchomienie jest idempotentne.

      --scope local   →  <cwd>/.omakiten (dosłowny CWD, bez walk-up).
                         Kompletna instalacja — config/<preset>.yaml plus każdy
                         folder encji — aby runtime mógł ją załadować bez żadnego
                         scalania z warstwą user-global. Resolver walk-up
                         wykrywa to automatycznie przy kolejnych wywołaniach okt
                         z wnętrza repo.

    Macierz zachowań:
      - Brak pliku              → atomowy zapis.
      - Ten sam preset, te same pliki → no_op:true (cichy sukces).
      - Inny preset             → przełącza .active na nowy preset.
      - Zmienione pliki dostarczane → zachowane, chyba że --force.
      - --force                 → ponownie kopiuje każdy osadzony dostarczany plik
                                  (skills, laws, personas, templates, themes,
                                  notifications, każdy yaml preset).
                                  Poddrzewa custom/ nigdy nie są dotykane.

    Wybór języka:
      --cli-lang, --tui-lang, --agent-lang pomijają interaktywne prompty
      dla każdej powierzchni i zapisują wartość bezpośrednio w bloku
      languages zaszczepionego omakiten.yaml. --cli-lang i --tui-lang muszą
      odpowiadać dołączonemu kodowi języka (en, pt-br, ...); --agent-lang
      jest dowolny. Gdy nie podano flagi, init pyta na TTY (lub zostawia
      powierzchnię na wartości domyślnej, gdy stdin jest nieinteraktywny).
  cli.config.path.long: |-
    Przejdź po aktywnym config (lub wybranej warstwie) kropkowanym kluczem YAML
    i zgłoś {key, value, path, source}. Bez --layer resolver wybiera instalację,
    której użyłby runtime: wykryte .omakiten/ jeśli jest obecne, w przeciwnym
    razie user-global ConfigRoot.

    Model samodzielny oznacza brak scalania, więc wartość przy dowolnym kluczu
    pochodzi z dokładnie jednej instalacji. --layer przypina wyszukiwanie do
    "global" lub "local", aby wywołujący mogli zweryfikować konkretną warstwę
    zamiast tej rozwiązanej (np. "czy jest to ustawione w instalacji user-global
    nawet jeśli moje repo nadpisuje to lokalnie").
  cli.config.diff.long: |-
    Porównaj dwa źródła config YAML i wypisz jeden wpis na rozbieżny liść.
    Każdy operand jest jednym z:
      global              - aktywny yaml user-global
      local               - aktywny yaml wewnątrz walk-up CWD .omakiten/
      local:<path>        - aktywny yaml wewnątrz <path>/.omakiten/
      <path/to/file.yaml> - dowolny plik yaml na dysku

    Wpisy wyjścia niosą op = added | removed | changed plus odpowiednie
    wartości stron. Mapy schodzą rekurencyjnie; listy / skalary porównywane
    przez głęboką równość.
  cli.config.language.long: |-
    Odczytuj i zapisuj config.languages.{cli,tui,agent_output} w aktywnym
    omakiten.yaml. languages.cli oraz languages.tui są walidowane względem
    paczek językowych wykrytych pod languages/; languages.agent_output jest
    dowolny i przekazywany dosłownie do kompozytora promptów CLI.

    Domyślnym celem jest rozwiązany omakiten.yaml (repo-local .omakiten/
    jeśli jest obecne, w przeciwnym razie user-global ConfigRoot). Użyj
    --global przy set/reset, aby przypiąć zapis do pliku user-global
    niezależnie od obecności repo-local.

    Zapisy wywołują BundleCache.Reload, więc kolejne wywołania okt oraz
    długo działające narzędzia (TUI, serwer CLI) widzą nowy wybór. Bieżący
    proces CLI oraz dowolne już działające wywołanie CLI nie są aktualizowane
    retroaktywnie; tylko kolejne wywołania podchwytują zmianę.
  cli.config.language.set.long: |-
    Przykłady:
      okt config language set --cli pt-br
      okt config language set --tui en --agent "Português (Brasil)"
      okt config language set --agent "" --global

    Co najmniej jeden z --cli, --tui lub --agent musi zostać podany. --cli
    i --tui walidują względem kodów językowych wykrytych pod languages/.
    --agent przyjmuje dowolny niepusty ciąg (lub "" aby wyczyścić). --global
    przypina zapis do user-global omakiten.yaml.
  cli.workflow.orphan.long: |-
    Tasks wskazujące na bucket workflow, który już nie istnieje po przełączeniu
    preset lub edycji omakiten.yaml, są osierocone. Domyślnie ta komenda
    wypisuje plan migracji (które tasks zostałyby przepięte do których bucket)
    i wychodzi z kodem niezerowym, aby nic nie zmutować.

    Przekaż --confirm, aby zastosować przepięcie. Każdy zmigrowany task emituje
    zdarzenie task.migrated z ładunkiem from/to/reason. --dry-run jest
    równoważne uruchomieniu bez --confirm.
