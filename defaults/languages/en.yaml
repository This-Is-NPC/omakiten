  # guard.* — hint strings surfaced in guard.violated payloads. Configurable
  # via the preset's `hint:` field; presets reference these keys through
  # `${{intl:guard.<rule>.hint}}` substitution.
  guard.wave_gate.hint: "Wait for the previous wave to finish — earlier-wave tasks in the same plan must reach Done before this one starts."
  # guard.common.* — hints shared across presets. Per-preset override via
  # the preset-scoped namespace (guard.<preset>.<stage>.<rule>...) when copy diverges.
  guard.common.archive.comments_tagged.documentation.hint: "Add a #documentation comment summarizing what shipped before archiving."
  guard.common.planning.comments_tagged.5w2h.hint: "Add a #5w2h comment walking through the seven elicitation questions (What / Why / Who / When / Where / How / How much) before planning starts."
  guard.common.planning.comments_tagged.acceptance.hint: "Add a #acceptance comment with testable criteria the requester and reviewer can verify."
  guard.common.dev.comments_tagged.self_branch.hint: "Add a #self-branch comment naming the branch and working path."
  guard.common.dev.blockers_in.hint: "Every blocker must be in Done or Documentation before development starts."
  guard.common.done.comments_tagged.documentation.hint: "Add a #documentation comment summarizing commits merged, related tags, and confirmation that the task has been reviewed and properly tagged."

