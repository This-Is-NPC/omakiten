  # okt update — in-binary counterpart of the curl|bash installer for refresh.
  cli.update.short: "Загружает последний release okt и атомарно заменяет установленный binary"
  cli.update.long: |-
    Определяет путь работающего binary (os.Executable), запрашивает GitHub
    releases API о последнем tag, скачивает соответствующий asset и
    атомарно заменяет binary на диске. Текущий процесс завершается
    после swap; следующий вызов запускает новую версию.
    
    --check печатает `current=<v> latest=<v> action=<noop|upgrade>` и
    выходит с 0 без записи. --yes пропускает подтверждение для
    неинтерактивных вызовов.
