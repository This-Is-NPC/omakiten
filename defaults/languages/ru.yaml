# okt uninstall — in-binary counterpart of uninstall.sh / uninstall.ps1.
  cli.uninstall.short: "Удаляет установленный binary okt и shell-rc wrapper (данные + config сохраняются по умолчанию)"
  cli.uninstall.long: |-
    Удаляет binary, который installer записал в $INSTALL_DIR (по умолчанию
    ~/.local/bin на POSIX и %LOCALAPPDATA%\Programs\okt на Windows), и
    убирает блок wrapper okt() из каждой цели rc/profile.
    
    Локальное состояние сохраняется, если явно не opt-out через --purge-data
    (SQLite DB в $XDG_DATA_HOME/omakiten) или --purge-config (активный
    yaml-профиль + папки entity в $XDG_CONFIG_HOME/omakiten).
    --purge — сокращение для обоих.
    
    Без flags на TTY picker показывает, что будет удалено, с
    размерами и спрашивает по каждой цели purge. --yes полностью пропускает picker.
    
    Автоматического backup нет. Сначала выполните `okt db backup`, если нужен
    snapshot SQLite DB перед purge — деинсталляция намеренно удаляет
    пользовательские данные; страховка opt-in через
    standalone команду backup.
  cli.uninstall.flag.yes: "пропустить интерактивный picker и применить resolved набор flags неинтерактивно"
  cli.uninstall.flag.purge-data: "также удалить $XDG_DATA_HOME/omakiten (SQLite DB + WAL/SHM) — необратимо"
  cli.uninstall.flag.purge-config: "также удалить $XDG_CONFIG_HOME/omakiten (активный yaml + папки entity) — необратимо"
  cli.uninstall.flag.purge: "сокращение для --purge-data + --purge-config — необратимо"
  cli.uninstall.picker.title: "Удалить okt"
  cli.uninstall.picker.hint: "↑/↓ навигация · enter переключить · y применить · ctrl+c выход"
  cli.uninstall.picker.warn: "ЭТО НЕЛЬЗЯ ОТМЕНИТЬ"
  cli.uninstall.picker.binary: "binary  %s"
  cli.uninstall.picker.wrappers: "shell wrappers (блоки rc/profile)"
  cli.uninstall.picker.data: "каталог данных  %s  (%s)"
  cli.uninstall.picker.config: "каталог config  %s  (%s)"
  cli.uninstall.picker.no_tty: "интерактивный picker требует TTY; передайте --yes (плюс опциональные --purge-*) для headless деинсталляции"
  cli.uninstall.picker.aborted: "деинсталляция прервана; ничего не удалено"

  # okt update — in-binary counterpart of the curl|bash installer for refresh.
  cli.update.short: "Загружает последний release okt и атомарно заменяет установленный binary"
  cli.update.long: |-
    Определяет путь работающего binary (os.Executable), запрашивает GitHub
    releases API о последнем tag, скачивает соответствующий asset и
    атомарно заменяет binary на диске. Текущий процесс завершается
    после swap; следующий вызов запускает новую версию.
    
    --check печатает `current=<v> latest=<v> action=<noop|upgrade>` и
    выходит с 0 без записи. --yes пропускает подтверждение для
    неинтерактивных вызовов.
  cli.update.flag.yes: "пропустить подтверждение и применить upgrade неинтерактивно"
  cli.update.flag.check: "сообщить текущий vs. последний и выйти без записи"
  cli.update.picker.title: "Обновить okt"
  cli.update.picker.line: "current=%s  →  latest=%s"
  cli.update.picker.hint: "y применить · n отмена · ctrl+c выход"
  cli.update.picker.no_tty: "интерактивное подтверждение требует TTY; передайте --yes для headless update или --check для dry-run отчёта"
  cli.update.picker.aborted: "update прерван; binary без изменений"
