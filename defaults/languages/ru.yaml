  cli.setup.short: "Запустить начальный селектор после установки (язык → preset → skill destination)"
  cli.setup.long: |-
    okt setup — это селектор после установки, вызываемый инсталлятором
    curl|bash.

    Он проходит выбор языка (CLI / TUI / вывод агента), выбор preset и
    настройку skill destination в одной программе bubbletea, затем записывает
    обёртку okt() в shell rc. Перезапустите с --update для пересмотра.

    Неинтерактивные shells пропускают каждый экран, чья переменная
    окружения задана: OKT_CLI_LANG, OKT_TUI_LANG, OKT_AGENT_LANG,
    OKT_PRESET, OKT_HARNESSES.
  cli.setup.flag.update: "перезапустить селектор с текущими значениями как умолчанием (идемпотентно к существующим rc + omakiten.yaml)"
  cli.setup.flag.cli-lang: "пропустить селектор языка CLI задав выбранный код (та же форма что OKT_CLI_LANG=)"
  cli.setup.flag.tui-lang: "пропустить селектор языка TUI задав выбранный код (та же форма что OKT_TUI_LANG=)"
  cli.setup.flag.agent-lang: "пропустить prompt языка вывода агента задав свободное выбранное значение"
  cli.setup.flag.preset: "пропустить селектор preset задав имя preset (та же форма что OKT_PRESET=)"
  cli.setup.flag.harnesses: "Skill destinations: agents, claude-code, or 0 to skip"
  cli.setup.flag.skip-wrapper: "не записывать блок обёртки okt() в shell rc (полезно когда пользователь управляет rc через dotfiles)"
  cli.setup.flag.skip-harnesses: "Skip installing the integration skill"
