  # the preset-scoped namespace (guard.<preset>.<stage>.<rule>...) when copy diverges.
  guard.common.archive.comments_tagged.documentation.hint: "Добавьте комментарий #documentation, резюмирующий, что было поставлено, перед архивированием."
  guard.common.planning.comments_tagged.5w2h.hint: "Добавьте комментарий #5w2h, проходящий по семи вопросам элиситации (Что / Почему / Кто / Когда / Где / Как / Сколько), до начала planning."
  guard.common.planning.comments_tagged.acceptance.hint: "Добавьте комментарий #acceptance с тестируемыми критериями, которые заказчик и ревьюер могут проверить."
  guard.common.dev.comments_tagged.self_branch.hint: "Добавьте комментарий #self-branch, называющий branch и рабочий путь."
  guard.common.dev.blockers_in.hint: "Каждый blocker должен быть в Done или Documentation до начала разработки."
  guard.common.done.comments_tagged.documentation.hint: "Добавьте комментарий #documentation, резюмирующий merged commits, связанные tags, и подтверждение того, что task проверена и правильно протегирована."

  # guard.omakase.* — preset-scoped hints for the Omakase workflow.
  guard.omakase.dev.comments_tagged.self_branch.hint: "Перед началом создайте отдельную feature branch или git worktree для этой task и добавьте тегированный #self-branch комментарий, документирующий имя branch и рабочий путь."
  guard.omakase.dev.blockers_in.hint: "Каждый blocker должен быть в Done до начала разработки — сначала закончите blockers, чтобы держать WIP под контролем."
  guard.omakase.review.comments_tagged.resume.hint: "Добавьте тегированный #resume комментарий, резюмирующий, что было реализовано, принятые решения, и открытые вопросы, перед запросом review."
  guard.omakase.review.comments_tagged.tests_passing.hint: "Добавьте комментарий #tests-passing с командой теста, фрагментом output, и продолжительностью — ревьюер должен иметь возможность воспроизвести доказательство."
  guard.omakase.done.comments_tagged.documentation.hint: "Добавьте тегированный #documentation комментарий, резюмирующий: merged commits (commit IDs), связанные tags (kebab-case), и подтверждение того, что task проверена и правильно протегирована."

  # guard.izakaya.* — preset-scoped hints for the Izakaya workflow.
  guard.izakaya.dev.comments_tagged.hypothesis.hint: "Напишите вопрос, на который отвечает этот spike — заведите комментарий #hypothesis с вопросом, почему он важен, фальсифицируемым сигналом, и time-box."

  # guard.kaiseki.* — preset-scoped hints for the Kaiseki workflow.
  guard.kaiseki.delete.comments_tagged.peer_review.hint: "Добавьте #peer-review, одобряющий удаление, перед удалением task."
  guard.kaiseki.planning.comments_tagged.requirements.hint: "Добавьте комментарий #requirements с user story; заказчик подписывается под ней до начала planning."
  guard.kaiseki.dev.comments_tagged.design.hint: "Добавьте комментарий #design, ссылающийся на design doc, decision record, или RFC, фиксирующий подход, до появления кода."
  guard.kaiseki.review.comments_tagged.resume.hint: "Добавьте handoff #resume, резюмирующий, что было реализовано, принятые решения, и открытые вопросы перед review."
  guard.kaiseki.review.comments_tagged.tests_passing.hint: "Добавьте комментарий #tests-passing с командой теста, фрагментом output, и продолжительностью."
  guard.kaiseki.docs.comments_tagged.peer_review.hint: "Добавьте комментарий #peer-review от независимого ревьюера (не автора) с вердиктом и областью одобрения."

  # guard.shokunin.* — preset-scoped hints for the Shokunin workflow.
  guard.shokunin.archive.comments_tagged.documentation.hint: "Добавьте #documentation перед архивированием работы shokunin."
  guard.shokunin.archive.comments_tagged.lessons_learned.hint: "Добавьте #lessons-learned, резюмирующее, что сработало / что нет, перед архивированием."
  guard.shokunin.delete.comments_tagged.peer_review.hint: "Добавьте #peer-review перед удалением работы shokunin."
  guard.shokunin.unarchive.comments_tagged.peer_review.hint: "Добавьте #peer-review, одобряющий повторное открытие, перед разархивированием."
  guard.shokunin.planning.comments_tagged.requirements.hint: "Добавьте комментарий #requirements с user story и сигналами приёмки до начала planning."
  guard.shokunin.dev.comments_tagged.pre_mortem.hint: "Добавьте комментарий #pre-mortem, называющий основные режимы отказа, сигналы детектирования, и митигации до появления кода."
  guard.shokunin.dev.comments_tagged.risk_assessment.hint: "Добавьте #risk-assessment, называющий матрицу рисков, blast radius, влияние на SLO, и принятый остаточный риск."
  guard.shokunin.review.comments_tagged.resume.hint: "Добавьте handoff #resume, резюмирующий, что было реализовано, решения, и открытые вопросы."
  guard.shokunin.review.comments_tagged.tests_passing.hint: "Добавьте #tests-passing с дельтой coverage, типами тестов, и проверкой регрессии производительности."
  guard.shokunin.review.comments_tagged.rollback_plan.hint: "Добавьте #rollback-plan с шагами revert, валидацией после rollback, и планом коммуникации перед review."
  guard.shokunin.docs.comments_tagged.peer_review.hint: "Добавьте ≥ 2 различных комментария #peer-review от независимых ревьюеров (не автора). Каждый содержит вердикт, область одобрения, и чеклист рассмотренных артефактов."
  guard.shokunin.done.comments_tagged.lessons_learned.hint: "Добавьте комментарий #lessons-learned, называющий, что сработало / что нет, и любые предложенные изменения процесса."
