  cli.config.init.long: |-
    Создаёт автономную установку config с корнем в выбранном scope.

      --scope global  →  paths.ConfigRoot() (или родительская папка --config).
                         Существующая user-установка; повторный запуск идемпотентен.

      --scope local   →  <cwd>/.omakiten (буквальный CWD, без walk-up).
                         Полная установка — config/<preset>.yaml плюс каждая
                         папка сущностей — чтобы runtime могла загрузить её
                         без merge с user-global слоем. Резолвер walk-up
                         автоматически подхватывает её при последующих
                         вызовах okt из репозитория.

    Матрица поведения:
      - Файл отсутствует          → атомарная запись.
      - Тот же preset, те же файлы → no_op:true (тихий успех).
      - Другой preset             → переключает .active на новый preset.
      - Изменённые shipped-файлы  → сохраняются если нет --force.
      - --force                   → пере-копирует каждый встроенный shipped-файл
                                    (skills, laws, personas, templates, themes,
                                    notifications, каждый preset yaml).
                                    Поддеревья custom/ никогда не трогаются.

    Выбор языка:
      --cli-lang, --tui-lang, --agent-lang пропускают интерактивные
      prompts каждого surface и записывают значение напрямую в блок
      languages созданного omakiten.yaml. --cli-lang и --tui-lang
      должны совпадать с bundled кодом языка (en, pt-br, es, fr, de,
      ru, ...); --agent-lang свободный. Без флага init спрашивает на
      TTY (или оставляет surface на значении по умолчанию когда stdin
      не интерактивен).
  cli.config.path.long: |-
    Обходит активную config (или выбранный слой) по точечному YAML-ключу
    и сообщает {key, value, path, source}. Без --layer резолвер выбирает
    установку, которую runtime использовал бы: обнаруженный .omakiten/
    если он есть, иначе user-global ConfigRoot.

    Автономная модель означает, что нет merge — значение любого ключа
    приходит ровно из одной установки. --layer закрепляет поиск на
    "global" или "local", чтобы вызывающий мог проверить конкретный
    слой, а не разрешённый (напр. "задано ли это в user-global
    установке, даже если репо перекрывает локально").
  cli.config.diff.long: |-
    Сравнивает два YAML-источника config и выдаёт одну запись на
    каждый расходящийся лист. Каждый операнд — один из:
      global              - активное yaml user-global
      local               - активное yaml внутри walk-up CWD .omakiten/
      local:<path>        - активное yaml внутри <path>/.omakiten/
      <path/to/file.yaml> - любой yaml-файл на диске

    Записи вывода несут op = added | removed | changed плюс
    соответствующие значения. Maps идут рекурсивно вниз; списки /
    скаляры сравниваются по глубокому равенству.
  cli.config.language.long: |-
    Читает и записывает config.languages.{cli,tui,agent_output} в
    активном omakiten.yaml. languages.cli и languages.tui валидируются
    против language packs, обнаруженных под languages/;
    languages.agent_output свободный и передаётся дословно в композитор
    prompt MCP.

    Цель по умолчанию — разрешённый omakiten.yaml (repo-local
    .omakiten/ если он есть, иначе user-global ConfigRoot). Использовать
    --global на set/reset, чтобы зафиксировать запись на user-global
    файле независимо от наличия repo-local.

    Записи запускают BundleCache.Reload, чтобы последующие вызовы okt и
    долгоживущие tools (TUI, сервер MCP) видели новый выбор. Текущий
    CLI-процесс и любой уже запущенный CLI-вызов не обновляются
    ретроактивно; только последующие вызовы подхватывают изменение.
  cli.config.language.set.long: |-
    Примеры:
      okt config language set --cli ru
      okt config language set --tui en --agent "Русский"
      okt config language set --agent "" --global

    Должна быть указана как минимум одна из --cli, --tui или --agent.
    --cli и --tui валидируются против кодов языков, обнаруженных под
    languages/. --agent принимает любую непустую строку (или "" для
    очистки). --global фиксирует запись на user-global omakiten.yaml.
  cli.mcp.install.long: "Записывает конфигурацию MCP-сервера Omakiten в файл config harness (напр. Claude Desktop или OpenCode)."
  cli.workflow.orphan.long: |-
    Tasks, которые указывали на bucket workflow, больше не существующий
    после смены preset или редактирования omakiten.yaml, являются
    сиротами. По умолчанию эта команда печатает план миграции (какие
    tasks были бы повторно привязаны к каким buckets) и выходит с
    ненулевым кодом, ничего не изменяя.

    Передать --confirm для применения повторной привязки. Каждая
    перенесённая task выдаёт событие task.migrated с payload
    from/to/reason. --dry-run эквивалентен запуску без --confirm.
