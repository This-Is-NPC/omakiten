  cli.root.short: "Принципиальные чекпоинты для AI-разработки"
  cli.root.long: |-
    okt управляет Omakiten из командной строки и TUI.

    Разрешение путей (по убыванию приоритета):
      1. флаги --config / --db
      2. $OMAKITEN_HOME — закрепляет config в <HOME>/config/<active>.yaml и данные в <HOME>/data/omakiten.db
      3. $XDG_CONFIG_HOME / $XDG_DATA_HOME
      4. ~/.config/omakiten и ~/.local/share/omakiten
  cli.root.flag.db: "путь к базе SQLite (перекрывает $OMAKITEN_HOME и XDG)"
  cli.root.flag.config: "путь к omakiten.yaml (перекрывает $OMAKITEN_HOME и XDG)"
