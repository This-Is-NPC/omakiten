  cli.root.long: |-
    okt bedient Omakiten vanaf de command line en de TUI.

    Padresolutie (van hoogste naar laagste precedentie):
      1. --config / --db flags
      2. $OMAKITEN_HOME — pint config op <HOME>/config/<active>.yaml en data op <HOME>/data/omakiten.db
      3. $XDG_CONFIG_HOME / $XDG_DATA_HOME
      4. ~/.config/omakiten en ~/.local/share/omakiten
