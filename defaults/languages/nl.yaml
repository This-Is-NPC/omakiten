  cli.config.init.long: |-
    Seed een standalone config-install geworteld in de gekozen scope.

      --scope global  →  paths.ConfigRoot() (of de parent van --config).
                         Bestaande user install; herstart is idempotent.

      --scope local   →  <cwd>/.omakiten (letterlijk CWD, geen walk-up).
                         Een volledige install — config/<preset>.yaml plus elke
                         entity-folder — zodat de runtime laadt zonder merge
                         met de user-global laag. De walk-up resolver pikt dit
                         automatisch op bij volgende okt-aanroepen vanuit de
                         repo.

    Gedragsmatrix:
      - Bestand ontbreekt        → atomaire schrijfactie.
      - Zelfde preset, zelfde bestanden → no_op:true (stille success).
      - Ander preset             → zet .active op het nieuwe preset.
      - Aangepaste shipped files → behouden tenzij --force.
      - --force                  → kopieert elk embedded shipped bestand opnieuw
                                   (skills, laws, personas, templates, themes,
                                   notifications, elke preset yaml).
                                   custom/ subtrees worden nooit aangeraakt.

    Taalkeuze:
      --cli-lang, --tui-lang, --agent-lang slaan de interactieve prompts
      per surface over en schrijven de waarde direct in het languages-blok
      van de geseede omakiten.yaml. --cli-lang en --tui-lang moeten matchen
      met een bundled language code (en, pt-br, ...); --agent-lang is
      vrij. Zonder flag vraagt init via de TTY (of laat de surface op de
      standaard wanneer stdin niet-interactief is).
  cli.config.path.long: |-
    Loop door de actieve config (of een gekozen laag) op dotted YAML key
    en rapporteer {key, value, path, source}. Zonder --layer kiest de
    resolver de install die de runtime zou gebruiken: de gevonden
    .omakiten/ wanneer aanwezig, anders de user-global ConfigRoot.

    Het standalone model betekent dat er geen merge is, dus een waarde op
    een key komt uit precies één install. --layer pint de lookup op
    "global" of "local" zodat callers een specifieke laag kunnen
    verifiëren in plaats van de opgeloste (bijv. "staat dit in de
    user-global install ook al overschrijft mijn repo het lokaal").
  cli.config.diff.long: |-
    Vergelijk twee YAML config-bronnen en emit één entry per divergerend
    leaf. Elke operand is één van:
      global              - de user-global actieve yaml
      local               - de actieve yaml in de CWD walk-up .omakiten/
      local:<path>        - de actieve yaml in <path>/.omakiten/
      <path/to/file.yaml> - elk yaml-bestand op schijf

    Output-entries dragen op = added | removed | changed plus de relevante
    waarden. Maps dalen recursief af; lists / scalars vergelijken op deep
    equality.
  cli.config.language.long: |-
    Lees en schrijf config.languages.{cli,tui,agent_output} in de actieve
    omakiten.yaml. languages.cli en languages.tui worden gevalideerd tegen
    de language packs gevonden onder languages/; languages.agent_output is
    vrij en wordt verbatim doorgegeven aan de MCP prompt composer.

    De default target is de opgeloste omakiten.yaml (repo-local .omakiten/
    wanneer aanwezig, anders de user-global ConfigRoot). Gebruik --global
    bij set/reset om de schrijfactie te pinnen op het user-global bestand,
    ongeacht de aanwezigheid van repo-local.

    Schrijfacties triggeren een BundleCache.Reload zodat volgende okt
    invocations en langlopende tools (TUI, MCP-server) de nieuwe selectie
    zien. Het huidige CLI-proces en elke al lopende CLI-invocation worden
    niet retroactief bijgewerkt; alleen volgende invocations pikken de
    wijziging op.
  cli.config.language.set.long: |-
    Voorbeelden:
      okt config language set --cli pt-br
      okt config language set --tui en --agent "Português (Brasil)"
      okt config language set --agent "" --global

    Minstens één van --cli, --tui of --agent moet worden meegegeven. --cli
    en --tui valideren tegen de taalcodes gevonden onder languages/.
    --agent accepteert elke niet-lege string (of "" om te wissen).
    --global pint de schrijfactie op de user-global omakiten.yaml.
  cli.mcp.install.long: "Schrijft de configuratie van de Omakiten MCP-server naar het config-bestand van de harness (bijv. Claude Desktop of OpenCode)."
  cli.workflow.orphan.long: |-
    Tasks die wezen naar een workflow-bucket die niet meer bestaat na een
    preset-switch of omakiten.yaml-edit zijn weeskinderen. Standaard print
    dit commando het migratieplan (welke tasks naar welke bucket zouden
    herbinden) en exit non-zero zodat niets wordt gemuteerd.

    Geef --confirm om de rebind toe te passen. Elke gemigreerde task emit
    een task.migrated event met from/to/reason payload. --dry-run is
    equivalent aan runnen zonder --confirm.
