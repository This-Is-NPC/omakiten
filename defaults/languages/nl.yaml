  cli.projects.delete.short: "Hard-delete van een geregistreerd project en elke afhankelijke rij (onomkeerbaar)"
  cli.projects.delete.long: |-
    Los het project op via numerieke id of slug, schrijf een recovery-
    snapshot naar de rollende backup-map en cascade-delete
    elke afhankelijke rij (tasks, comments, plans, tag attachments,
    errors, activity log).
    
    Backup-fout breekt delete af voordat iets wordt aangeraakt.
    Filesystem-status onder <root_path>/.omakiten/ blijft behouden —
    alleen DB-rijen worden verwijderd.
    
    Zonder --yes toont het commando tellers en vraagt
    bevestiging; pipen zonder --yes faalt in plaats van
    op stdin te blokkeren.
