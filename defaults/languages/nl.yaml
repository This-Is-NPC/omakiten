  # okt update — in-binary counterpart of the curl|bash installer for refresh.
  cli.update.short: "Haalt de nieuwste okt-release op en vervangt het geïnstalleerde binary atomisch"
  cli.update.long: |-
    Detecteert het pad van het draaiende binary (os.Executable), bevraagt de GitHub-
    releases-API voor de nieuwste tag, downloadt het bijbehorende asset en
    vervangt het binary op schijf atomisch. Het huidige proces stopt
    na de swap; de volgende aanroep draait de nieuwe versie.
    
    --check print `current=<v> latest=<v> action=<noop|upgrade>` en
    stopt met 0 zonder te schrijven. --yes slaat de bevestiging over voor
    non-interactieve callers.
  cli.update.flag.yes: "sla de bevestigingsprompt over en pas de upgrade non-interactief toe"
  cli.update.flag.check: "rapporteer huidig vs. nieuwste en stop zonder te schrijven"
