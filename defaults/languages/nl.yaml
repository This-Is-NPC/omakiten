  cli.db.short: "Database-levenscyclushulpmiddelen (backup, snapshot, restore — sysadmin-ops)"
  cli.db.backup.short: "Schrijf een snapshot van de actieve SQLite-database naar de rollende backup-map"
  cli.db.backup.long: |-
    Kopieer de actieve SQLite-database naar een snapshot met timestamp onder
    $XDG_STATE_HOME/omakiten/backups/ (standaard ~/.local/state/omakiten/backups/)
    en prune oudere snapshots volgens settings.backup.retention_count.
    
    De kopie is atomisch: de bestemming verschijnt pas als de inhoud
    is geschreven en hernoemd. Een eerdere gedeeltelijke kopie overleeft
    geen fout.
    
    --out legt het snapshot-pad expliciet vast (oudermappen worden
    indien nodig aangemaakt). Met --out wordt retention prune
    overgeslagen — rotatiebeleid ligt buiten de standaard state-map.
  cli.db.backup.flag.out: "snapshot naar dit expliciete pad schrijven (sla retention prune over)"
