# okt uninstall — in-binary counterpart of uninstall.sh / uninstall.ps1.
  cli.uninstall.short: "Verwijdert het geïnstalleerde okt-binary en shell-rc-wrapper (data + config standaard behouden)"
  cli.uninstall.long: |-
    Verwijdert het binary dat de installer naar $INSTALL_DIR schreef (standaard
    ~/.local/bin op POSIX en %LOCALAPPDATA%\Programs\okt op Windows) en
    haalt het okt()-wrapperblok uit elk rc/profile-doel.
    
    Lokale staat blijft behouden tenzij expliciet opt-out via --purge-data
    (SQLite DB onder $XDG_DATA_HOME/omakiten) of --purge-config (actief
    yaml-profiel + entity-mappen onder $XDG_CONFIG_HOME/omakiten).
    --purge is shorthand voor beide.
    
    Zonder flags op een TTY toont de picker wat verwijderd zou worden met
    groottes en vraagt per purge-doel. --yes slaat de picker volledig over.
    
    Geen automatische backup. Voer eerst `okt db backup` uit als je een
    snapshot van de SQLite DB wilt vóór purge — deinstallatie verwijdert
    bewust gebruikersdata; het vangnet is opt-in via het
    standalone backup-commando.
  cli.uninstall.flag.yes: "sla de interactieve picker over en pas de opgeloste flag-set non-interactief toe"
  cli.uninstall.flag.purge-data: "verwijdert ook $XDG_DATA_HOME/omakiten (SQLite DB + WAL/SHM) — onomkeerbaar"
  cli.uninstall.flag.purge-config: "verwijdert ook $XDG_CONFIG_HOME/omakiten (actief yaml + entity-mappen) — onomkeerbaar"
  cli.uninstall.flag.purge: "shorthand voor --purge-data + --purge-config — onomkeerbaar"
  cli.uninstall.picker.title: "okt deïnstalleren"
  cli.uninstall.picker.hint: "↑/↓ navigeren · enter wisselen · y toepassen · ctrl+c afsluiten"
