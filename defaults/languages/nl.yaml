  cli.setup.short: "Start de first-run setup picker (taal → preset → MCP harness)"
  cli.setup.long: |-
    okt setup is de post-install picker waar de curl|bash installer je in laat landen.

    Het doorloopt taalkeuze (CLI / TUI / agent-output), preset-keuze en
    MCP-harness configuratie in één bubbletea-programma, en schrijft daarna
    de okt() shell-rc wrapper. Herstart met --update om keuzes te herzien.

    Headless / niet-interactieve shells slaan elk scherm over waarvan de
    bijhorende env var ingevuld is: OKT_CLI_LANG, OKT_TUI_LANG, OKT_AGENT_LANG,
    OKT_PRESET, OKT_HARNESSES.
  cli.setup.flag.update: "draai de picker opnieuw met huidige waarden voorgevuld (idempotent t.o.v. bestaande rc + omakiten.yaml)"
  cli.setup.flag.cli-lang: "sla de CLI-taal picker over door de gekozen code te zetten (zelfde vorm als OKT_CLI_LANG=)"
  cli.setup.flag.tui-lang: "sla de TUI-taal picker over door de gekozen code te zetten (zelfde vorm als OKT_TUI_LANG=)"
  cli.setup.flag.agent-lang: "sla de agent-output taal prompt over door de gekozen vrije waarde te zetten"
  cli.setup.flag.preset: "sla de preset picker over door de gekozen preset-naam te zetten (zelfde vorm als OKT_PRESET=)"
  cli.setup.flag.harnesses: "sla de harness multi-select over met een CSV van harness-namen (zelfde vorm als OKT_HARNESSES=)"
  cli.setup.flag.skip-wrapper: "schrijf het okt() shell-rc wrapper-blok niet (handig wanneer de gebruiker rc-files via dotfiles beheert)"
  cli.setup.flag.skip-harnesses: "los harness inputs op maar roep `okt mcp setup` niet aan (gebruikt door shell-tests + dry-run smoke checks)"
  cli.setup.status.preset_written: "=> Actief workflow preset: %s (%s/.active)"
  cli.setup.status.wrapper_written: "=> okt() shell wrapper geïnstalleerd in: %s"
  cli.setup.status.wrapper_skipped: "=> Shell-wrapper install overgeslagen: geen ~/.bashrc of ~/.zshrc gevonden"
