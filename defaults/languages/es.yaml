  cli.config.init.long: |-
    Crea un install de config standalone enraizado en el scope elegido.

      --scope global  →  paths.ConfigRoot() (o el directorio padre de --config).
                         Install user ya existente; re-ejecución es idempotente.

      --scope local   →  <cwd>/.omakiten (CWD literal, sin walk-up).
                         Install completo — config/<preset>.yaml más cada
                         carpeta de entidad — para que el runtime cargue sin
                         merge con la capa user-global. El resolver de walk-up
                         lo recoge automáticamente en llamadas okt
                         posteriores desde dentro del repo.

    Matriz de comportamiento:
      - Archivo ausente         → escritura atómica.
      - Mismo preset, mismos archivos → no_op:true (éxito silencioso).
      - Preset distinto         → cambia .active al nuevo preset.
      - Archivos shipped alterados → preservados a menos que --force.
      - --force                 → re-copia cada archivo shipped embebido
                                  (skills, laws, personas, templates, themes,
                                  notifications, todos los preset yamls).
                                  Subárboles custom/ nunca se tocan.

    Selección de idioma:
      --cli-lang, --tui-lang, --agent-lang omiten los prompts interactivos
      de cada surface y escriben el valor directamente en el bloque
      languages del omakiten.yaml seedeado. --cli-lang y --tui-lang deben
      coincidir con un código de idioma bundled (en, pt-br, es, ...);
      --agent-lang es libre. Sin flag, init pregunta en el TTY (o deja el
      surface en su predeterminado cuando stdin es no-interactivo).
  cli.config.path.long: |-
    Recorre la config activa (o una capa elegida) por clave YAML punteada
    y reporta {key, value, path, source}. Sin --layer el resolver elige
    el install que el runtime usaría: el .omakiten/ descubierto cuando
    está presente, si no el ConfigRoot user-global.

    El modelo standalone significa que no hay merge — un valor en
    cualquier clave viene de exactamente un install. --layer fija la
    búsqueda en "global" o "local" para que el caller verifique una
    capa específica en lugar de la resuelta (por ejemplo "¿está
    seteado en el install user-global aunque mi repo lo sobrescriba
    localmente?").
  cli.config.diff.long: |-
    Compara dos fuentes YAML de config y emite una entrada por hoja
    divergente. Cada operando es uno de:
      global              - el yaml activo user-global
      local               - el yaml activo en el walk-up del CWD en .omakiten/
      local:<path>        - el yaml activo dentro de <path>/.omakiten/
      <path/to/file.yaml> - cualquier archivo yaml en disco

    Cada entrada lleva op = added | removed | changed más los valores
    relevantes. Maps descienden recursivamente; listas / escalares
    comparan por igualdad profunda.
  cli.config.language.long: |-
    Lee y escribe config.languages.{cli,tui,agent_output} en el
    omakiten.yaml activo. languages.cli y languages.tui se validan
    contra los language packs descubiertos bajo languages/;
    languages.agent_output es libre y se reenvía textual al compositor
    de prompts MCP.

    El target predeterminado es el omakiten.yaml resuelto (.omakiten/
    repo-local cuando está presente, si no el ConfigRoot user-global).
    Usa --global en set/reset para fijar la escritura en el archivo
    user-global independiente de la presencia repo-local.

    Las escrituras disparan BundleCache.Reload para que llamadas okt
    posteriores y tools de larga duración (TUI, servidor MCP) observen
    la nueva selección. El proceso CLI actual y cualquier invocación
    CLI ya en curso no se actualizan retroactivamente; solo las
    invocaciones posteriores recogen el cambio.
  cli.config.language.set.long: |-
    Ejemplos:
      okt config language set --cli es
      okt config language set --tui en --agent "Español (España)"
      okt config language set --agent "" --global

    Al menos uno de --cli, --tui o --agent debe ser provisto. --cli y
    --tui validan contra los códigos de idioma descubiertos bajo
    languages/. --agent acepta cualquier string no vacío (o "" para
    limpiar). --global fija la escritura en el omakiten.yaml
    user-global.
  cli.mcp.install.long: "Escribe la configuración del servidor MCP de Omakiten en el archivo de config del harness (ej.: Claude Desktop u OpenCode)."
  cli.workflow.orphan.long: |-
    Las tasks que apuntaban a un bucket de workflow que ya no existe
    después de un cambio de preset o edición de omakiten.yaml son
    huérfanas. Por defecto este comando imprime el plan de migración
    (qué tasks se re-vincularían a qué buckets) y sale con código no
    cero sin mutar nada.

    Pasa --confirm para aplicar el re-vínculo. Cada task migrada emite
    un evento task.migrated con payload from/to/reason. --dry-run es
    equivalente a ejecutar sin --confirm.
