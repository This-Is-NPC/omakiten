  cli.setup.short: "Ejecuta el selector inicial post-instalación (idioma → preset → harness MCP)"
  cli.setup.long: |-
    okt setup es el selector post-instalación llamado por el instalador curl|bash.

    Pasa por la selección de idioma (CLI / TUI / salida del agente),
    selección de preset y configuración de harness MCP en un único
    programa bubbletea, y luego escribe el wrapper okt() en el rc del
    shell. Usa --update para revisitar.

    Shells no interactivos omiten cada pantalla cuya variable de entorno
    está definida: OKT_CLI_LANG, OKT_TUI_LANG, OKT_AGENT_LANG, OKT_PRESET, OKT_HARNESSES.
  cli.setup.flag.update: "re-ejecuta el selector con los valores actuales como predeterminados (idempotente sobre rc + omakiten.yaml existentes)"
  cli.setup.flag.cli-lang: "omite el selector de idioma del CLI definiendo el código elegido (misma forma de OKT_CLI_LANG=)"
  cli.setup.flag.tui-lang: "omite el selector de idioma de la TUI definiendo el código elegido (misma forma de OKT_TUI_LANG=)"
  cli.setup.flag.agent-lang: "omite el prompt de idioma de salida del agente definiendo el valor libre elegido"
  cli.setup.flag.preset: "omite el selector de preset definiendo el nombre elegido (misma forma de OKT_PRESET=)"
  cli.setup.flag.harnesses: "omite el multi-selector de harnesses con un CSV de nombres (misma forma de OKT_HARNESSES=)"
  cli.setup.flag.skip-wrapper: "no escribe el bloque wrapper okt() en el rc del shell (útil cuando el usuario gestiona el rc vía dotfiles)"
  cli.setup.flag.skip-harnesses: "resuelve las entradas de harness pero no invoca `okt mcp setup` (usado por tests shell + smoke dry-run)"
  cli.setup.status.preset_written: "=> Preset de workflow activo: %s (%s/.active)"
  cli.setup.status.wrapper_written: "=> Wrapper okt() instalado en: %s"
  cli.setup.status.wrapper_skipped: "=> Omitiendo instalación del wrapper: ningún ~/.bashrc o ~/.zshrc encontrado"
  cli.setup.status.harness_configured: "=> Configurando MCP para %s"
  cli.setup.status.harness_failed: "   (omitido %s, exit %d — re-ejecuta manualmente: %s mcp setup --harness %s --force)"
  cli.setup.status.complete: "=> Ejecuta 'okt --help' para comenzar"
  cli.setup.warn.unknown_preset: "warn: OKT_PRESET=%s no es un preset soportado; usando %s"
