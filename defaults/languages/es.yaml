  cli.root.long: |-
    okt opera Omakiten desde la terminal y la TUI.

    Resolución de rutas (precedencia decreciente):
      1. flags --config / --db
      2. $OMAKITEN_HOME — fija config en <HOME>/config/<active>.yaml y datos en <HOME>/data/omakiten.db
      3. $XDG_CONFIG_HOME / $XDG_DATA_HOME
      4. ~/.config/omakiten y ~/.local/share/omakiten
