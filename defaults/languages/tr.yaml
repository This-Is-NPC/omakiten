  cli.setup.short: "İlk çalıştırma kurulum seçicisini çalıştır (dil → preset → MCP harness)"
  cli.setup.long: |-
    okt setup, curl|bash kurucusunun seni içine bıraktığı kurulum sonrası seçicidir.

    Tek bir bubbletea programında dil seçimi (CLI / TUI / agent-output),
    preset seçimi ve MCP-harness yapılandırmasını yürütür, ardından okt()
    shell-rc wrapper'ını yazar. Seçimleri tekrar gözden geçirmek için
    --update ile yeniden çalıştır.

    Headless / interaktif olmayan shell'ler, eşleşen env var'ın doldurduğu
    her ekranı atlar: OKT_CLI_LANG, OKT_TUI_LANG, OKT_AGENT_LANG, OKT_PRESET,
    OKT_HARNESSES.
