  cli.config.init.long: |-
    Seçilen scope'ta köklenmiş bağımsız bir config kurulumu seed'le.

      --scope global  →  paths.ConfigRoot() (veya --config'in ebeveyni).
                         Mevcut kullanıcı kurulumu; yeniden çalıştırma idempotenttir.

      --scope local   →  <cwd>/.omakiten (literal CWD, yukarı yürüme yok).
                         Tam bir kurulum — config/<preset>.yaml artı her
                         entity klasörü — böylece runtime user-global katmanla
                         birleşmeden yükleyebilir. Walk-up resolver bunu
                         repo içinden sonraki okt çağrılarında otomatik
                         olarak alır.

    Davranış matrisi:
      - Dosya yok                → atomik yazma.
      - Aynı preset, aynı dosyalar → no_op:true (sessiz başarı).
      - Farklı preset            → .active'i yeni preset'e çevirir.
      - Değiştirilmiş ürün dosyaları → --force olmadıkça korunur.
      - --force                  → her gömülü ürün dosyasını yeniden kopyalar
                                  (skill'ler, law'lar, persona'lar, template'ler, tema'lar,
                                  notification'lar, her preset yaml'ı).
                                  custom/ alt ağaçlarına asla dokunulmaz.

    Dil seçimi:
      --cli-lang, --tui-lang, --agent-lang her yüzey için interaktif
      prompt'ları atlar ve değeri doğrudan seed edilen omakiten.yaml'ın
      languages bloğuna yazar. --cli-lang ve --tui-lang paketlenmiş bir
      dil koduyla (en, pt-br, ...) eşleşmeli; --agent-lang serbest formdur.
      Bayrak verilmediğinde, init TTY üzerinde prompt eder (veya stdin
      interaktif değilse yüzeyi varsayılanında bırakır).
  cli.config.path.long: |-
    Aktif config'te (veya seçilen bir katmanda) noktalı YAML key ile yürü
    ve {key, value, path, source} raporla. --layer olmadan resolver,
    runtime'ın kullanacağı kurulumu seçer: varsa keşfedilen .omakiten/,
    aksi halde user-global ConfigRoot.

    Bağımsız model birleştirme olmadığını ima eder, dolayısıyla herhangi
    bir key'deki değer tam olarak bir kurulumdan gelir. --layer aramayı
    "global" veya "local"e sabitler, böylece çağıranlar çözümlenen yerine
    belirli bir katmanı doğrulayabilir (örn. "bu user-global kurulumda
    ayarlanmış mı, repo'm yerel olarak geçersiz kılsa bile").
  cli.config.diff.long: |-
    İki YAML config kaynağını karşılaştır ve farklı her yaprak için bir
    girdi yay. Her operand şunlardan biridir:
      global              - user-global aktif yaml
      local               - CWD walk-up .omakiten/ içindeki aktif yaml
      local:<path>        - <path>/.omakiten/ içindeki aktif yaml
      <path/to/file.yaml> - disk üzerindeki herhangi bir yaml dosyası

    Çıktı girdileri op = added | removed | changed artı ilgili taraf
    değerlerini taşır. Map'ler özyinelemeli iner; list'ler / skaler'ler
    derin eşitlikle karşılaştırılır.
  cli.config.language.long: |-
    Aktif omakiten.yaml içindeki config.languages.{cli,tui,agent_output}'u
    oku ve yaz. languages.cli ve languages.tui, languages/ altında
    keşfedilen dil paketlerine karşı doğrulanır; languages.agent_output
    serbest formdur ve MCP prompt composer'a aynen iletilir.

    Varsayılan hedef çözümlenmiş omakiten.yaml'dır (varsa repo-local
    .omakiten/, aksi halde user-global ConfigRoot). set/reset üzerinde
    --global kullanarak yazmayı repo-local varlığından bağımsız olarak
    user-global dosyaya sabitle.

    Yazmalar bir BundleCache.Reload tetikler, böylece sonraki okt çağrıları
    ve uzun süre çalışan tool'lar (TUI, MCP sunucusu) yeni seçimi gözlemler.
    Mevcut CLI süreci ve zaten çalışan herhangi bir CLI çağrısı geçmişe
    dönük güncellenmez; yalnızca sonraki çağrılar değişikliği alır.
  cli.config.language.set.long: |-
    Örnekler:
      okt config language set --cli pt-br
      okt config language set --tui en --agent "Português (Brasil)"
      okt config language set --agent "" --global

    --cli, --tui veya --agent'tan en az biri sağlanmalıdır. --cli ve
    --tui, languages/ altında keşfedilen dil kodlarına karşı doğrular.
    --agent boş olmayan herhangi bir string kabul eder (veya temizlemek
    için ""). --global yazmayı user-global omakiten.yaml'a sabitler.
  cli.mcp.install.long: "Omakiten MCP sunucu yapılandırmasını harness config dosyasına yazar (örn. Claude Desktop veya OpenCode)."
  cli.workflow.orphan.long: |-
    Preset değişimi veya omakiten.yaml düzenlemesinden sonra artık var
    olmayan bir workflow bucket'ına işaret eden task'lar orphan'dır.
    Bu komut varsayılan olarak migrasyon planını yazdırır (hangi task'lar
    hangi bucket'a yeniden bağlanır) ve sıfırdan farklı çıkar, böylece
    hiçbir şey değiştirilmez.

    Yeniden bağlamayı uygulamak için --confirm geç. Her migrate edilen
    task, from/to/reason payload'lı bir task.migrated olayı yayar.
    --dry-run, --confirm olmadan çalıştırmaya eşdeğerdir.
