    okt, Omakiten'i komut satırından ve TUI üzerinden yönetir.

    Yol çözümlemesi (en yüksekten en düşüğe öncelik):
      1. --config / --db bayrakları
      2. $OMAKITEN_HOME — config'i <HOME>/config/<active>.yaml'a ve veriyi <HOME>/data/omakiten.db'ye sabitler
      3. $XDG_CONFIG_HOME / $XDG_DATA_HOME
      4. ~/.config/omakiten ve ~/.local/share/omakiten
