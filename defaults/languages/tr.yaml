# okt uninstall — in-binary counterpart of uninstall.sh / uninstall.ps1.
  cli.uninstall.short: "Remove the installed okt binary and shell-rc wrapper (data + config preserved by default)"
  cli.uninstall.long: |-
    Remove the binary the installer wrote to $INSTALL_DIR (defaults to
    ~/.local/bin on POSIX and %LOCALAPPDATA%Programsokt on Windows) and
    strip the okt() wrapper block from every rc/profile target.


    No automatic backup. Run `okt db backup` first if you want a
    snapshot of the SQLite DB before purging — uninstall removes
    user-owned data by intent, so the safety net is opt-in via the
    standalone backup command.

    Local state is preserved unless explicitly opted-out via --purge-data
    (SQLite DB under $XDG_DATA_HOME/omakiten) or --purge-config (active
    yaml profile + entity folders under $XDG_CONFIG_HOME/omakiten).
    --purge is shorthand for both.

    Without flags on a TTY the picker shows what would be deleted with
    sizes and asks per purge target. --yes skips the picker entirely.
  cli.uninstall.flag.yes: "skip the interactive picker and apply the resolved flag set non-interactively"
  cli.uninstall.flag.purge-data: "also delete $XDG_DATA_HOME/omakiten (SQLite DB + WAL/SHM) — irreversible"
  cli.uninstall.flag.purge-config: "also delete $XDG_CONFIG_HOME/omakiten (active yaml + entity folders) — irreversible"
  cli.uninstall.flag.purge: "shorthand for --purge-data + --purge-config — irreversible"
