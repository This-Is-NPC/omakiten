  cli.setup.short: "İlk çalıştırma kurulum seçicisini çalıştır (dil → preset → MCP harness)"
  cli.setup.long: |-
    okt setup, curl|bash kurucusunun seni içine bıraktığı kurulum sonrası seçicidir.

    Tek bir bubbletea programında dil seçimi (CLI / TUI / agent-output),
    preset seçimi ve MCP-harness yapılandırmasını yürütür, ardından okt()
    shell-rc wrapper'ını yazar. Seçimleri tekrar gözden geçirmek için
    --update ile yeniden çalıştır.

    Headless / interaktif olmayan shell'ler, eşleşen env var'ın doldurduğu
    her ekranı atlar: OKT_CLI_LANG, OKT_TUI_LANG, OKT_AGENT_LANG, OKT_PRESET,
    OKT_HARNESSES.
  cli.setup.flag.update: "seçiciyi mevcut değerler önceden doldurulmuş olarak yeniden çalıştır (mevcut rc + omakiten.yaml'a karşı idempotent)"
  cli.setup.flag.cli-lang: "CLI-dil seçicisini seçilen kodu belirleyerek atla (OKT_CLI_LANG= ile aynı şekil)"
  cli.setup.flag.tui-lang: "TUI-dil seçicisini seçilen kodu belirleyerek atla (OKT_TUI_LANG= ile aynı şekil)"
  cli.setup.flag.agent-lang: "agent-çıktı dil prompt'unu seçilen serbest form değeri belirleyerek atla"
  cli.setup.flag.preset: "preset seçicisini seçilen preset adını belirleyerek atla (OKT_PRESET= ile aynı şekil)"
  cli.setup.flag.harnesses: "harness çoklu-seçimini harness adlarının CSV'siyle atla (OKT_HARNESSES= ile aynı şekil)"
  cli.setup.flag.skip-wrapper: "okt() shell-rc wrapper bloğunu yazma (kullanıcı rc dosyalarını dotfiles üzerinden yönettiğinde faydalı)"
  cli.setup.flag.skip-harnesses: "harness girdilerini çöz ama `okt mcp setup`'ı çağırma (shell testleri + dry-run smoke kontrolleri tarafından kullanılır)"
  cli.setup.status.preset_written: "=> Aktif workflow preset'i: %s (%s/.active)"
