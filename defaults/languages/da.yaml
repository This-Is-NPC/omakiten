  cli.root.short: "Holdningsbestemte checkpoints til AI-drevet udvikling"
  cli.root.long: |-
    okt styrer Omakiten fra kommandolinjen og TUI.

    Stiopløsning (højeste til laveste prioritet):
      1. --config / --db flags
      2. $OMAKITEN_HOME — fastlåser config til <HOME>/config/<active>.yaml og data til <HOME>/data/omakiten.db
      3. $XDG_CONFIG_HOME / $XDG_DATA_HOME
      4. ~/.config/omakiten og ~/.local/share/omakiten
