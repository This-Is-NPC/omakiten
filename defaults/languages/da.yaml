  cli.uninstall.picker.config: "config dir  %s  (%s)"
  cli.uninstall.picker.no_tty: "interactive picker needs a TTY; pass --yes (plus optional --purge-* flags) for headless uninstall"
  cli.uninstall.picker.aborted: "uninstall aborted; nothing removed"

  # okt update — in-binary counterpart of the curl|bash installer for refresh.
  cli.update.short: "Fetch the latest okt release and atomically swap the installed binary"
  cli.update.long: |-
    Detect the running binary's path (os.Executable), query the GitHub
    releases API for the latest tag, download the matching asset, and
    atomically replace the binary on disk. The current process exits
    after the swap; the next invocation runs the new version.

    --check prints `current=<v> latest=<v> action=<noop|upgrade>` and
    exits 0 without writing. --yes skips the confirmation prompt for
    non-interactive callers.
  cli.update.flag.yes: "skip the confirmation prompt and apply the upgrade non-interactively"
  cli.update.flag.check: "report current vs. latest and exit without writing"
