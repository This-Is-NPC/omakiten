  cli.setup.short: "Kør first-run setup-vælgeren (sprog → preset → MCP-harness)"
  cli.setup.long: |-
    okt setup er den post-installations-vælger, som curl|bash-installereren
    smider dig ind i.

    Den gennemgår sprogvalg (CLI / TUI / agent-output), preset-valg og
    MCP-harness-konfiguration i et samlet bubbletea-program og skriver
    derefter okt() shell-rc-wrapperen. Kør igen med --update for at gennemgå
    valg.

    Headless / ikke-interaktive shells springer hver skærm over som den
    matchende env-variabel udfylder: OKT_CLI_LANG, OKT_TUI_LANG,
    OKT_AGENT_LANG, OKT_PRESET, OKT_HARNESSES.
  cli.setup.flag.update: "kør vælgeren igen med nuværende værdier forudfyldt (idempotent over for eksisterende rc + omakiten.yaml)"
