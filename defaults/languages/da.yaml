  cli.config.init.long: |-
    Initialiserer en standalone config-installation forankret i det valgte scope.

      --scope global  →  paths.ConfigRoot() (eller --configs forælder).
                         Eksisterende user-installation; gentagen kørsel er idempotent.

      --scope local   →  <cwd>/.omakiten (bogstavelig CWD, ingen walk-up).
                         En komplet installation — config/<preset>.yaml plus alle
                         entitetsmapper — så runtime kan indlæse den uden nogen
                         merge med det user-globale lag. Walk-up-resolveren
                         finder denne automatisk ved efterfølgende okt-kald
                         indefra repoet.

    Adfærdsmatrix:
      - Fil mangler             → atomar skrivning.
      - Samme preset, samme filer → no_op:true (lydløs succes).
      - Andet preset            → skifter .active til det nye preset.
      - Manipulerede leverede filer → bevares medmindre --force.
      - --force                 → genkopierer hver embedded leveret fil
                                  (skills, laws, personas, templates, themes,
                                  notifications, hver preset yaml).
                                  custom/-undertræer røres aldrig.

    Sprogvalg:
      --cli-lang, --tui-lang, --agent-lang springer de interaktive prompts
      for hver flade over og skriver værdien direkte i den initialiserede
      omakiten.yaml's languages-blok. --cli-lang og --tui-lang skal matche
      en bundlet language code (en, pt-br, ...); --agent-lang er fri form.
      Når ingen flag angives, prompter init på TTY (eller efterlader fladen
      med dens default når stdin ikke er interaktivt).
  cli.config.path.long: |-
    Gennemløb den aktive config (eller et valgt lag) via punkteret YAML-nøgle
    og rapportér {key, value, path, source}. Uden --layer vælger resolveren
    den installation, runtime ville bruge: den fundne .omakiten/ når den
    findes, ellers user-global ConfigRoot.

    Standalone-modellen betyder at der ikke er nogen merge, så en værdi på en
    nøgle kommer fra præcis én installation. --layer fastlåser opslaget til
    "global" eller "local" så kaldere kan verificere et specifikt lag i
    stedet for det opløste (f.eks. "er denne sat i user-global installation
    selvom mit repo tilsidesætter det lokalt").
  cli.config.diff.long: |-
    Sammenlign to YAML-config-kilder og udsend én post per divergent blad.
    Hver operand er én af:
      global              - det user-globale aktive yaml
      local               - det aktive yaml i CWD walk-up .omakiten/
      local:<path>        - det aktive yaml i <path>/.omakiten/
      <path/to/file.yaml> - enhver yaml-fil på disk

    Output-poster bærer op = added | removed | changed plus de relevante
    side-værdier. Maps gennemløbes rekursivt; lister / skalarer sammenlignes
    via dyb lighed.
  cli.config.language.long: |-
    Læs og skriv config.languages.{cli,tui,agent_output} i den aktive
    omakiten.yaml. languages.cli og languages.tui valideres mod language
    packs fundet under languages/; languages.agent_output er fri form og
    videresendes ordret til MCP prompt-composeren.

    Standardmålet er den opløste omakiten.yaml (repo-local .omakiten/ når
    den findes, ellers user-global ConfigRoot). Brug --global ved set/reset
    for at fastlåse skrivningen til den user-globale fil uanset repo-local
    tilstedeværelse.

    Skrivninger udløser en BundleCache.Reload, så efterfølgende okt-kald og
    langtkørende værktøjer (TUI, MCP-server) ser det nye valg. Den
    nuværende CLI-proces og enhver allerede kørende CLI-invokation
    opdateres ikke retroaktivt; kun efterfølgende invokationer ser
    ændringen.
  cli.config.language.set.long: |-
    Eksempler:
      okt config language set --cli pt-br
      okt config language set --tui en --agent "Português (Brasil)"
      okt config language set --agent "" --global

    Mindst én af --cli, --tui eller --agent skal angives. --cli og --tui
    valideres mod language codes fundet under languages/. --agent
    accepterer enhver ikke-tom streng (eller "" for at rydde). --global
    fastlåser skrivningen til den user-globale omakiten.yaml.
  cli.mcp.install.long: "Skriver Omakiten MCP-server-konfigurationen til harness-config-filen (f.eks. Claude Desktop eller OpenCode)."
  cli.workflow.orphan.long: |-
    Tasks der pegede på en workflow-bucket der ikke længere findes efter et
    preset-skift eller omakiten.yaml-ændring er orphans. Som standard
    udskriver denne kommando migrationsplanen (hvilke tasks der vil blive
    rebound til hvilken bucket) og afslutter med ikke-nul, så intet muteres.

    Angiv --confirm for at anvende rebind. Hver migreret task udsender en
    task.migrated-event med from/to/reason-payload. --dry-run svarer til at
    køre uden --confirm.
