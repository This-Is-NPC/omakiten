  cli.update.picker.hint: "y apply · n cancel · ctrl+c quit"
  cli.update.picker.no_tty: "interactive confirmation needs a TTY; pass --yes for headless update or --check for a dry-run report"
  cli.update.picker.aborted: "update aborted; binary unchanged"
