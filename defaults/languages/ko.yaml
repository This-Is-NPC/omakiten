  cli.config.init.long: |-
    선택된 scope 에 뿌리를 둔 standalone config 설치를 생성합니다.

      --scope global  →  paths.ConfigRoot() (또는 --config 의 부모).
                         기존 사용자 설치; 재실행은 멱등.

      --scope local   →  <cwd>/.omakiten (문자 그대로의 CWD, walk-up 없음).
                         완전한 설치 — config/<preset>.yaml 과 모든 엔티티
                         폴더 — 그래서 runtime 이 user-global 레이어와의
                         merge 없이 로드할 수 있습니다. walk-up 리졸버는
                         이후 okt 호출에서 자동으로 이를 인식합니다.

    동작 매트릭스:
      - 파일 없음                → 원자적 쓰기.
      - 동일 preset, 동일 파일    → no_op:true (조용한 성공).
      - 다른 preset              → .active 를 새 preset 으로 전환.
      - 변경된 shipped 파일      → --force 가 아니면 보존.
      - --force                  → 모든 임베디드 shipped 파일 재복사
                                    (skills, laws, personas, templates, themes,
                                    notifications, 모든 preset yaml).
                                    custom/ 서브트리는 절대 건드리지 않음.

    언어 선택:
      --cli-lang, --tui-lang, --agent-lang 은 각 surface 의 대화형
      프롬프트를 건너뛰고 값을 시드된 omakiten.yaml 의 languages 블록에
      직접 씁니다. --cli-lang 과 --tui-lang 은 bundled 언어 코드와
      일치해야 합니다 (en, pt-br, es, fr, de, ru, zh-cn, ko, ...);
      --agent-lang 은 자유 형식. 플래그가 없으면 init 가 TTY 에서
      프롬프트(또는 stdin 이 비대화형이면 surface 를 기본값으로 둠).
  cli.config.path.long: |-
    점으로 구분된 YAML 키로 활성 config(또는 선택된 레이어)를 순회하고
    {key, value, path, source} 를 보고합니다. --layer 없이는 리졸버가
    runtime 이 사용할 설치를 선택합니다: 존재하면 발견된 .omakiten/,
    그렇지 않으면 user-global ConfigRoot.

    standalone 모델은 merge 가 없음을 의미하므로 어떤 키의 값이든 정확히
    하나의 설치에서 옵니다. --layer 는 조회를 "global" 또는 "local" 로
    고정하여 호출자가 해석된 것이 아닌 특정 레이어를 검증할 수 있도록
    합니다(예: "repo 가 로컬에서 덮어쓰지만 user-global 설치에 설정되어
    있는가").
  cli.config.diff.long: |-
    두 YAML config 소스를 비교하고 각 다른 리프당 한 항목을 발행합니다.
    각 피연산자는 다음 중 하나:
      global              - user-global 의 활성 yaml
      local               - CWD walk-up .omakiten/ 내의 활성 yaml
      local:<path>        - <path>/.omakiten/ 내의 활성 yaml
      <path/to/file.yaml> - 디스크상의 임의 yaml 파일

    출력 항목은 op = added | removed | changed 와 관련 값을 가집니다.
    Maps 는 재귀적으로 하강; 리스트 / 스칼라는 깊은 동등성으로 비교.
  cli.config.language.long: |-
    활성 omakiten.yaml 의 config.languages.{cli,tui,agent_output} 를 읽고
    씁니다. languages.cli 와 languages.tui 는 languages/ 아래에서 발견된
    language packs 에 대해 검증; languages.agent_output 은 자유 형식이며
    MCP prompt 합성기에 그대로 전달됩니다.

    기본 대상은 해석된 omakiten.yaml (존재하면 repo-local .omakiten/,
    그렇지 않으면 user-global ConfigRoot). set/reset 에서 --global 을
    사용하면 repo-local 존재 여부와 관계없이 쓰기를 user-global 파일에
    고정합니다.

    쓰기는 BundleCache.Reload 를 트리거하여 후속 okt 호출과 장기 실행
    도구(TUI, MCP 서버)가 새 선택을 관찰하도록 합니다. 현재 CLI 프로세스와
    이미 실행 중인 CLI 호출은 소급 업데이트되지 않습니다; 후속 호출만
    변경을 받아들입니다.
  cli.config.language.set.long: |-
    예시:
      okt config language set --cli ko
      okt config language set --tui en --agent "한국어"
      okt config language set --agent "" --global

    --cli, --tui, --agent 중 적어도 하나는 제공되어야 합니다. --cli 와
    --tui 는 languages/ 아래에서 발견된 언어 코드에 대해 검증됩니다.
    --agent 는 비어 있지 않은 모든 문자열을 허용합니다(또는 비우려면 "").
    --global 은 쓰기를 user-global omakiten.yaml 에 고정합니다.
  cli.mcp.install.long: "Omakiten MCP 서버 구성을 harness config 파일에 씁니다(예: Claude Desktop 또는 OpenCode)."
  cli.workflow.orphan.long: |-
    preset 전환 또는 omakiten.yaml 편집 후 더 이상 존재하지 않는 workflow
    bucket 을 가리키던 tasks 는 고아입니다. 기본적으로 이 명령은 마이그레이션
    계획(어떤 tasks 가 어떤 buckets 에 재바인딩될지)을 출력하고 변경 없이
    non-zero 로 종료합니다.

    재바인딩을 적용하려면 --confirm 을 전달합니다. 마이그레이션된 각 task 는
    from/to/reason 페이로드와 함께 task.migrated 이벤트를 발생시킵니다.
    --dry-run 은 --confirm 없이 실행하는 것과 동등합니다.
