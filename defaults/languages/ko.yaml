  cli.setup.short: "설치 후 초기 선택기 실행 (언어 → preset → MCP harness)"
  cli.setup.long: |-
    okt setup 은 curl|bash 설치 프로그램이 호출하는 설치 후 선택기입니다.

    하나의 bubbletea 프로그램에서 언어 선택 (CLI / TUI / agent 출력),
