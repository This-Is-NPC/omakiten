keys:
  cli.root.short: "AI 주도 개발을 위한 의견 있는 체크포인트"
  cli.root.long: |-
    okt는 명령줄과 TUI에서 Omakiten을 구동합니다.

    경로 해석(높은 우선순위에서 낮은 우선순위 순):
      1. --config / --db 플래그
      2. $OMAKITEN_HOME — config를 <HOME>/config/<active>.yaml에 고정, 데이터를 <HOME>/data/omakiten.db에 고정
      3. $XDG_CONFIG_HOME / $XDG_DATA_HOME
      4. ~/.config/omakiten 와 ~/.local/share/omakiten
  cli.root.flag.db: "SQLite 데이터베이스 경로 ($OMAKITEN_HOME 와 XDG 를 덮어씀)"
  cli.root.flag.config: "omakiten.yaml 경로 ($OMAKITEN_HOME 와 XDG 를 덮어씀)"
  cli.root.flag.project: "프로젝트 slug"
  cli.root.flag.project-id: "프로젝트 id"
