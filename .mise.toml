[tools]
go = "1.25.13"
golangci-lint = "latest"
"go:golang.org/x/vuln/cmd/govulncheck" = "latest"
goreleaser = "2.17.0"
cosign = "3.1.1"
# PowerShell 7 is a test dependency, not a runtime one: internal/installscript
# runs install.ps1 for real (`pwsh -File install.ps1`) against hermetic release
# fixtures. Without it those strict-mode cases skip, and install.ps1's
# verify-before-extract gate would be covered by source parity alone.
powershell = "7.6.3"

[env]
GOCACHE = "{{config_root}}/.tmp/cache/go-build"
GOLANGCI_LINT_CACHE = "{{config_root}}/.tmp/cache/golangci-lint"

[tasks.fmt]
description = "Format Go sources"
run = "scripts/format.sh"

[tasks."fmt:check"]
description = "Fail if Go source directories are not gofmt-clean (CI gate)"
# Paired with TestGofmtBoundary in internal/arch. Both are wired into `check`
# on purpose: this step runs the real gofmt binary and fails in seconds, before
# the multi-minute test suite; the Go test rides `go test ./...` so it still
# fires for a contributor who never invokes mise, and it survives the case
# where a compile error takes the arch package down — which is exactly when
# formatting drift would otherwise slip in unnoticed.
run = "scripts/format.sh --check"

[tasks.test]
description = "Run Go tests once and enforce aggregate coverage"
# OKT_ENFORCE_SCROLL_BOUNDARY activates the W11-D arch gate: rejects
# direct `*Scroll =` mutations in internal/tui/render_*.go so new
# viewport surfaces stay routed through cardlist / linelist
# components instead of re-inventing scroll-sync inline.
env = { OKT_ENFORCE_SCROLL_BOUNDARY = "1" }
run = "scripts/test.sh"

[tasks.build]
description = "Build okt into .tmp/build/ with the current git version"
run = "scripts/build.sh"

[tasks."release:dry-run"]
description = "Build and verify the complete release metadata fixture without publishing"
run = "scripts/release-dry-run.sh"

[tasks.install]
description = "Build and install okt locally, then run `okt setup` for production-like user state"
depends = ["build"]
run = "scripts/install-local.sh"

[tasks."install:silent"]
description = "Non-interactive variant of install — defaults to en/en/en + omakase preset, skips MCP harnesses. Use for fast repeat installs while iterating on the picker."
depends = ["build"]
run = "scripts/install-local.sh --silent"

[tasks."dev:sync"]
description = "Mirror defaults/ into dev_env/ aggressively (overwrite root, leave custom/)"
run = '''
mkdir -p dev_env
"$PWD/scripts/sync-defaults.sh" "$PWD/dev_env"
'''

[tasks."dev:install"]
description = "Simulate a fresh omakiten install into dev_env/ — sync defaults, reset dev-only custom overlays, then pin .active to a stock preset"
env = { OMAKITEN_HOME = "dev_env", OKT_PRESET = "omakase", OKT_CLI_LANG = "en", OKT_TUI_LANG = "en", OKT_AGENT_LANG = "en", OKT_HARNESSES = "0" }
depends = ["dev:sync", "build"]
run = "scripts/dev-install.sh"

[tasks."install:mcp:claude"]
description = "Install Omakiten MCP server into Claude Code config"
depends = ["build"]
run = "scripts/install-mcp.sh claude-code"

[tasks."install:mcp:claude-desktop"]
description = "Install Omakiten MCP server into Claude Desktop config"
depends = ["build"]
run = "scripts/install-mcp.sh claude-desktop"

[tasks."install:mcp:opencode"]
description = "Install Omakiten MCP server into OpenCode global config"
depends = ["build"]
run = "scripts/install-mcp.sh opencode"

[tasks.uninstall]
description = "Remove the locally installed okt binary and shell wrapper without deleting config or data"
run = "scripts/uninstall-local.sh"

[tasks.purge]
description = "Remove Omakiten user config and data created by the production-like install"
run = '''
if [ -z "${HOME:-}" ]; then
  printf 'HOME is not set\n' >&2
  exit 1
fi
rm -rf "$HOME/.config/omakiten" "$HOME/.local/share/omakiten"
'''

[tasks.tui]
description = "Start the Omakiten TUI with local dev state under dev_env/"
env = { OMAKITEN_HOME = "dev_env" }
# raw = true keeps the TUI attached to the real /dev/tty. mise only honours
# raw for a task it runs directly — pulling one through a `depends` graph
# demotes it to captured/prefixed output with no controlling terminal, which
# is why the old `depends = ["dev:install"]` form failed with
# "could not open a new TTY". So this task has NO depends; instead it runs the
# dev_env prep itself via a nested `mise run dev:install` (captured, fine) and
# then execs the TUI in the raw shell that owns the TTY.
raw = true
run = '''
mise run dev:install
go run ./cmd/okt --config "$PWD/dev_env/config/omakase.yaml" init --name Omakiten --slug omakiten --root "$PWD" >/dev/null
go run ./cmd/okt --config "$PWD/dev_env/config/omakase.yaml" --project omakiten tui
'''

[tasks."tui:bare"]
description = "Open the TUI against existing dev_env/ state — skips dev:install so a previously-set preset / pre-seeded data survives. Use after seeding fixtures (e.g. the plans showcase script)."
env = { OMAKITEN_HOME = "dev_env" }
raw = true
run = '''
active="$(tr -d '\r\n' < "$PWD/dev_env/config/.active")"
case "$active" in
  ""|"."|".."|*/*|*\\*)
    printf 'dev_env/config/.active is invalid: %s\n' "$active" >&2
    exit 1
    ;;
esac
config="$PWD/dev_env/config/$active"
if [ -f "$PWD/dev_env/config/custom/$active" ] && [ ! -L "$PWD/dev_env/config/custom/$active" ]; then
  config="$PWD/dev_env/config/custom/$active"
elif [ ! -f "$config" ] || [ -L "$config" ]; then
  printf 'active dev config is missing or unsafe: %s\n' "$config" >&2
  exit 1
fi
go run ./cmd/okt --config "$config" --project omakiten tui
'''

[tasks.gallery]
description = "Browse the shared TUI components one at a time (dev-only, not shipped in the okt binary)"
# raw = true for the same reason `tui` needs it: the gallery is a Bubble Tea
# program and needs the real /dev/tty.
raw = true
run = "go run ./cmd/okt-gallery"

[tasks."gallery:dump"]
description = "Render every TUI component variant to stdout — no TTY, so it pipes to a file and diffs across a refactor"
run = "go run ./cmd/okt-gallery -dump"

[tasks."mcp:prompts"]
description = "Render every okt-* MCP prompt's resolved markdown to stdout against the dev defaults"
env = { OMAKITEN_HOME = "dev_env" }
depends = ["dev:sync"]
# Pin --config to the canonical omakase preset so the task is immune to stale
# state under dev_env/config/.active or dev_env/config/custom/ left over from
# prior runs. dev:sync refreshes the preset before this step.
run = "go run ./cmd/okt --config dev_env/config/omakase.yaml init --name Omakiten --slug omakiten >/dev/null && go run ./cmd/okt --config dev_env/config/omakase.yaml --project omakiten mcp prompts"

[tasks.lint]
description = "Run Go linter"
run = "golangci-lint run"

[tasks.vuln]
description = "Run Go vulnerability scan"
run = "govulncheck ./..."

[tasks."docs:refresh"]
description = "Remove legacy generated docs artifacts and validate the current .docs/ tree"
run = "go run ./cmd/okt-docs-refresh --root ."

[tasks."docs:check"]
description = "Fail if legacy docs-refresh artifacts are present (CI gate)"
run = "go run ./cmd/okt-docs-refresh --root . --check"

[tasks."claim-benchmark:freshness"]
description = "Check whether the manual ClaimNext benchmark reference still matches its source and runtime inputs"
run = "OKT_CHECK_CLAIM_BENCH_FRESHNESS=1 go test ./internal/mcp -run '^TestClaimNextCeilingReferenceFreshness$' -count=1"

[tasks.check]
description = "Run the full verification suite"
depends = ["fmt:check", "test", "lint", "vuln", "docs:check", "workspace:check"]

[tasks."workspace:check"]
description = "Reject generated artifacts outside .tmp/ and persistent local-state directories"
run = "scripts/check-workspace.sh"

[tasks."test:cross-build"]
description = "Compile config, path, and SQLite safety tests for supported targets into .tmp/tests"
usage = 'flag "--target <target>" help="Compile one OS/architecture instead of all supported targets"'
run = "scripts/test-cross-build.sh"

[tasks."test:profile"]
description = "Profile one package and keep its binary and profiles under .tmp/profiles"
usage = """
arg "<package>" help="Go package to profile"
flag "--bench <pattern>" default="." help="Benchmark regular expression"
"""
run = "scripts/test-profile.sh"
