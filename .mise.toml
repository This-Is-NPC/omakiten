[tools]
go = "1.25.9"
golangci-lint = "latest"
"go:golang.org/x/vuln/cmd/govulncheck" = "latest"

[tasks.fmt]
description = "Format Go sources"
run = "gofmt -w ."

[tasks.test]
description = "Run Go tests"
run = "go test ./..."

[tasks.build]
description = "Build okt into bin/ with the current git version"
run = '''
mkdir -p bin
version="$(git describe --tags --always --dirty 2>/dev/null || printf dev)"
go build -ldflags "-X main.version=${version}" -o bin/okt ./cmd/okt
'''

[tasks.install]
description = "Build and install okt locally, then initialize production-like user state"
depends = ["build"]
run = '''
if [ -z "${HOME:-}" ]; then
  printf 'HOME is not set\n' >&2
  exit 1
fi
install -Dm755 bin/okt "$HOME/.local/bin/okt"
config_dir="$HOME/.config/omakiten"
config_file="$config_dir/omakiten.yaml"
if [ -f "$config_file" ] && ! "$HOME/.local/bin/okt" config validate "$config_file" >/dev/null 2>&1; then
  backup_file="$config_file.bak.$(date +%Y%m%d%H%M%S)"
  cp "$config_file" "$backup_file"
  install -Dm644 defaults/omakiten.yaml "$config_file"
  printf 'Backed up invalid Omakiten config to %s and reset wiring to current defaults.\n' "$backup_file" >&2
fi
for sub in themes skills laws personas; do
  src_dir="defaults/$sub"
  [ -d "$src_dir" ] || continue
  for src in "$src_dir"/*; do
    [ -f "$src" ] || continue
    dst="$config_dir/$sub/$(basename "$src")"
    if [ -f "$dst" ] && ! cmp -s "$src" "$dst"; then
      cp "$dst" "$dst.bak.$(date +%Y%m%d%H%M%S)"
      printf 'Refreshed %s (previous copy backed up).\n' "$dst" >&2
    fi
    install -Dm644 "$src" "$dst"
  done
done
"$HOME/.local/bin/okt" init --name Omakiten --slug omakiten --root "$PWD"
'''

[tasks."install:mcp:claude"]
description = "Install Omakiten MCP server into Claude Code config"
depends = ["build"]
run = '''
if [ -z "${HOME:-}" ]; then
  printf 'HOME is not set\n' >&2
  exit 1
fi
bin/okt mcp setup --harness claude-code --force
'''

[tasks."install:mcp:claude-desktop"]
description = "Install Omakiten MCP server into Claude Desktop config"
depends = ["build"]
run = '''
if [ -z "${HOME:-}" ]; then
  printf 'HOME is not set\n' >&2
  exit 1
fi
bin/okt mcp setup --harness claude-desktop --force
'''

[tasks."install:mcp:opencode"]
description = "Install Omakiten MCP server into OpenCode global config"
depends = ["build"]
run = '''
if [ -z "${HOME:-}" ]; then
  printf 'HOME is not set\n' >&2
  exit 1
fi
bin/okt mcp setup --harness opencode --force
'''

[tasks.uninstall]
description = "Remove the locally installed okt binary without deleting config or data"
run = '''
if [ -z "${HOME:-}" ]; then
  printf 'HOME is not set\n' >&2
  exit 1
fi
rm -f "$HOME/.local/bin/okt"
'''

[tasks.purge]
description = "Remove Omakiten user config and data created by the production-like install"
run = '''
if [ -z "${HOME:-}" ]; then
  printf 'HOME is not set\n' >&2
  exit 1
fi
rm -rf "$HOME/.config/omakiten" "$HOME/.local/share/omakiten"
'''

[tasks.tui]
description = "Start the Omakiten TUI with local dev state under dev_env/"
env = { OMAKITEN_HOME = "dev_env" }
run = "mkdir -p dev_env && go run ./cmd/okt init --name Omakiten --slug omakiten >/dev/null && go run ./cmd/okt --project omakiten tui"

[tasks.lint]
description = "Run Go linter"
run = "golangci-lint run"

[tasks.vuln]
description = "Run Go vulnerability scan"
run = "govulncheck ./..."

[tasks.check]
description = "Run the full verification suite"
depends = ["test", "lint", "vuln"]
