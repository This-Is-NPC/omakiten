name: Installer Assurance

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install pinned ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          version="0.11.0"
          archive="shellcheck-v${version}.linux.x86_64.tar.xz"
          curl -fsSLO "https://github.com/koalaman/shellcheck/releases/download/v${version}/${archive}"
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  ${archive}" | sha256sum -c -
          tar -xJf "$archive"
          echo "$PWD/shellcheck-v${version}" >>"$GITHUB_PATH"

      - name: Run ShellCheck
        shell: bash
        run: shellcheck install.sh scripts/release-installer-gate.sh

  installer-assurance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.13"

      - name: Install Cosign on Linux and macOS
        if: runner.os != 'Windows'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.1.1"

      - name: Install Cosign on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: go install github.com/sigstore/cosign/v3/cmd/cosign@v3.1.1

      - name: Run installer and release assurance tests
        if: runner.os != 'Windows'
        shell: bash
        run: OKT_REQUIRE_REAL_COSIGN=1 go test ./internal/installscript ./internal/releasemeta ./internal/releaseverify

      - name: Run Windows-native installer assurance tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:OKT_REQUIRE_REAL_COSIGN = "1"
          go test ./internal/installscript -run 'TestRealCosignOfflinePositivePath|TestInstallerSemVerParity/powershell'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path ./install.ps1), [ref]$null, [ref]$errors) > $null
          if ($errors.Count) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }

      - name: Run Windows-native config safe I/O tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: go test ./internal/config -run '^TestWindows' -count=1

  cross-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: plan9
            goarch: amd64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.13"

      - name: Compile filesystem safety packages
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          go test -c -o "$RUNNER_TEMP/omakiten-config-${GOOS}-${GOARCH}.test" ./internal/config
          go test -c -o "$RUNNER_TEMP/omakiten-paths-${GOOS}-${GOARCH}.test" ./internal/paths
