name: CI

on:
  pull_request:
    branches: [master]
    paths:
      - "**.md"
      - ".docs/**"
      - "CHANGELOG.md"

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Doc-only diff — Go pipeline skipped
        run: |
          echo "Doc-only diff: the main CI workflow is filtered out via paths-ignore."
          echo "This companion job posts the same 'build-test' check name so branch"
          echo "protection rules requiring 'build-test' stay satisfied without burning"
          echo "a full Go test/lint run."
