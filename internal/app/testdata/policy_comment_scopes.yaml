# Scenario: scope-aware comment policy (omakiten #389).
#   - workflows[].defaults.comment declares per-scope sub-blocks:
#       task:      edit=false  → task comments cannot be edited (default chain)
#       project:   edit=true   → project comments may be edited
#       universal: edit=false  → universal comments cannot be edited
#   - bucket "dev" additionally pins permissions.comment.edit=false so a task
#     comment sitting in dev is blocked at the bucket layer too.
#
# Proves: a task comment is blocked while a project comment with
# defaults.comment.project.edit=true is allowed — both task-less scopes
# resolve without a GetTaskByID call.
version: 1
kit:
  id: 1
  key: default
  name: Default
config:
  context:
    default_level: 2
    max_tokens: 12000
  workflow:
    active: default
  theme:
    active: catppuccin
workflows:
  - id: 1
    key: default
    name: Default
    defaults:
      comment:
        task:
          edit: false
        project:
          edit: true
        universal:
          edit: false
    buckets:
      - id: 1
        key: backlog
        name: Backlog
        position: 1
        permissions:
          comment:
            edit: false
      - id: 2
        key: dev
        name: Development
        position: 2
    transitions:
      - from: 1
        to: 2
