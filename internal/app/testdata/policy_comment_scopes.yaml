# Scenario: scope-aware comment policy (omakiten #389).
#   - workflows[].defaults.comment declares per-scope sub-blocks:
#       task:      edit=false  → task comments cannot be edited (default chain)
#       project:   edit=true   → project comments may be edited
#       universal: edit=false  → universal comments cannot be edited
#   - bucket "backlog" additionally pins permissions.comment.edit=false so a
#     task comment sitting in backlog is blocked at the bucket layer too.
#   - bucket "dev" declares NO permissions, so a task comment there resolves
#     purely through the defaults chain (defaults.comment.task.*) — this is the
#     bucket-free path that exercises #389's designed chain end to end.
#
# Proves: a task comment is blocked (bucket AND defaults), a project comment
# with defaults.comment.project.edit=true is allowed, and delete is denied for
# task/project via defaults.comment.<scope>.delete=false — all task-less scopes
# resolve without a GetTaskByID call.
version: 1
kit:
  id: 1
  key: default
  name: Default
config:
  context:
    default_level: 2
    max_tokens: 12000
  workflow:
    active: default
  theme:
    active: catppuccin
workflows:
  - id: 1
    key: default
    name: Default
    defaults:
      comment:
        task:
          edit: false
          delete: false
        project:
          edit: true
          delete: false
        universal:
          edit: false
    buckets:
      - id: 1
        key: backlog
        name: Backlog
        position: 1
        permissions:
          comment:
            edit: false
      - id: 2
        key: dev
        name: Development
        position: 2
    transitions:
      - from: 1
        to: 2
