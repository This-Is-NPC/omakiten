# Scenario: workflow.defaults declares both task and comment; one bucket
# overrides only comment.delete. Expected behavior:
#   - bucket "backlog" (no permissions block): task and comment use
#     workflow.defaults — task.edit=true, task.delete=false,
#     comment.edit=true, comment.delete=false.
#   - bucket "dev" (permissions.comment.delete=true only): comment.delete
#     uses the bucket override (true); the other three fields fall through
#     to workflow.defaults — comment.edit=true, task.edit=true,
#     task.delete=false.
#
# Proves partial overrides at the bucket layer: only declared fields
# replace the workflow default, the rest keep flowing through the chain.
version: 1
kit:
  id: 1
  key: default
  name: Default
config:
  context:
    default_level: 2
    max_tokens: 12000
  workflow:
    active: default
  theme:
    active: catppuccin
workflows:
  - id: 1
    key: default
    name: Default
    defaults:
      task:
        edit: true
        delete: false
      comment:
        edit: true
        delete: false
    buckets:
      - id: 1
        key: backlog
        name: Backlog
        position: 1
      - id: 2
        key: dev
        name: Development
        position: 2
        permissions:
          comment:
            delete: true
    transitions:
      - from: 1
        to: 2
