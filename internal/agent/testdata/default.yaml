# Scenario: minimal bundle for agent service tests. 3 buckets
# (backlog → dev → done), permissive defaults so policy stays out of
# the way. Skills/Personas/Laws are wired in Go (yaml:"-" on the bundle).
version: 1
kit:
  id: 1
  key: default
  name: Default
config:
  output:
    json_minified: true
    omit_empty: true
  workflow:
    active: default
  theme:
    active: catppuccin
workflows:
  - id: 1
    key: default
    name: Default
    defaults:
      task:    { edit: true, delete: true }
      comment: { edit: true, delete: true }
    buckets:
      - id: 1
        key: backlog
        name: Backlog
        position: 1
      - id: 2
        key: dev
        name: Development
        position: 2
      - id: 3
        key: done
        name: Done
        position: 3
    transitions:
      - from: 1
        to: 2
