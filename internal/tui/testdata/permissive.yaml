# Scenario: 2-bucket workflow with task + comment edit/delete allowed
# on every bucket. Used by tests that exercise the success path of the
# delete/edit keybindings (the policy gate must NOT block them).
version: 1
kit:
  id: 1
  key: default
  name: Default
config:
  output:
    json_minified: true
    omit_empty: true
  context:
    default_level: 2
    max_tokens: 12000
  workflow:
    active: default
  theme:
    active: catppuccin
workflows:
  - id: 1
    key: default
    name: Default
    defaults:
      task:    { edit: true, delete: true }
      comment: { edit: true, delete: true }
    buckets:
      - id: 1
        key: backlog
        name: Backlog
        position: 1
      - id: 2
        key: dev
        name: Development
        position: 2
    transitions:
      - from: 1
        to: 2
